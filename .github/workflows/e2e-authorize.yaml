name: E2E / Authorize PR commit
run-name: >-
  authorize-e2e:${{ inputs.pr_number || github.event.pull_request.number }}/${{ inputs.head_sha || github.event.pull_request.head.sha }}

on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to authorize for E2E (including your own PR)
        required: true
        type: string
      head_sha:
        description: Exact full PR head SHA to authorize
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write
  issues: write

jobs:
  authorize:
    name: Authorize exact PR commit for E2E
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || github.event.label.name == 'e2e:authorize')
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Record authorization
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./scripts/e2e-readiness.cjs').authorize({github, context, core});
      - name: Consume authorization request label
        if: always() && github.event_name == 'pull_request_target'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./scripts/e2e-readiness.cjs').consumeAuthorizationLabel({github, context, core});
