name: E2E / Main Scheduler
run-name: main · schedule scenarios · ${{ github.sha }}

on:
  push:
    branches: ['main']
    paths:
      - go.mod
      - go.sum
      - main.go
      - '*.go'
      - internal/**
      - test/e2e/**
      - Makefile
      - .goreleaser.yml
      - .github/workflows/e2e.yaml
      - .github/workflows/e2e-main-debounce.yaml
      - scripts/e2e_replay*.py
      - scripts/e2e-replay-isolated.sh

permissions:
  actions: write
  contents: read

env:
  DO_NOT_TRACK: "1"

# Restart the timer on every matching main push. Only a quiet period dispatches
# the real E2E workflow.
concurrency:
  group: kongctl-e2e-main-debounce
  cancel-in-progress: true

jobs:
  dispatch:
    name: Schedule latest-main scenario run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Wait 15 minutes for main to settle
        run: sleep 900

      - name: Dispatch latest-main scenario run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest_main_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq '.object.sha'
          )"
          echo "Latest ${GITHUB_REF_NAME} SHA: ${latest_main_sha}"

          gh api \
            --method GET \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/e2e.yaml/runs" \
            -f event=workflow_dispatch \
            -f status=queued \
            -f branch="${GITHUB_REF_NAME}" \
            -f per_page=100 \
            --jq '.workflow_runs[] | select(.display_title | startswith("main · scenarios · debounced · ")) | .id' |
            while IFS= read -r run_id; do
              if [ -n "${run_id}" ]; then
                echo "Canceling older queued debounced E2E run ${run_id}."
                gh api \
                  --method POST \
                  "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" \
                  >/dev/null
              fi
            done

          gh workflow run e2e.yaml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF_NAME}" \
            -f dispatch_source=main-debounce \
            -f main_sha="${latest_main_sha}"
