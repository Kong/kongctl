name: E2E / Main Scheduler
run-name: main · overnight validation · ${{ github.event_name }}

on:
  schedule:
    # One new opportunity daily; retries only consume a pending opportunity.
    - cron: '7 7 * * *'
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      recover_reservation:
        description: Recover a missing dispatch after inspecting Actions (ten-minute grace)
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  pull-requests: read
  statuses: read

env:
  DO_NOT_TRACK: "1"
  KONNECT_ENVIRONMENT: ${{ vars.KONGCTL_E2E_KONNECT_ENV || '' }}

# Serialize durable reservation updates, including manual requests and retries.
concurrency:
  group: kongctl-e2e-main-scheduler
  queue: max
  cancel-in-progress: false

jobs:
  dispatch:
    name: Reconcile overnight main validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout trusted scheduler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Reconcile and reserve latest main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./scripts/e2e-main.cjs').reconcile({github, context, core});
