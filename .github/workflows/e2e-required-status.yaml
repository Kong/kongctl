name: E2E / Required Status

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: [CI Test, Checks, E2E / Scenario Suite]
    types: [completed]
  # Actions has no pull_request_review_thread trigger. Reconcile resolution,
  # unresolution, missed events, and fork reviews using trusted default code.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR to reevaluate (empty reevaluates all open PRs)
        type: string
        default: ''
      retry:
        description: Retry failed/cancelled validation or an interrupted reservation
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write

env:
  DO_NOT_TRACK: "1"
  KONNECT_ENVIRONMENT: ${{ vars.KONGCTL_E2E_KONNECT_ENV || '' }}

# One writer for dispatch reservations and the aggregate status. Never cancel
# an evaluator between reserving a key and dispatching its workflow.
concurrency:
  group: e2e-readiness-controller
  queue: max
  cancel-in-progress: false

jobs:
  e2e-required-status:
    name: Reconcile E2E readiness
    if: >-
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
       github.event.label.name == 'e2e:force-live' || github.event.label.name == 'konnect-env:tech') &&
      (github.event_name != 'pull_request_review' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      konnect_environment: ${{ steps.status.outputs.konnect_environment }}
      required: ${{ steps.status.outputs.required }}
      fork_pull_request: ${{ steps.status.outputs.fork_pull_request }}
      pr_number: ${{ steps.status.outputs.pr_number }}
      pr_head_sha: ${{ steps.status.outputs.pr_head_sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile current PR state
        id: status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./scripts/e2e-readiness.cjs').reconcile({github, context, core});

  trusted-e2e-required-comment:
    name: Request trusted run for fork PR
    needs:
      - e2e-required-status
    if: >-
      ${{
        github.event_name == 'pull_request_target' &&
        needs.e2e-required-status.outputs.required == 'true' &&
        needs.e2e-required-status.outputs.fork_pull_request == 'true'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Post trusted-run instructions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          KONNECT_ENVIRONMENT: ${{ needs.e2e-required-status.outputs.konnect_environment }}
          PR_NUMBER: ${{ needs.e2e-required-status.outputs.pr_number }}
          PR_HEAD_SHA: ${{ needs.e2e-required-status.outputs.pr_head_sha }}
        with:
          script: |
            const trustedCommentMarker = '<!-- kongctl-trusted-e2e-status -->';
            const prNumber = Number(process.env.PR_NUMBER);
            const prHeadSHA = process.env.PR_HEAD_SHA;
            const defaultBranch = context.payload.repository.default_branch;
            const trustedCommand = [
              `gh workflow run e2e.yaml --repo ${process.env.GITHUB_REPOSITORY}`,
              `--ref ${defaultBranch}`,
              `-f trusted_pr_number=${prNumber}`,
              `-f trusted_head_sha=${prHeadSHA}`,
              `-f konnect_environment=${process.env.KONNECT_ENVIRONMENT}`,
            ].join(' ');
            const body = [
              trustedCommentMarker,
              'Trusted E2E is required for this fork PR.',
              '',
              `- PR: #${prNumber}`,
              `- Reviewed SHA: \`${prHeadSHA}\``,
              '- Status: `pending`',
              '- Trusted run: not started',
              '',
              'After maintainer review, run trusted E2E from the base repository:',
              '',
              '```bash',
              trustedCommand,
              '```',
              '',
              'This trusted E2E result will apply only to the exact reviewed SHA above. Re-run trusted E2E if the contributor pushes another commit.',
            ].join('\n');

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              });
              const existing = comments.find((comment) =>
                comment.body?.includes(trustedCommentMarker) &&
                comment.user?.login === 'github-actions[bot]'
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body,
                });
              }
            } catch (error) {
              const errorMessage = error?.message ?? String(error);
              core.warning(`Unable to create or update trusted E2E PR comment: ${errorMessage}`);
            }

            await core.summary
              .addHeading('Trusted Fork E2E')
              .addList([
                'Status: pending',
                `PR: #${prNumber}`,
                `Reviewed SHA: ${prHeadSHA}`,
                'Trusted run: not started',
              ])
              .write();
