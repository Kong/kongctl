# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    - go generate ./...
builds:
  - id: kongctl
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
notarize:
  macos:
    - enabled: 'true'
      ids: [kongctl]
      sign:
        certificate: '{{ .Env.APPLE_SIGNING_CERTIFICATE_P12_BASE64 }}'
        password: '{{ .Env.APPLE_SIGNING_CERTIFICATE_PASSWORD }}'
      notarize:
        issuer_id: '{{ .Env.APPLE_NOTARY_API_ISSUER_ID }}'
        key_id: '{{ .Env.APPLE_NOTARY_API_KEY_ID }}'
        key: '{{ .Env.APPLE_NOTARY_KEY_PATH }}'
        wait: true
        timeout: 20m
archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    formats: ['zip']
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
release:
  # Native macOS verification in release.md must approve these exact assets.
  draft: true
  prerelease: auto
  make_latest: false
dockers_v2:
  - dockerfile: Dockerfile
    ids:
      - kongctl
    images:
      - ghcr.io/kong/kongctl
      - kong/kongctl
    tags:
      - v{{ .Version }}
      - '{{ .Version }}'
      - '{{ .Major }}.{{ .Minor }}'
      - '{{ if not .Prerelease }}latest{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
homebrew_casks:
  - repository:
      owner: kong
      name: homebrew-kongctl
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
      branch: main 
      pull_request:
        enabled: false
    commit_author:
      name: Rick Spurgeon 
      email: rspurgeon@users.noreply.github.com
    homepage: "https://github.com/kong/kongctl"
    description: Developer CLI for Kong
    custom_block: |
      disable! date: "2027-02-08",
               because: "has been replaced by the Homebrew formula",
               replacement_formula: "kong/kongctl/kongctl"
    caveats: |
      The kongctl Homebrew cask is deprecated and will be disabled on February 8, 2027.
      Switch to the Homebrew formula by running:

        brew uninstall --cask kong/kongctl/kongctl
        brew install --formula kong/kongctl/kongctl

      For more information, see:
        https://developer.konghq.com/kongctl/troubleshooting/
    skip_upload: true
