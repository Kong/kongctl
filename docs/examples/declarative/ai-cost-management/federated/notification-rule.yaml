_defaults:
  kongctl:
    namespace: ai-cost-example-operations

ai:
  cost_management:
    budgets:
      - ref: shared-budget
        _external:
          id: !env AI_COST_EXAMPLE_BUDGET_ID

    notification_rules:
      - budget: shared-budget
        thresholds:
          - percent: 90
        channels:
          - id: !ref operations-email#id

    notification_channels:
      - ref: operations-email
        name: Example operations alerts
        type: email
        email:
          recipients: [ai-ops@example.com]
