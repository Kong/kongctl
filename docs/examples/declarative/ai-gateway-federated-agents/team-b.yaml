_defaults:
  kongctl: {namespace: agents-team-b}
ai_gateway_agents:
  - ref: agent-b
    ai_gateway: !lookup {name: federated-agents-e2e}
    name: agent-b
    type: http
    display_name: Team b agent
    managed_by: {inventory: retained}
    labels: {team: b}
    config:
      url: https://example.com
      route: {paths: [/agent-b]}
    access: {auth_strategies: [shared-auth]}
    policies: [shared-policy]
