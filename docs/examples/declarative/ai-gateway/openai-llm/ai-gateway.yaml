_defaults:
  kongctl:
    namespace: openai-llm-example

ai_gateways:
  - ref: openai-llm
    name: openai-llm
    display_name: OpenAI LLM Gateway
    description: Routes OpenAI-compatible chat traffic to OpenAI
    proxy_urls:
      - host: localhost
        port: 8000
        protocol: http
    labels:
      example: openai-llm
    data_plane_certificates:
      - ref: openai-llm-data-plane
        title: openai-llm-data-plane
        description: Local Docker data plane
        cert: !file ./certs/data-plane.crt
    model_providers:
      - ref: openai
        name: openai
        display_name: OpenAI
        type: openai
        config:
          auth:
            type: basic
            headers:
              - name: Authorization
                value: !secret
                  parts:
                    - "Bearer "
                    - !env OPENAI_API_KEY
    models:
      - ref: my-gpt-4o
        name: my-gpt-4o
        display_name: My GPT-4o
        type: model
        formats:
          - type: openai
        config:
          route:
            paths:
              - /v1
            model:
              body_param: model
              values:
                - my-gpt-4o
        targets:
          - name: gpt-4o
            provider: openai
            config:
              type: openai
        policies: []
        capabilities:
          - generate
