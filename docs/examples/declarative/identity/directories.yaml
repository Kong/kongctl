_defaults:
  kongctl:
    namespace: identity-team

identity:
  directories:
    - ref: people
      name: people
      description: People and service identities
      # Organizations with a one-directory quota require this to be true.
      allow_all_control_planes: true
      allowed_control_planes: []
      ttl_secs: 600
      negative_ttl_secs: 600
      vault_enabled: false
      labels:
        team: identity
      kongctl:
        protected: true
