# Manage ordinary groups under the existing default directory.
# Membership declarations are a separate implementation slice.
_defaults:
  kongctl:
    namespace: identity-groups

identity:
  directories:
    - ref: default-directory
      _external:
        selector:
          matchFields:
            name: default
      groups:
        - ref: fulfillment
          # API names allow only ASCII letters and digits.
          name: FulfillmentOperators
          type: group
          description: Principals authorized to handle fulfillment
          metadata:
            department: fulfillment
            privileged: false
            roles: [reader, writer]
            levels: [1, 2]
          labels:
            team: fulfillment
        - ref: auditors
          name: OrderAuditors
          description: Principals authorized to audit orders
          labels:
            team: finance
