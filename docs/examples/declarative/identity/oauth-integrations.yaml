_defaults:
  kongctl:
    namespace: identity-directory

identity:
  directories:
    - ref: default-directory
      name: default
      allow_all_control_planes: true
      vault:
        enabled: true
        keys:
          # Replace this sample public key; keep the matching private key.
          - ref: oauth-encryption-key
            name: oauth-encryption
            public_key: !file vault-public-key.pem
        providers:
          # The OAuth application is registered with the upstream service.
          - ref: github
            name: github-work
            template_name: github
            client_id: !env VAULT_GITHUB_CLIENT_ID
            client_secret: !secret {source: !env VAULT_GITHUB_CLIENT_SECRET}
            credential_type: user
            enabled: true
            scopes: [repo, "read:org"]
            pkce_enabled: true
            refresh_buffer_seconds: 60

          # Replace these example endpoints with your upstream OAuth service.
          - ref: partner-oauth
            name: partner-service
            template_name: custom-oauth
            credential_type: user
            dcr_enabled: true
            enabled: false
            scopes: [read]
            token_endpoint: https://upstream.example.test/oauth/token
            authorization_endpoint: https://upstream.example.test/oauth/authorize
            registration_endpoint: https://upstream.example.test/oauth/register
            pkce_enabled: true
            refresh_buffer_seconds: 120

          # Register this OAuth application with the upstream service first.
          - ref: shared-github
            name: github-shared
            template_name: github
            client_id: !env VAULT_GITHUB_CLIENT_ID
            client_secret: !secret {source: !env VAULT_GITHUB_CLIENT_SECRET}
            credential_type: shared
            scopes: [repo]
            enabled: true
            pkce_enabled: true
            refresh_buffer_seconds: 60
