_defaults:
  kongctl:
    namespace: identity-team

identity:
  directories:
    - ref: people
      _external:
        selector:
          matchFields:
            name: default
      principals:
        - ref: jane-doe
          display_name: Jane Doe
          description: Example human principal
          type: user
          active: true
          metadata:
            department: engineering
            trusted: false
            attempts: 3
            roles: [reader, writer]
            levels: [1, 2]
          labels:
            team: identity
          kongctl:
            protected: true
        - ref: support-agent
          display_name: Support agent
          description: Example deployed AI agent
          type: agent
          # Inactive principals cannot authenticate. Requires API active support.
          active: false
        - ref: unclassified
          display_name: Unclassified principal
          type: null
