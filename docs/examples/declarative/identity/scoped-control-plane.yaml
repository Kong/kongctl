# Advanced configuration of an adopted/managed default directory.
# This requires an organization that allows restricted directory access.
_defaults:
  kongctl:
    namespace: identity-directory

control_planes:
  - ref: gateway
    name: Identity Gateway

identity:
  directories:
    - ref: default-directory
      name: default
      allow_all_control_planes: false
      allowed_control_planes:
        - !ref gateway#id
