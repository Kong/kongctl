_defaults:
  kongctl:
    namespace: identity-trust-example

identity:
  directories:
    - ref: people
      _external:
        selector:
          matchFields:
            name: default

  principals:
    - ref: staff-user
      directory: people
      display_name: Staff user
      type: user
      active: true
      metadata:
        department: fulfillment
      identities:
        - ref: staff-login
          type: oidc
          issuer: !env KONGCTL_IDENTITY_TRUSTED_ISSUER
          claim:
            name: sub
            value: employee-42
