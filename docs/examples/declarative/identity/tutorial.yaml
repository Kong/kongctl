# Use the platform-provided default directory without claiming its ownership.
_defaults:
  kongctl:
    namespace: ki-tutorial

identity:
  directories:
    - ref: tutorial-directory
      _external:
        selector:
          matchFields:
            name: default
      principals:
        - ref: tutorial-user
          display_name: Tutorial user
          description: A human principal
          type: user
          metadata:
            department: engineering
          labels:
            purpose: tutorial
        - ref: tutorial-agent
          display_name: Tutorial agent
          description: A deployed AI agent principal
          type: agent
