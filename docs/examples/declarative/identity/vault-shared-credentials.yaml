_defaults:
  kongctl:
    namespace: identity-directory

identity:
  directories:
    - ref: default-directory
      name: default
      allow_all_control_planes: true
      vault_enabled: true
      vault_keys:
        # Replace this sample with your public key; retain its private key.
        - ref: encryption-key
          name: billing-encryption
          public_key: !file vault-public-key.pem
      vault_providers:
        - ref: billing-token
          name: billing-service
          template_name: static_secret
          credential_type: shared
          shared_credentials:
            # Omitting selector/priority selects the single default slot.
            - ref: default-token
              secret: !secret {source: !env BILLING_SHARED_SECRET}
            # This literal selector matches every caller, ahead of the default.
            - ref: preferred-token
              selector: "true"
              priority: 0
              secret: !secret
                source: !file ./secrets/billing-priority-token.txt
