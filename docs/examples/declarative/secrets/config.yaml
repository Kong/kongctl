_defaults:
  kongctl:
    namespace: secrets-example

dcr_providers:
  - ref: secrets-http-dcr
    name: secrets-example-http-dcr
    display_name: Secrets Example HTTP DCR Provider
    provider_type: http
    issuer: https://issuer.example.com
    dcr_config:
      dcr_base_url: https://dcr.example.com/v1/register
      api_key: !secret {source: !env DCR_API_KEY}
    labels:
      example: secrets

ai_gateways:
  - ref: secrets-ai-gateway
    name: secrets-example-ai-gateway
    display_name: Secrets Example AI Gateway
    description: Demonstrates deferred secret sources and explicit writes
    proxy_urls:
      - host: secrets-ai.example.com
        port: 443
        protocol: https
    labels:
      example: secrets
    model_providers:
      - ref: secrets-openai-provider
        name: secrets-openai-provider
        type: openai
        display_name: Secrets Example OpenAI Provider
        config:
          auth:
            type: basic
            headers:
              - name: Authorization
                value: !secret
                  parts:
                    - "Bearer "
                    - !env OPENAI_API_KEY
    consumers:
      - ref: secrets-client
        name: secrets-client
        type: api-key
        display_name: Secrets Example Client
        credentials:
          - ref: secrets-client-key
            name: secrets-client-key
            type: api-key
            display_name: Secrets Example Client Key
            api_key: !secret {source: !env CLIENT_API_KEY}
            ttl: 0
