vars:
  gateway_name: adopt-e2e-ai-gateway
  gateway_display_name: Adopt E2E AI Gateway
  gateway_description: AI Gateway for adopt E2E test
  namespace: ai-gateway-adopt-e2e

steps:
  - name: 000-reset
    skipInputs: true
    commands:
      - resetOrg: true

  - name: 001-bootstrap-create
    commands:
      - name: plan-create-ai-gateway
        outputFormat: disable
        stdoutFile: "{{ .workdir }}/bootstrap-plan.json"
        run:
          - plan
          - -f
          - "{{ .workdir }}/config.yaml"
          - --mode
          - apply
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 1
                by_action.CREATE: 1
          - select: "changes[?resource_type=='ai_gateway' && resource_ref=='{{ .vars.gateway_name }}'] | [0]"
            expect:
              fields:
                action: CREATE
                fields.name: "{{ .vars.gateway_name }}"
                fields.display_name: "{{ .vars.gateway_display_name }}"
                fields.description: "{{ .vars.gateway_description }}"
      - name: apply-create-ai-gateway
        outputFormat: json
        run:
          - apply
          - --plan
          - "{{ .workdir }}/bootstrap-plan.json"
          - --auto-approve
        assertions:
          - select: summary
            expect:
              fields:
                applied: 1
                failed: 0
                status: success

  - name: 002-adopt-ai-gateway
    skipInputs: true
    commands:
      - name: adopt-ai-gateway
        run:
          - adopt
          - ai-gateway
          - "{{ .vars.gateway_display_name }}"
          - --namespace
          - "{{ .vars.namespace }}"
        assertions:
          - expect:
              fields:
                action: CREATE
                resource_type: ai_gateway
                resource_ref: "{{ .vars.gateway_display_name }}"
                namespace: "{{ .vars.namespace }}"

  - name: 003-apply-adopt-plan
    skipInputs: true
    commands:
      - name: apply-adopt-plan
        outputFormat: json
        run:
          - apply
          - --plan
          - "{{ .workdir }}/plan.json"
          - --auto-approve
        assertions:
          - select: summary
            expect:
              fields:
                applied: 1
                failed: 0
                status: success
      - name: verify-adopted-ai-gateway
        run:
          - get
          - ai-gateways
          - -o
          - json
        assertions:
          - select: "[?display_name=='{{ .vars.gateway_display_name }}'] | [0]"
            expect:
              fields:
                name: "{{ .vars.gateway_name }}"
                display_name: "{{ .vars.gateway_display_name }}"
                labels."KONGCTL-namespace": "{{ .vars.namespace }}"

  - name: 004-dump-and-sync-plan
    skipInputs: true
    commands:
      - name: dump-ai-gateways
        run:
          - dump
          - declarative
          - "--resources=ai_gateways"
          - "--default-namespace={{ .vars.namespace }}"
        outputFormat: none
        parseAs: yaml
        stdoutFile: "{{ .workdir }}/dump.yaml"
        assertions:
          - select: "ai_gateways[?display_name=='{{ .vars.gateway_display_name }}'] | [0]"
            expect:
              fields:
                name: "{{ .vars.gateway_name }}"
                display_name: "{{ .vars.gateway_display_name }}"
          - select: "_defaults.kongctl"
            expect:
              fields:
                namespace: "{{ .vars.namespace }}"
      - name: plan-sync-idempotent
        outputFormat: disable
        run:
          - plan
          - -f
          - "{{ .workdir }}/dump.yaml"
          - --mode
          - sync
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 0

  - name: 005-cleanup
    skipInputs: true
    commands:
      - name: delete
        run:
          - delete
          - -f
          - "{{ .scenario_dir }}/cleanup.yaml"
          - --auto-approve
        assertions:
          - select: plan.summary
            expect:
              fields:
                total_changes: 1
                by_action.DELETE: 1
          - select: summary
            expect:
              fields:
                failed: 0
                status: success
