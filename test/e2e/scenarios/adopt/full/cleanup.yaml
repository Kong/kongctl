control_planes:
  - ref: adopt-e2e-cp
    name: adopt-e2e-cp
    description: "Adopt Scenario Control Plane"
    cluster_type: "CLUSTER_TYPE_CONTROL_PLANE"
    kongctl:
      namespace: team-e2e-overwrite
      protected: false

portals:
  - ref: adopt-e2e-portal
    name: adopt-e2e-portal
    display_name: "Adopt Scenario Portal"
    kongctl:
      namespace: team-e2e-overwrite
      protected: false

apis:
  - ref: adopt-e2e-api
    name: adopt-e2e-api
    description: "Adopt Scenario API"
    kongctl:
      namespace: team-e2e-overwrite
      protected: false

ai_gateways:
  - ref: adopt-e2e-ai-gateway
    name: adopt-e2e-ai-gateway
    display_name: "Adopt E2E AI Gateway"
    description: "Adopt Scenario AI Gateway"
    kongctl:
      namespace: team-e2e-overwrite
      protected: false

dcr_providers:
  - ref: adopt-e2e-dcr-provider
    name: adopt-e2e-dcr-provider
    provider_type: http
    issuer: https://e2e-adopt-dcr.example.com/oauth2/default
    kongctl:
      namespace: team-e2e-overwrite
      protected: false

analytics:
  dashboards:
    - ref: adopt-e2e-dashboard
      name: Adopt E2E Dashboard
      definition:
        tiles: []
      kongctl:
        namespace: team-e2e-overwrite
        protected: false
