vars:
  portal_name: adopt-e2e-portal
  api_name: adopt-e2e-api
  cp_name: adopt-e2e-cp
  ai_gateway_name: adopt-e2e-ai-gateway
  ai_gateway_display_name: Adopt E2E AI Gateway
  dcr_provider_name: adopt-e2e-dcr-provider
  dcr_provider_issuer: https://e2e-adopt-dcr.example.com/oauth2/default
  dashboard_name: Adopt E2E Dashboard
  namespace: team-e2e
  overwrite_namespace: team-e2e-overwrite

steps:
  - name: 000-reset
    skipInputs: true
    commands:
      - resetOrg: true

  - name: 001-create
    skipInputs: true
    commands:
      - name: create-cp
        create:
          resource: control_plane
          payload:
            inline:
              name: "{{ .vars.cp_name }}"
              description: "Adopt Scenario Control Plane"
              cluster_type: "CLUSTER_TYPE_CONTROL_PLANE"
          recordVar:
            name: cp_id
            responsePath: id
      - name: create-portal
        create:
          resource: portal
          payload:
            inline:
              name: "{{ .vars.portal_name }}"
              display_name: "Adopt Scenario Portal"
          recordVar:
            name: portal_id
            responsePath: id
      - name: create-api
        create:
          resource: api
          payload:
            inline:
              name: "{{ .vars.api_name }}"
              description: "Adopt Scenario API"
          recordVar:
            name: api_id
            responsePath: id
      - name: create-ai-gateway
        create:
          resource: ai_gateway
          payload:
            inline:
              name: "{{ .vars.ai_gateway_name }}"
              display_name: "{{ .vars.ai_gateway_display_name }}"
              description: "Adopt Scenario AI Gateway"
          recordVar:
            name: ai_gateway_id
            responsePath: id

      - name: create-dcr-provider
        create:
          resource: dcr_provider
          payload:
            inline:
              name: "{{ .vars.dcr_provider_name }}"
              provider_type: http
              issuer: "{{ .vars.dcr_provider_issuer }}"
              dcr_config:
                dcr_base_url: https://e2e-adopt-dcr.example.com/v1/dcr
                api_key: e2e_adopt_dcr_token
          recordVar:
            name: dcr_provider_id
            responsePath: id
      - name: create-dashboard
        create:
          resource: dashboard
          payload:
            inline:
              name: "{{ .vars.dashboard_name }}"
              definition:
                tiles: []
          recordVar:
            name: dashboard_id
            responsePath: id

  - name: 002-adopt
    skipInputs: true
    commands:
      - name: adopt-cp
        run:
          - adopt
          - control-plane
          - "{{ .vars.cp_id }}"
          - --namespace
          - "{{ .vars.namespace }}"
        assertions:
          - expect:
              fields:
                namespace: "{{ .vars.namespace }}"
                id: "{{ .vars.cp_id }}"
                resource_type: control_plane
      - name: adopt-portal
        run:
          - adopt
          - portal
          - "{{ .vars.portal_id }}"
          - --namespace
          - "{{ .vars.namespace }}"
        assertions:
          - expect:
              fields:
                namespace: "{{ .vars.namespace }}"
                id: "{{ .vars.portal_id }}"
                resource_type: portal
      - name: adopt-api
        run:
          - adopt
          - api
          - "{{ .vars.api_id }}"
          - --namespace
          - "{{ .vars.namespace }}"
        assertions:
          - expect:
              fields:
                namespace: "{{ .vars.namespace }}"
                id: "{{ .vars.api_id }}"
                resource_type: api
      - name: adopt-ai-gateway
        run:
          - adopt
          - ai-gateway
          - "{{ .vars.ai_gateway_id }}"
          - --namespace
          - "{{ .vars.namespace }}"
        assertions:
          - expect:
              fields:
                namespace: "{{ .vars.namespace }}"
                id: "{{ .vars.ai_gateway_id }}"
                resource_type: ai_gateway

      - name: adopt-dcr-provider
        run:
          - adopt
          - dcr-provider
          - "{{ .vars.dcr_provider_name }}"
          - --namespace
          - "{{ .vars.namespace }}"
        assertions:
          - expect:
              fields:
                namespace: "{{ .vars.namespace }}"
                id: "{{ .vars.dcr_provider_id }}"
                resource_type: dcr_provider
      - name: adopt-dashboard
        run:
          - adopt
          - analytics
          - dashboard
          - "{{ .vars.dashboard_id }}"
          - --namespace
          - "{{ .vars.namespace }}"
        assertions:
          - expect:
              fields:
                namespace: "{{ .vars.namespace }}"
                id: "{{ .vars.dashboard_id }}"
                resource_type: dashboard

  - name: 003-reject-overwrite-without-flag
    skipInputs: true
    commands:
      - name: reject-portal-namespace-overwrite
        run:
          - adopt
          - portal
          - "{{ .vars.portal_id }}"
          - --namespace
          - "{{ .vars.overwrite_namespace }}"
        expectFailure:
          exitCode: 1
          contains: "already has namespace label"
      - name: verify-portal-namespace-unchanged
        run: ["get", "portals", "-o", "json"]
        assertions:
          - select: "[?id=='{{ .vars.portal_id }}'] | [0]"
            expect:
              fields:
                labels."KONGCTL-namespace": "{{ .vars.namespace }}"
      - name: reject-ai-gateway-namespace-overwrite
        run:
          - adopt
          - ai-gateway
          - "{{ .vars.ai_gateway_id }}"
          - --namespace
          - "{{ .vars.overwrite_namespace }}"
        expectFailure:
          exitCode: 1
          contains: "already has namespace label"
      - name: verify-ai-gateway-namespace-unchanged
        run: ["get", "ai-gateways", "-o", "json"]
        assertions:
          - select: "[?id=='{{ .vars.ai_gateway_id }}'] | [0]"
            expect:
              fields:
                labels."KONGCTL-namespace": "{{ .vars.namespace }}"

      - name: reject-dcr-provider-namespace
        run:
          - adopt
          - dcr-provider
          - "{{ .vars.dcr_provider_id }}"
          - --namespace
          - "{{ .vars.overwrite_namespace }}"
        expectFailure:
          exitCode: 1
          contains: "already has namespace label"
      - name: verify-dcr-provider-namespace-unchanged
        run: ["get", "dcr-providers", "-o", "json"]
        assertions:
          - select: "[?id=='{{ .vars.dcr_provider_id }}'] | [0]"
            expect:
              fields:
                labels."KONGCTL-namespace": "{{ .vars.namespace }}"
      - name: reject-dashboard-namespace
        run:
          - adopt
          - analytics
          - dashboard
          - "{{ .vars.dashboard_id }}"
          - --namespace
          - "{{ .vars.overwrite_namespace }}"
        expectFailure:
          exitCode: 1
          contains: "already has namespace label"
      - name: verify-dashboard-namespace-unchanged
        run: ["get", "analytics", "dashboards", "-o", "json"]
        assertions:
          - select: "[?id=='{{ .vars.dashboard_id }}'] | [0]"
            expect:
              fields:
                labels."KONGCTL-namespace": "{{ .vars.namespace }}"

  - name: 004-overwrite-namespace
    skipInputs: true
    commands:
      - name: overwrite-cp-namespace
        run:
          - adopt
          - control-plane
          - "{{ .vars.cp_id }}"
          - --namespace
          - "{{ .vars.overwrite_namespace }}"
          - --overwrite-namespace
        assertions:
          - expect:
              fields:
                namespace: "{{ .vars.overwrite_namespace }}"
                id: "{{ .vars.cp_id }}"
                resource_type: control_plane
          - name: control-plane-namespace-visible
            source:
              get: gateway control-planes
            retry:
              attempts: 6
              interval: 2s
              maxInterval: 2s
            select: "[?id=='{{ .vars.cp_id }}'] | [0]"
            expect:
              fields:
                labels."KONGCTL-namespace": "{{ .vars.overwrite_namespace }}"
      - name: overwrite-portal-namespace
        run:
          - adopt
          - portal
          - "{{ .vars.portal_id }}"
          - --namespace
          - "{{ .vars.overwrite_namespace }}"
          - --overwrite-namespace
        assertions:
          - expect:
              fields:
                namespace: "{{ .vars.overwrite_namespace }}"
                id: "{{ .vars.portal_id }}"
                resource_type: portal
      - name: overwrite-api-namespace
        run:
          - adopt
          - api
          - "{{ .vars.api_id }}"
          - --namespace
          - "{{ .vars.overwrite_namespace }}"
          - --overwrite-namespace
        assertions:
          - expect:
              fields:
                namespace: "{{ .vars.overwrite_namespace }}"
                id: "{{ .vars.api_id }}"
                resource_type: api
      - name: overwrite-ai-gateway-namespace
        run:
          - adopt
          - ai-gateway
          - "{{ .vars.ai_gateway_id }}"
          - --namespace
          - "{{ .vars.overwrite_namespace }}"
          - --overwrite-namespace
        assertions:
          - expect:
              fields:
                namespace: "{{ .vars.overwrite_namespace }}"
                id: "{{ .vars.ai_gateway_id }}"
                resource_type: ai_gateway

      - name: overwrite-dcr-provider-namespace
        run:
          - adopt
          - dcr-provider
          - "{{ .vars.dcr_provider_id }}"
          - --namespace
          - "{{ .vars.overwrite_namespace }}"
          - --overwrite-namespace
        assertions:
          - expect:
              fields:
                namespace: "{{ .vars.overwrite_namespace }}"
                id: "{{ .vars.dcr_provider_id }}"
                resource_type: dcr_provider
      - name: overwrite-dashboard-namespace
        run:
          - adopt
          - analytics
          - dashboard
          - "{{ .vars.dashboard_id }}"
          - --namespace
          - "{{ .vars.overwrite_namespace }}"
          - --overwrite-namespace
        assertions:
          - expect:
              fields:
                namespace: "{{ .vars.overwrite_namespace }}"
                id: "{{ .vars.dashboard_id }}"
                resource_type: dashboard

  - name: 005-dump-and-plan
    skipInputs: true
    commands:
      - name: dump
        run:
          - dump
          - declarative
          - "--resources=portals,control_planes,apis,ai_gateways,dcr_providers,analytics.dashboards"
          - --default-namespace
          - "{{ .vars.overwrite_namespace }}"
        outputFormat: none
        parseAs: yaml
        stdoutFile: "{{ .workdir }}/dump.yaml"
        assertions:
          - select: "control_planes[?ref=='{{ .vars.cp_id }}'] | [0]"
            expect:
              fields:
                name: "{{ .vars.cp_name }}"
          - select: "portals[?ref=='{{ .vars.portal_id }}'] | [0]"
            expect:
              fields:
                name: "{{ .vars.portal_name }}"
          - select: "apis[?ref=='{{ .vars.api_id }}'] | [0]"
            expect:
              fields:
                name: "{{ .vars.api_name }}"
          - select: "ai_gateways[?ref=='{{ .vars.ai_gateway_id }}'] | [0]"
            expect:
              fields:
                name: "{{ .vars.ai_gateway_name }}"
                display_name: "{{ .vars.ai_gateway_display_name }}"
          - select: "dcr_providers[?ref=='{{ .vars.dcr_provider_id }}'] | [0]"
            expect:
              fields:
                name: "{{ .vars.dcr_provider_name }}"
                provider_type: http
                issuer: "{{ .vars.dcr_provider_issuer }}"
                dcr_config.api_key: null
          - select: "analytics.dashboards[?ref=='{{ .vars.dashboard_id }}'] | [0]"
            expect:
              fields:
                name: "{{ .vars.dashboard_name }}"
                definition.tiles: []
          - select: "_defaults.kongctl"
            expect:
              fields:
                namespace: "{{ .vars.overwrite_namespace }}"
          - name: plan-converges
            source:
              plan: ["-f", "{{ .workdir }}/dump.yaml", "--mode", "apply"]
            retry:
              attempts: 3
              interval: 1s
              maxInterval: 2s
            select: summary
            expect:
              fields:
                total_changes: 0

  - name: 006-delete-cleanup
    skipInputs: true
    commands:
      - name: 000-plan-delete
        outputFormat: disable
        run:
          - plan
          - -f
          - "{{ .scenario_dir }}/cleanup.yaml"
          - --mode
          - delete
        assertions:
          - select: metadata
            expect:
              fields:
                mode: delete
          - select: summary
            expect:
              fields:
                total_changes: 6
                by_action.DELETE: 6
          - select: "changes[?resource_id=='{{ .vars.cp_id }}'] | [0]"
            expect:
              fields:
                action: DELETE
                resource_type: control_plane
          - select: "changes[?resource_id=='{{ .vars.portal_id }}'] | [0]"
            expect:
              fields:
                action: DELETE
                resource_type: portal
          - select: "changes[?resource_id=='{{ .vars.api_id }}'] | [0]"
            expect:
              fields:
                action: DELETE
                resource_type: api
          - select: "changes[?resource_id=='{{ .vars.ai_gateway_id }}'] | [0]"
            expect:
              fields:
                action: DELETE
                resource_type: ai_gateway
          - select: "changes[?resource_id=='{{ .vars.dcr_provider_id }}'] | [0]"
            expect:
              fields:
                action: DELETE
                resource_type: dcr_provider
          - select: "changes[?resource_id=='{{ .vars.dashboard_id }}'] | [0]"
            expect:
              fields:
                action: DELETE
                resource_type: dashboard

      - name: 001-delete
        run:
          - delete
          - -f
          - "{{ .scenario_dir }}/cleanup.yaml"
          - --auto-approve
        assertions:
          - select: summary
            expect:
              fields:
                failed: 0
                status: success

      - name: 002-get-control-planes
        run: ["get", "gateway", "control-planes", "-o", "json"]
        assertions:
          - select: "[?id=='{{ .vars.cp_id }}']"
            expect:
              fields:
                "length(@)": 0

      - name: 003-get-portals
        run: ["get", "portals", "-o", "json"]
        assertions:
          - select: "[?id=='{{ .vars.portal_id }}']"
            expect:
              fields:
                "length(@)": 0

      - name: 004-get-apis
        run: ["get", "apis", "-o", "json"]
        assertions:
          - select: "[?id=='{{ .vars.api_id }}']"
            expect:
              fields:
                "length(@)": 0

      - name: 005-get-ai-gateways
        run: ["get", "ai-gateways", "-o", "json"]
        assertions:
          - select: "[?id=='{{ .vars.ai_gateway_id }}']"
            expect:
              fields:
                "length(@)": 0

      - name: 006-get-dcr-providers
        run: ["get", "dcr-providers", "-o", "json"]
        assertions:
          - select: "[?id=='{{ .vars.dcr_provider_id }}']"
            expect:
              fields:
                "length(@)": 0

      - name: 007-get-dashboards
        run: ["get", "analytics", "dashboards", "-o", "json"]
        assertions:
          - select: "[?id=='{{ .vars.dashboard_id }}']"
            expect:
              fields:
                "length(@)": 0
