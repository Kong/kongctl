vars:
  team_name: e2e-adopt-test-team
  team_description: E2E test team for adopt and dump workflow
  namespace: team-e2e-test
  overwrite_namespace: team-e2e-test-overwrite

steps:
  - name: 000-reset
    skipInputs: true
    commands:
      - resetOrg: true

  - name: 001-create-adopt-dump-team
    skipInputs: true
    commands:
      - name: 000-create-org-team-via-api
        create:
          resource: organization_team
          recoverTeam: true
          payload:
            inline:
              name: "{{ .vars.team_name }}"
              description: "{{ .vars.team_description }}"
          recordVar:
            name: team_id
            responsePath: id

      - name: 001-adopt-team
        run:
          - adopt
          - org
          - team
          - "{{ .vars.team_id }}"
          - --namespace
          - "{{ .vars.namespace }}"
        assertions:
          - expect:
              fields:
                namespace: "{{ .vars.namespace }}"
                id: "{{ .vars.team_id }}"
                resource_type: organization_team
                name: "{{ .vars.team_name }}"

      - name: 002-overwrite-team-namespace
        run:
          - adopt
          - org
          - team
          - "{{ .vars.team_id }}"
          - --namespace
          - "{{ .vars.overwrite_namespace }}"
          - --overwrite-namespace
        assertions:
          - expect:
              fields:
                namespace: "{{ .vars.overwrite_namespace }}"
                id: "{{ .vars.team_id }}"
                resource_type: organization_team
                name: "{{ .vars.team_name }}"

      - name: 003-dump-teams
        run:
          - dump
          - declarative
          - "--resources=org.teams"
          - --default-namespace
          - "{{ .vars.overwrite_namespace }}"
        outputFormat: none
        parseAs: yaml
        stdoutFile: "{{ .workdir }}/dump.yaml"
        assertions:
          - select: "organization.teams[?ref=='{{ .vars.team_id }}'] | [0]"
            expect:
              fields:
                name: "{{ .vars.team_name }}"
                description: "{{ .vars.team_description }}"
          - select: "organization.teams[?ref=='{{ .vars.team_id }}'] | [0].kongctl"
            expect:
              fields:
                namespace: "{{ .vars.overwrite_namespace }}"
          - select: "_defaults.kongctl"
            expect:
              fields:
                namespace: "{{ .vars.overwrite_namespace }}"

      - name: 004-plan-from-dump
        outputFormat: disable
        run:
          - plan
          - -f
          - "{{ .workdir }}/dump.yaml"
          - --mode
          - apply
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 0

  - name: 002-delete-cleanup
    skipInputs: true
    commands:
      - name: 000-plan-delete
        outputFormat: disable
        run:
          - plan
          - -f
          - "{{ .scenario_dir }}/cleanup.yaml"
          - --mode
          - delete
        assertions:
          - select: metadata
            expect:
              fields:
                mode: delete
          - select: summary
            expect:
              fields:
                total_changes: 1
                by_action.DELETE: 1
          - select: changes[0]
            expect:
              fields:
                action: DELETE
                resource_type: organization_team
                resource_id: "{{ .vars.team_id }}"

      - name: 001-delete
        run:
          - delete
          - -f
          - "{{ .scenario_dir }}/cleanup.yaml"
          - --auto-approve
        assertions:
          - select: plan.metadata
            expect:
              fields:
                mode: delete
          - select: summary
            expect:
              fields:
                failed: 0
                status: success

      - name: 002-get-teams
        run: ["get", "org", "teams", "-o", "json"]
        assertions:
          - select: "[?id=='{{ .vars.team_id }}']"
            expect:
              fields:
                "length(@)": 0
