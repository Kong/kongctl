_defaults:
  kongctl:
    namespace: ai-gateway-agent-e2e

ai_gateways:
  - ref: ai-gateway-agent-e2e
    name: ai-gateway-agent-e2e
    display_name: "AI Gateway Agent E2E"
    min_runtime_version: "2.2"
    runtime_auto_upgrade: false
    description: "AI Gateway Agent e2e"
    proxy_urls:
      - host: ai-gateway-agent-e2e.example.com
        port: 443
        protocol: https
    labels:
      owner: platform
      lifecycle: dev
    auth_strategies: []
    agents: []
