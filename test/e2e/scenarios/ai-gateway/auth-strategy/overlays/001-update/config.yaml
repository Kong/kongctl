_defaults:
  kongctl:
    namespace: ai-gateway-auth-strategy-e2e

ai_gateways:
  - ref: ai-gateway-auth-strategy-e2e
    name: ai-gateway-auth-strategy-e2e
    display_name: "AI Gateway Auth Strategy E2E"
    description: "AI Gateway Auth Strategy e2e"
    proxy_urls:
      - host: ai-gateway-auth-strategy-e2e.example.com
        port: 443
        protocol: https
    auth_strategies:
      - ref: support-key-auth
        name: support-key-auth
        type: key-auth
        display_name: "Updated Support Key Auth"
        labels:
          team: support
          owner: platform
        config:
          key_names:
            - x-support-api-key
            - apikey
          hide_credentials: true
          identity_realms: []
          principals:
            enabled: true
            directory: default
            error_on_miss: false
      - ref: support-oidc
        name: support-oidc
        type: openid-connect
        display_name: "Updated Support OIDC"
        config:
          auth_methods:
            - bearer
          cache_tokens_salt: support-oidc-cache-salt-000001
          issuer: https://issuer.example.com
          # Access-control and upstream-header fields are intentionally omitted.
          # The update must preserve their live values from the initial fixture.
          principals:
            enabled: true
            directory: default
            principal_claim:
              - sub
            match_consumer: true
            match_consumer_groups: true
            error_on_miss: false
