baseInputsPath: testdata
defaults:
  retry: {attempts: 1}
steps:
  - name: create-shared-gateway
    commands:
      - name: platform
        run: [apply, -f, '{{ .workdir }}/platform.yaml', --auto-approve]
  - name: independently-create-policies
    commands:
      - name: team-a
        run: [sync, -f, '{{ .workdir }}/team-a.yaml', --auto-approve]
      - name: team-b
        run: [sync, -f, '{{ .workdir }}/team-b.yaml', --auto-approve]
      - name: both-retained
        run: [get, ai-gateway, custom-policies, --gateway-name, federated-custom-policies-e2e]
        assertions:
          - select: '@'
            expect:
              fields:
                length(@): 2
                sort([].name): [installed-a, streaming-b]
                sort([].managed_by.tool): [kongctl, kongctl]
                sort([].managed_by."kongctl-namespace"): [custom-team-a, custom-team-b]
  - name: cross-team-reference
    commands:
      - name: create-foreign-consumer
        run: [apply, -f, '{{ .workdir }}/instance-team.yaml', --auto-approve]
  - name: convergence-and-dump
    commands:
      - name: combined-plan
        run: [plan, -f, '{{ .workdir }}/team-a.yaml', -f, '{{ .workdir }}/team-b.yaml', -f, '{{ .workdir }}/instance-team.yaml', --mode, sync]
        outputFormat: disable
        assertions:
          - select: summary
            expect:
              fields: {total_changes: 0}
      - name: dump-policies
        run: [dump, declarative, --resources=ai-gateway, --include-child-resources, --filter-name=federated-custom-policies-e2e, --output-file, '{{ .workdir }}/dumped.yaml']
        outputFormat: disable
      - name: reload
        run: [plan, -f, '{{ .workdir }}/dumped.yaml', --mode, apply]
        outputFormat: disable
        assertions:
          - select: summary
            expect:
              fields: {total_changes: 0}
  - name: scoped-removal
    commands:
      - name: omitted-no-op
        run: [plan, -f, '{{ .workdir }}/omitted-a.yaml', --mode, sync]
        outputFormat: disable
        assertions:
          - select: summary
            expect:
              fields: {total_changes: 0}
      - name: empty-apply-no-op
        run: [plan, -f, '{{ .workdir }}/empty-a.yaml', --mode, apply]
        outputFormat: disable
        assertions:
          - select: summary
            expect:
              fields: {total_changes: 0}
      - name: retained-foreign-instance-blocks-definition-delete
        run: [plan, -f, '{{ .workdir }}/empty-a.yaml', --mode, sync]
        outputFormat: disable
        expectFailure:
          exitCode: 1
          contains: 'still uses it'
      - name: remove-last-a-with-consumer-in-another-namespace
        run: [sync, -f, '{{ .workdir }}/empty-a.yaml', -f, '{{ .workdir }}/empty-instance-team.yaml', --auto-approve]
      - name: instance-deleted-before-definition
        run: [get, ai-gateway, policies, --gateway-name, federated-custom-policies-e2e]
        assertions:
          - select: '@'
            expect:
              fields:
                length(@): 0
      - name: team-b-retained
        run: [get, ai-gateway, custom-policies, --gateway-name, federated-custom-policies-e2e]
        assertions:
          - select: '@'
            expect:
              fields:
                length(@): 1
                '[0].name': streaming-b
                '[0].managed_by."kongctl-namespace"': custom-team-b
                'length([0].managed_by)': 4
  - name: cleanup
    commands:
      - name: remove-gateway
        run: [sync, -f, '{{ .workdir }}/cleanup.yaml', --auto-approve]
