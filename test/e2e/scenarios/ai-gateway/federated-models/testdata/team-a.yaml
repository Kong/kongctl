_defaults:
  kongctl:
    namespace: !env FEDERATED_MODEL_NAMESPACE
ai_gateway_models:
  - ref: team-a-chat
    ai_gateway: !lookup {name: federated-models-e2e}
    name: team-a-chat
    display_name: !env FEDERATED_MODEL_DISPLAY_NAME
    type: model
    config: {route: {}}
    formats: [{type: openai}]
    targets:
      - name: gpt-4o-mini
        provider: shared-openai
        config: {type: openai}
    capabilities: [generate]
