_defaults:
  kongctl:
    namespace: !env FEDERATED_PLATFORM_NAMESPACE
ai_gateway_models:
  - ref: team-b-files
    kongctl:
      namespace: !env {var: FEDERATED_TEAM_B_SETTINGS, extract: namespace}
    ai_gateway: !lookup {name: federated-models-e2e}
    name: team-b-files
    display_name: Team B files
    type: api
    config: {route: {}}
    formats: [{type: openai}]
    targets:
      - name: gpt-4o-mini
        provider: shared-openai
        config: {type: openai}
    capabilities: [files]
