baseInputsPath: testdata
env:
  FEDERATED_PROVIDER_AUTH: synthetic-provider-auth
defaults:
  retry: {attempts: 1}
steps:
  - name: create-shared-gateway
    commands:
      - name: platform
        run: [apply, -f, '{{ .workdir }}/platform.yaml', --auto-approve]
  - name: independently-create-providers
    commands:
      - name: team-a
        run: [sync, -f, '{{ .workdir }}/team-a.yaml', --auto-approve]
      - name: team-b
        run: [sync, -f, '{{ .workdir }}/team-b.yaml', --auto-approve]
      - name: both-retained
        run: [get, ai-gateway, model-providers, --gateway-name, federated-providers-e2e]
        assertions:
          - select: '@'
            expect:
              fields:
                length(@): 2
                sort([].name): [provider-a, provider-b]
                sort([].managed_by.tool): [kongctl, kongctl]
                sort([].managed_by."kongctl-namespace"): [provider-team-a, provider-team-b]
  - name: cross-team-reference
    commands:
      - name: create-foreign-consumer
        run: [apply, -f, '{{ .workdir }}/model-team.yaml', --auto-approve]
  - name: convergence-and-dump
    commands:
      - name: combined-plan
        run: [plan, -f, '{{ .workdir }}/team-a.yaml', -f, '{{ .workdir }}/team-b.yaml', -f, '{{ .workdir }}/model-team.yaml', --mode, sync]
        outputFormat: disable
        assertions:
          - select: summary
            expect:
              fields: {total_changes: 0}
      - name: dump-providers
        run: [dump, declarative, --resources=ai-gateway, --include-child-resources, --filter-name=federated-providers-e2e, --output-file, '{{ .workdir }}/dumped.yaml']
        outputFormat: disable
      - name: reload
        run: [plan, -f, '{{ .workdir }}/dumped.yaml', --mode, apply]
        outputFormat: disable
        assertions:
          - select: summary
            expect:
              fields: {total_changes: 0}
  - name: canonical-tool-metadata
    commands:
      - name: reject-managed-by-input
        run: [plan, -f, '{{ .workdir }}/invalid/forbidden-managed-by.yaml', --mode, sync]
        outputFormat: disable
        expectFailure:
          exitCode: 1
          contains: 'managed_by is reserved for Kong tools'
      - name: inject-outside-metadata
        exec: [python3, '{{ .workdir }}/inject_managed_by_drift.py']
      - name: metadata-only-diff
        run: [plan, -f, '{{ .workdir }}/team-a.yaml', --mode, sync]
        outputFormat: disable
        assertions:
          - select: summary
            expect:
              fields: {total_changes: 1, by_action.UPDATE: 1}
          - select: 'changes[0]'
            expect:
              fields:
                'changed_fields.managed_by.old.outside': remove
                'length(changed_fields.managed_by.new)': 4
                'length(keys(changed_fields))': 1
      - name: metadata-visible-in-diff
        run: [diff, -f, '{{ .workdir }}/team-a.yaml', --mode, sync]
        outputFormat: json
        assertions:
          - select: 'changes[0]'
            expect:
              fields:
                'changed_fields.managed_by.old.outside': remove
                'length(changed_fields.managed_by.new)': 4
                'length(keys(changed_fields))': 1
      - name: replace-tool-metadata
        run: [sync, -f, '{{ .workdir }}/team-a.yaml', --auto-approve]
      - name: canonical-map-observed
        run: [get, ai-gateway, model-providers, --gateway-name, federated-providers-e2e]
        assertions:
          - select: '[?name==`"provider-a"`] | [0]'
            expect:
              fields:
                'length(managed_by)': 4
                'config.auth.headers[0].name': Authorization
                'labels.team': a
      - name: metadata-converged
        run: [plan, -f, '{{ .workdir }}/team-a.yaml', --mode, sync]
        outputFormat: disable
        assertions:
          - select: summary
            expect:
              fields: {total_changes: 0}
  - name: scoped-removal
    commands:
      - name: omitted-no-op
        run: [plan, -f, '{{ .workdir }}/omitted-a.yaml', --mode, sync]
        outputFormat: disable
        assertions:
          - select: summary
            expect:
              fields: {total_changes: 0}
      - name: empty-apply-no-op
        run: [plan, -f, '{{ .workdir }}/empty-a.yaml', --mode, apply]
        outputFormat: disable
        assertions:
          - select: summary
            expect:
              fields: {total_changes: 0}
      - name: retained-foreign-model-blocks-provider-delete
        run: [plan, -f, '{{ .workdir }}/empty-a.yaml', --mode, sync]
        outputFormat: disable
        expectFailure:
          exitCode: 1
          contains: 'still references it'
      - name: remove-last-a-with-consumer-in-another-namespace
        run: [sync, -f, '{{ .workdir }}/empty-a.yaml', -f, '{{ .workdir }}/empty-model-team.yaml', --auto-approve]
      - name: model-deleted-before-provider
        run: [get, ai-gateway, models, --gateway-name, federated-providers-e2e]
        assertions:
          - select: '@'
            expect:
              fields:
                length(@): 0
      - name: team-b-retained
        run: [get, ai-gateway, model-providers, --gateway-name, federated-providers-e2e]
        assertions:
          - select: '@'
            expect:
              fields:
                length(@): 1
                '[0].name': provider-b
                '[0].managed_by."kongctl-namespace"': provider-team-b
                'length([0].managed_by)': 4
  - name: cleanup
    commands:
      - name: remove-gateway
        run: [sync, -f, '{{ .workdir }}/cleanup.yaml', --auto-approve]
