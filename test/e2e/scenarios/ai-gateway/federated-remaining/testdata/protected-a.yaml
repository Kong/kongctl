_defaults:
  kongctl:
    namespace: remaining-team-a
ai_gateways:
- ref: shared-a
  _external:
    selector:
      matchFields:
        name: federated-remaining-e2e
  mcp_servers:
  - ref: mcp-a
    name: mcp-a
    display_name: MCP a
    type: conversion-only
    config:
      url: https://example.com
    tools:
      - name: health
        description: Health check
        method: GET
    labels:
      team: a
    kongctl:
      protected: true
  vaults:
  - ref: vault-a
    name: vault-a
    type: env
    config:
      prefix: FED_A_
    labels:
      team: a
    kongctl:
      protected: true
  consumers:
  - ref: consumer-a
    name: consumer-a
    display_name: Consumer a
    type: api-key
    labels:
      team: a
    kongctl:
      protected: true
  consumer_groups:
  - ref: group-a
    name: group-a
    display_name: Group a
    consumers:
    - consumer-a
    - consumer-b
    labels:
      team: a
    kongctl:
      protected: true
  ca_certificates:
  - ref: ca-a
    name: ca-a
    cert: !file './certs/runtime.pem'
    labels:
      team: a
    kongctl:
      protected: true
  snis:
  - ref: sni-a
    name: sni-a
    display_name: SNI a
    hostname: a.federated-remaining.example.test
    certificate: platform-cert
    labels:
      team: a
    kongctl:
      protected: true
