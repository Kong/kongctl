_defaults:
  kongctl:
    namespace: ai-gateway-identity-provider-e2e

ai_gateways:
  - ref: ai-gateway-identity-provider-e2e
    name: ai-gateway-identity-provider-e2e
    display_name: "AI Gateway Identity Provider E2E"
    description: "AI Gateway Identity Provider e2e"
    proxy_urls:
      - host: ai-gateway-identity-provider-e2e.example.com
        port: 443
        protocol: https
    identity_providers:
      - ref: support-key-auth
        name: support-key-auth
        type: key-auth
        display_name: "Updated Support Key Auth"
        labels:
          team: support
          owner: platform
        config:
          key_names:
            - x-support-api-key
            - apikey
          hide_credentials: true
          identity_realms: []
          principals:
            enabled: true
            directory: default
            error_on_miss: false
      - ref: support-oidc
        name: support-oidc
        type: openid-connect
        display_name: "Updated Support OIDC"
        config:
          auth_methods:
            - bearer
          cache_tokens_salt: support-oidc-cache-salt-000001
          issuer: https://issuer.example.com
          consumer_groups_claim:
            - groups
          consumer_groups_optional: false
          upstream_headers_claims:
            - sub
          upstream_headers_names:
            - x-consumer-subject
          principals:
            enabled: true
            directory: default
            principal_claim:
              - sub
            match_consumer: true
            match_consumer_groups: true
            error_on_miss: false
