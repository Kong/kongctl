  - name: 006-apply-root-listener-by-id-lookup
    skipInputs: true
    commands:
      - name: 000-get-ai-gateway-id
        run:
          - get
          - ai-gateways
          - -o
          - json
        recordVar:
          name: gateway_id
          responsePath: "[?name=='{{ .vars.gateway_ref }}'] | [0].id"
        assertions:
          - select: "[?name=='{{ .vars.gateway_ref }}'] | [0].id != null"
            expect:
              fields:
                "@": true
      - name: 001-apply-root-listener-by-id-lookup
        run:
          - apply
          - -f
          - "-"
          - --auto-approve
          - -o
          - json
        stdin: |
          _defaults:
            kongctl:
              namespace: {{ .vars.namespace }}

          ai_gateway_mcp_servers:
            - ref: {{ .vars.lookup_listener_ref }}
              ai_gateway: !lookup {id: "{{ .vars.gateway_id }}"}
              type: listener
              name: {{ .vars.lookup_listener_name }}
              display_name: "Lookup Listener"
              sources:
                - {{ .vars.server_name }}
              config:
                route:
                  paths:
                    - /lookup-listener
        assertions:
          - select: plan.summary
            expect:
              fields:
                total_changes: 1
                by_action.CREATE: 1
          - select: >-
              plan.changes[?resource_type=='ai_gateway_mcp_server' && resource_ref=='{{ .vars.lookup_listener_ref }}'] | [0]
            expect:
              fields:
                action: CREATE
                fields.type: listener
                fields.sources[0]: "{{ .vars.server_name }}"
          - select: summary
            expect:
              fields:
                applied: 1
                failed: 0
                status: success
      - name: 002-verify-root-listener-by-id-lookup
        run:
          - get
          - ai-gateway
          - mcp-server
          - --gateway-name
          - "{{ .vars.gateway_name }}"
          - "{{ .vars.lookup_listener_name }}"
          - -o
          - json
        assertions:
          - select: "@"
            expect:
              fields:
                type: listener
                sources[0]: "{{ .vars.server_name }}"

