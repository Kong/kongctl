# Step 2: rename src-a -> src-b (server ref/name/display_name/path and listener sources)
_defaults:
  kongctl:
    namespace: ai-gateway-mcp-source-rename-e2e

ai_gateways:
  - ref: mcp-source-rename-e2e
    name: mcp-source-rename-e2e
    display_name: "MCP Source Rename E2E"
    mcp_servers:
      - ref: src-b
        type: upstream-server
        name: src-b
        display_name: "src-b"
        enabled: true
        config:
          url: https://upstream.example.com/mcp
          tools_cache_ttl_seconds: 60
          route:
            paths:
              - /src-b
      - ref: agg-listener
        type: listener
        name: agg-listener
        display_name: "agg-listener"
        enabled: true
        sources:
          - src-b
        access:
          acl_attribute_type: oauth_access_token
          access_token_claim_field: sub
        config:
          route:
            paths:
              - /agg-listener
