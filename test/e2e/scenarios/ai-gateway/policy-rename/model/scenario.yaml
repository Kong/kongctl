baseInputsPath: testdata

env:
  KONGCTL_LOG_LEVEL: info
  KONGCTL_E2E_MODEL_PROVIDER_KEY: placeholder

defaults:
  retry:
    attempts: 1

steps:
  - name: create
    commands:
      - name: sync
        outputFormat: json
        run: [sync, -f, "{{ .workdir }}/config.yaml", --auto-approve]
        assertions:
          - select: summary
            expect:
              fields: {applied: 4, failed: 0, status: success}
      - name: verify-policy
        outputFormat: json
        run: [get, ai-gateway, policies, --gateway-name, "Model Policy Rename E2E"]
        assertions:
          - select: "@"
            expect:
              fields:
                "length(@)": 1
                "[0].name": pass-listener-policy
      - name: verify-resource-and-attachment
        outputFormat: json
        run: [get, ai-gateway, models, --gateway-name, "Model Policy Rename E2E"]
        assertions:
          - select: "@"
            expect:
              fields:
                "length(@)": 1
                "[0].name": pass-listener
                "[0].policies": [pass-listener-policy]

  - name: rename
    inputOverlayDirs: [overlays/rename]
    commands:
      - name: capture-plan
        outputFormat: disable
        stdoutFile: "{{ .workdir }}/rename-plan.json"
        run: [plan, -f, "{{ .workdir }}/config.yaml", --mode, sync]
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 4
                by_action.CREATE: 2
                by_action.DELETE: 2
      - name: single-sync
        outputFormat: json
        run: [sync, -f, "{{ .workdir }}/config.yaml", --auto-approve]
        assertions:
          - select: summary
            expect:
              fields: {applied: 4, failed: 0, status: success}
      - name: verify-policy
        outputFormat: json
        run: [get, ai-gateway, policies, --gateway-name, "Model Policy Rename E2E"]
        assertions:
          - select: "@"
            expect:
              fields:
                "length(@)": 1
                "[0].name": pass-list-policy
      - name: verify-resource-and-attachment
        outputFormat: json
        run: [get, ai-gateway, models, --gateway-name, "Model Policy Rename E2E"]
        assertions:
          - select: "@"
            expect:
              fields:
                "length(@)": 1
                "[0].name": pass-list
                "[0].policies": [pass-list-policy]
      - name: converged-plan
        outputFormat: disable
        run: [plan, -f, "{{ .workdir }}/config.yaml", --mode, sync]
        assertions:
          - select: summary
            expect:
              fields: {total_changes: 0}

  - name: delete-children
    inputOverlayDirs: [overlays/empty]
    commands:
      - name: sync
        outputFormat: json
        run: [sync, -f, "{{ .workdir }}/config.yaml", --auto-approve]
        assertions:
          - select: summary
            expect:
              fields: {applied: 2, failed: 0, status: success}
      - name: verify-resources-absent
        outputFormat: json
        run: [get, ai-gateway, models, --gateway-name, "Model Policy Rename E2E"]
        assertions:
          - select: "length(@)"
            expect:
              fields: {"@": 0}
      - name: verify-policies-absent
        outputFormat: json
        run: [get, ai-gateway, policies, --gateway-name, "Model Policy Rename E2E"]
        assertions:
          - select: "length(@)"
            expect:
              fields: {"@": 0}

  - name: delete-provider
    inputOverlayDirs: [overlays/without-provider]
    commands:
      - name: sync
        outputFormat: json
        run: [sync, -f, "{{ .workdir }}/config.yaml", --auto-approve]
        assertions:
          - select: summary
            expect:
              fields: {applied: 1, failed: 0, status: success}
      - name: verify-provider-absent
        outputFormat: json
        run: [get, ai-gateway, model-providers, --gateway-name, "Model Policy Rename E2E"]
        assertions:
          - select: "length(@)"
            expect:
              fields: {"@": 0}

  - name: cleanup
    inputOverlayDirs: [overlays/cleanup]
    commands:
      - name: remove-gateway
        outputFormat: json
        run: [sync, -f, "{{ .workdir }}/config.yaml", --auto-approve]
        assertions:
          - select: summary
            expect:
              fields: {applied: 1, failed: 0, status: success}
      - name: verify-gateway-absent
        outputFormat: json
        run: [get, ai-gateways]
        assertions:
          - select: "[?name=='model-policy-rename-e2e'] | length(@)"
            expect:
              fields: {"@": 0}
