_defaults:
  kongctl:
    namespace: ai-provider-model-order-e2e

ai_gateways:
  - ref: ai-provider-model-order-e2e
    name: ai-provider-model-order-e2e
    display_name: "Provider Model Ordering E2E"
    description: "AI Gateway Model e2e"
    proxy_urls:
      - host: ai-provider-model-order-e2e.example.com
        port: 443
        protocol: https
    labels:
      owner: platform
      lifecycle: dev
    model_providers: []
    models:
      - ref: support-gpt
        type: model
        name: support-gpt
        display_name: "Support GPT"
        enabled: true
        config:
          route:
            model:
              body_param: model
              values:
                - support-gpt
        formats:
          - type: openai
        targets:
          - name: gpt-4o
            provider: support-openai
            config:
              type: openai
          - name: gpt-4o-mini
            provider: support-openai
            config:
              type: openai
        policies: []
        capabilities:
          - generate
