_defaults:
  kongctl:
    namespace: ai-gateway-typesafe-decisions-e2e
ai_gateways:
  - ref: typesafe-decisions-e2e
    name: typesafe-decisions-e2e
    display_name: typesafe-decisions-e2e
    min_runtime_version: '2.2'
    runtime_auto_upgrade: false
    model_providers:
      - ref: typesafe-provider
        name: typesafe-provider
        display_name: Initial provider
        type: typesafe
        config:
          auth:
            type: basic
            headers: []
    models:
      - ref: typesafe-decisions-model
        name: typesafe-decisions-model
        display_name: Initial model
        type: model
        enabled: true
        formats:
          - type: typesafe
        capabilities: [decisions]
        config:
          route:
            model:
              body_param: model
              values: [typesafe-decisions-model, decision-alias-old]
        targets:
          - name: upstream-model
            provider: typesafe-provider
            config:
              type: typesafe
              upstream_url: https://upstream.example.com/initial
              input_cost: 1.25
              output_cost: 2.5
