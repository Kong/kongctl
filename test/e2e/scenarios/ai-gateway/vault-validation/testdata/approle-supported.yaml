_defaults:
  kongctl:
    namespace: vault-validation-e2e
ai_gateways:
  - ref: gateway
    name: gateway
    display_name: Gateway
ai_gateway_vaults:
  - ref: vault
    ai_gateway: gateway
    type: hcv
    name: vault
    config:
      auth_method: approle
      host: vault.example.net
      port: 8200
      mount: secret
      path: approle
      role_id: example-role-id
      secret_id_file: /run/secrets/approle
      response_wrapping: false
