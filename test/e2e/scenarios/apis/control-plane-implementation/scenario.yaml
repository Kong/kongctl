baseInputsPath: testdata

defaults:
  mask:
    dropKeys:
      - resource_id
      - change_id
      - created_at
      - updated_at

steps:
  - name: 000-reset-org
    skipInputs: true
    commands:
      - resetOrg: true

  - name: 001-apply-control-plane-implementation
    commands:
      - name: 000-plan-apply
        outputFormat: disable
        run:
          - plan
          - -f
          - "{{ .workdir }}/resources.yaml"
          - --mode
          - apply
        assertions:
          - select: >-
              changes[?resource_type=='api_implementation' &&
                           resource_ref=='control-plane-implementation'] | [0]
            expect:
              fields:
                action: CREATE
                "length(fields.control_plane.control_plane_id) > `0`": true

      - name: 001-apply
        run:
          - apply
          - -f
          - "{{ .workdir }}/resources.yaml"
          - --auto-approve
        assertions:
          - select: summary
            expect:
              fields:
                failed: 0
                status: success

      - name: 002-get-control-plane
        run:
          - get
          - gateway
          - control-planes
          - -o
          - json
        recordVar:
          name: apiImplementationCPID
          responsePath: "[?name=='e2e-api-implementation-cp'] | [0].id"
      - name: 003-list-implementations
        run:
          - get
          - api
          - implementations
          - --api-name
          - "E2E Control Plane Implementation API"
          - -o
          - json
        recordVar:
          name: apiImplementationID
          responsePath: "[0].id"
        assertions:
          - select: "@"
            expect:
              fields:
                "length(@)": 1
          - select: "[0]"
            expect:
              fields:
                "length(id) > `0`": true
                control_plane.control_plane_id: "{{ .vars.apiImplementationCPID }}"
      - name: 004-get-implementation-by-id
        run:
          - get
          - api
          - implementations
          - --api-name
          - "E2E Control Plane Implementation API"
          - "{{ .vars.apiImplementationID }}"
          - -o
          - json
        assertions:
          - select: "[0]"
            expect:
              fields:
                id: "{{ .vars.apiImplementationID }}"
                control_plane.control_plane_id: "{{ .vars.apiImplementationCPID }}"
      - name: 005-get-implementation-not-found
        run:
          - get
          - api
          - implementations
          - --api-name
          - "E2E Control Plane Implementation API"
          - nonexistent-impl-xyz
          - -o
          - json
        expectFailure:
          exitCode: 1
          contains: "not found"

  - name: 002-repeat-is-noop
    commands:
      - name: 000-plan-noop
        outputFormat: disable
        run: ["plan", "-f", "{{ .workdir }}/resources.yaml", "--mode", "apply"]
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 0

  - name: 003-dump-and-round-trip
    skipInputs: true
    commands:
      - name: 000-dump
        run:
          - dump
          - declarative
          - "--resources=apis"
          - --include-child-resources
        outputFormat: none
        parseAs: yaml
        stdoutFile: "{{ .workdir }}/dump.yaml"
        assertions:
          - select: >-
              apis[?name=='E2E Control Plane Implementation API'] | [0].implementations[0]
            expect:
              fields:
                type: control_plane
                control_plane.control_plane_id: "{{ .vars.apiImplementationCPID }}"
      - name: 001-plan-dump
        outputFormat: disable
        run:
          - plan
          - -f
          - "{{ .workdir }}/dump.yaml"
          - --mode
          - apply
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 0

  - name: 004-sync-delete-implementation
    inputOverlayDirs:
      - overlays/001-remove-implementation
    commands:
      - name: 000-plan-sync
        outputFormat: disable
        run:
          - plan
          - -f
          - "{{ .workdir }}/resources.yaml"
          - --mode
          - sync
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 1
                by_action.DELETE: 1
          - select: "changes[?resource_type=='api_implementation'] | [0]"
            expect:
              fields:
                action: DELETE

      - name: 001-sync-delete
        run:
          - sync
          - -f
          - "{{ .workdir }}/resources.yaml"
          - --auto-approve
        assertions:
          - select: summary
            expect:
              fields:
                failed: 0
                status: success

      - name: 002-get-implementations
        run:
          - get
          - api
          - implementations
          - --api-name
          - "E2E Control Plane Implementation API"
          - -o
          - json
        assertions:
          - select: "@"
            expect:
              fields:
                "length(@)": 0
      - name: 003-get-api
        run:
          - get
          - apis
          - -o
          - json
        assertions:
          - select: "[?name=='E2E Control Plane Implementation API']"
            expect:
              fields:
                "length(@)": 1
      - name: 004-get-control-plane
        run:
          - get
          - gateway
          - control-planes
          - -o
          - json
        assertions:
          - select: "[?name=='e2e-api-implementation-cp']"
            expect:
              fields:
                "length(@)": 1

  - name: 005-reset-org
    skipInputs: true
    commands:
      - resetOrg: true
