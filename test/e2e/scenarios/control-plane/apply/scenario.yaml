baseInputsPath: testdata

steps:
  - name: 000-reset-org
    skipInputs: true
    commands:
      - resetOrg: true

  - name: 001-initial-apply
    commands:
      - name: 001-000-apply
        run:
          - apply
          - -f
          - "{{ .workdir }}/control-plane.yaml"
          - --auto-approve
        assertions:
          - select: "plan.metadata"
            expect:
              fields:
                mode: apply
          - select: >-
              plan.changes[?resource_type=='control_plane' && 
                            resource_ref=='e2e-cp'] | [0]
            expect:
              fields:
                action: CREATE
      - name: 001-001-verify-create-fields
        run:
          - get
          - konnect
          - gateway
          - control-plane
          - kongctl-e2e-cp
          - -o
          - json
        assertions:
          - select: name
            expect:
              fields:
                "@": "kongctl-e2e-cp"
          - select: description
            expect:
              fields:
                "@": "Test Control Plane for E2E testing via kongctl"
          - select: config.cluster_type
            expect:
              fields:
                "@": "CLUSTER_TYPE_CONTROL_PLANE"

  - name: 002-apply-update
    inputOverlayDirs:
      - overlays/002-update-description-labels
    commands:
      - name: 002-000-apply-update
        run:
          - apply
          - -f
          - "{{ .workdir }}/control-plane.yaml"
          - --auto-approve
        assertions:
          - select: "plan.metadata"
            expect:
              fields:
                mode: apply
          - select: >-
              plan.changes[?resource_type=='control_plane' &&
                            resource_ref=='e2e-cp'] | [0]
            expect:
              fields:
                action: UPDATE

      - name: 002-001-verify-fields
        run:
          - get
          - konnect
          - gateway
          - control-plane
          - kongctl-e2e-cp
          - -o
          - json
        assertions:
          - select: description
            expect:
              fields:
                "@": "Updated description for E2E apply test"
          - select: "labels.env"
            expect:
              fields:
                "@": "e2e"
          - select: "labels.owner"
            expect:
              fields:
                "@": "kongctl-test"

  - name: 003-plan-idempotent
    inputOverlayDirs:
      - overlays/002-update-description-labels
    commands:
      - name: 003-plan
        outputFormat: disable
        run:
          - plan
          - --mode
          - apply
          - -f
          - "{{ .workdir }}/control-plane.yaml"
        assertions:
          - select: "summary"
            expect:
              fields:
                total_changes: 0

  - name: 003a-modify-remove-labels
    inputOverlayDirs:
      - overlays/003-modify-remove-labels
    commands:
      - name: 000-plan-label-changes
        outputFormat: disable
        run: [plan, -f, "{{ .workdir }}/control-plane.yaml", --mode, apply]
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 1
                by_action.UPDATE: 1
          - select: "changes[?resource_ref=='e2e-cp'] | [0]"
            expect:
              fields:
                action: UPDATE
                changed_fields.labels.old.env: e2e
                changed_fields.labels.old.owner: kongctl-test
                changed_fields.labels.new.env: production
                changed_fields.labels.new.owner: null
                changed_fields.labels.new.region: us-east-1
                fields.labels:
                  env: production
                  region: us-east-1
      - name: 001-apply-label-changes
        run: [apply, -f, "{{ .workdir }}/control-plane.yaml", --auto-approve]
        assertions:
          - select: summary
            expect:
              fields:
                applied: 1
                failed: 0
                status: success
      - name: 002-get-modified-labels
        run: [get, gateway, control-plane, kongctl-e2e-cp, -o, json]
        assertions:
          - expect:
              fields:
                labels.env: production
                "contains(keys(labels), 'owner')": false
                labels.region: us-east-1
                'labels."KONGCTL-namespace"': default
      - name: 003-plan-labels-noop
        outputFormat: disable
        run: [plan, -f, "{{ .workdir }}/control-plane.yaml", --mode, apply]
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 0

  - name: 003b-dump-round-trip
    skipInputs: true
    commands:
      - name: 000-dump-control-plane
        run:
          - dump
          - declarative
          - --resources=control_planes
          - --filter-name=kongctl-e2e-cp
          - --default-namespace=default
        outputFormat: none
        parseAs: yaml
        stdoutFile: "{{ .workdir }}/dump.yaml"
        assertions:
          - select: _defaults.kongctl
            expect:
              fields:
                namespace: default
          - select: control_planes
            expect:
              fields:
                "length(@)": 1
          - select: "control_planes[?name=='kongctl-e2e-cp'] | [0]"
            expect:
              fields:
                name: kongctl-e2e-cp
                description: Updated description for E2E apply test
                cluster_type: CLUSTER_TYPE_CONTROL_PLANE
                labels.env: production
                "contains(keys(labels), 'owner')": false
                labels.region: us-east-1
      - name: 001-plan-from-dump
        outputFormat: disable
        run: [plan, -f, "{{ .workdir }}/dump.yaml", --mode, apply]
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 0

  - name: 004-delete-cleanup
    commands:
      - name: 004-000-delete
        run:
          - delete
          - -f
          - "{{ .workdir }}/control-plane.yaml"
          - --auto-approve
        assertions:
          - select: "plan.metadata"
            expect:
              fields:
                mode: delete
          - select: "plan.summary"
            expect:
              fields:
                total_changes: 1
                by_action.DELETE: 1
          - select: "summary"
            expect:
              fields:
                failed: 0
                status: success
