baseInputsPath: testdata

steps:
  - name: 000-reset-org
    skipInputs: true
    commands:
      - resetOrg: true

  - name: 001-initial-sync
    commands:
      - name: 000-001-sync
        run:
          - sync
          - -f
          - "{{ .workdir }}/control-plane.yaml"
          - --auto-approve
        assertions:
          - select: "plan.metadata"
            expect:
              fields:
                mode: sync
          - select: >-
              plan.changes[?resource_type=='control_plane' && 
                            resource_ref=='e2e-cp'] | [0]
            expect:
              fields:
                action: CREATE

      - name: 001-sync-idempotent
        run:
          - sync
          - -f
          - "{{ .workdir }}/control-plane.yaml"
          - --auto-approve
        assertions:
          - select: plan.summary
            expect:
              fields:
                total_changes: 0
          - select: summary
            expect:
              fields:
                failed: 0
                status: success

  - name: 001-update-description-labels
    inputOverlayDirs:
      - overlays/001-update-description-labels
    commands:
      - name: 000-diff-default-sync-update
        run: [diff, -f, "{{ .workdir }}/control-plane.yaml", -o, json]
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 1
                by_action.UPDATE: 1
          - select: "changes[?resource_type=='control_plane' && resource_ref=='e2e-cp'] | [0]"
            expect:
              fields:
                action: UPDATE
                fields.description: "Updated description for E2E sync test"

      - name: 000-sync-update
        run:
          - sync
          - -f
          - "{{ .workdir }}/control-plane.yaml"
          - --auto-approve
        assertions:
          - select: plan.metadata
            expect:
              fields:
                mode: sync
          - select: plan.summary
            expect:
              fields:
                total_changes: 1
                by_action.UPDATE: 1
          - select: >-
              plan.changes[?resource_type=='control_plane' &&
                            resource_ref=='e2e-cp'] | [0]
            expect:
              fields:
                action: UPDATE
          - select: summary
            expect:
              fields:
                failed: 0
                status: success

      - name: 001-get-updated
        run:
          - get
          - konnect
          - gateway
          - control-planes
          - -o
          - json
        assertions:
          - select: "[?name=='kongctl-e2e-cp'] | [0]"
            expect:
              fields:
                name: "kongctl-e2e-cp"
                description: "Updated description for E2E sync test"
                config.cluster_type: "CLUSTER_TYPE_CONTROL_PLANE"
                labels.env: e2e
                labels.owner: kongctl-test

      - name: 002-sync-idempotent-after-update
        run:
          - sync
          - -f
          - "{{ .workdir }}/control-plane.yaml"
          - --auto-approve
        assertions:
          - select: plan.summary
            expect:
              fields:
                total_changes: 0
          - select: summary
            expect:
              fields:
                failed: 0
                status: success

  - name: 002-sync-with-delete
    inputOverlayDirs:
      - overlays/002-sync-with-delete
    commands:
      - name: 000-diff-default-sync-delete
        run: [diff, -f, "{{ .workdir }}/control-plane.yaml", -o, json]
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 2
                by_action.CREATE: 1
                by_action.DELETE: 1
          - select: "changes[?resource_type=='control_plane' && resource_ref=='kongctl-e2e-cp'] | [0]"
            expect:
              fields:
                action: DELETE
          - select: "changes[?resource_type=='control_plane' && resource_ref=='e2e-cp-2'] | [0]"
            expect:
              fields:
                action: CREATE

      - name: 000-002-sync
        run:
          - sync
          - -f
          - "{{ .workdir }}/control-plane.yaml"
          - --auto-approve
        assertions:
          - select: "plan.metadata"
            expect:
              fields:
                mode: sync
          - select: "summary"
            expect:
              fields:
                total_changes: 2
          - select: >-
              plan.changes[?resource_type=='control_plane' &&
                            resource_ref=='kongctl-e2e-cp'] | [0]
            expect:
              fields:
                action: DELETE
          - select: >-
              plan.changes[?resource_type=='control_plane' &&
                            resource_ref=='e2e-cp-2'] | [0]
            expect:
              fields:
                action: CREATE

      - name: 001-002-verify-post-sync
        run:
          - get
          - konnect
          - gateway
          - control-planes
          - -o
          - json
        assertions:
          - select: "[?name=='kongctl-e2e-cp']"
            expect:
              fields:
                "length(@)": 0
          - select: "[?name=='kongctl-e2e-cp-2'] | [0]"
            expect:
              fields:
                name: "kongctl-e2e-cp-2"
                description: "Second Test Control Plane for E2E testing via kongctl"
          - select: "[?name=='kongctl-e2e-cp-2'] | [0].config.cluster_type"
            expect:
              fields:
                "@": "CLUSTER_TYPE_CONTROL_PLANE"

  - name: 002a-dump-after-sync-delete
    skipInputs: true
    commands:
      - name: 000-dump-replacement
        run:
          - dump
          - declarative
          - --resources=control_planes
          - --filter-name=kongctl-e2e-cp-2
        outputFormat: none
        parseAs: yaml
        stdoutFile: "{{ .workdir }}/dump.yaml"
        assertions:
          - select: control_planes
            expect:
              fields:
                "length(@)": 1
          - select: control_planes[0]
            expect:
              fields:
                name: kongctl-e2e-cp-2
                description: "Second Test Control Plane for E2E testing via kongctl"
          - select: "control_planes[?name=='kongctl-e2e-cp']"
            expect:
              fields:
                "length(@)": 0
      - name: 001-plan-sync-from-dump
        outputFormat: disable
        run: [plan, -f, "{{ .workdir }}/dump.yaml", --mode, sync]
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 0

  - name: 003-delete-cleanup
    inputOverlayDirs:
      - overlays/002-sync-with-delete
    commands:
      - name: 000-delete
        run:
          - delete
          - -f
          - "{{ .workdir }}/control-plane.yaml"
          - --auto-approve
        assertions:
          - select: "plan.metadata"
            expect:
              fields:
                mode: delete
          - select: "plan.summary"
            expect:
              fields:
                total_changes: 1
                by_action.DELETE: 1
          - select: "summary"
            expect:
              fields:
                failed: 0
                status: success
