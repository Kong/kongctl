_defaults:
  kongctl:
    namespace: dcr-workflow

dcr_providers:
  - ref: e2e-dcr-http
    name: e2e-dcr-http
    provider_type: http
    issuer: https://e2e-http-issuer.example.com
    dcr_config:
      dcr_base_url: https://e2e-http.example.com/v1/dcr
      api_key: !secret {source: !env KONGCTL_E2E_DCR_HTTP_API_KEY}
      disable_event_hooks: true
    labels:
      team: platform
      provider: http
