baseInputsPath: testdata

steps:
  - name: 000-reset-org
    skipInputs: true
    commands:
      - resetOrg: true

  - name: 001-plan-apply-file
    commands:
      - name: 000-plan-create
        outputFormat: disable
        run:
          - plan
          - -f
          - "{{ .workdir }}/apis.yaml"
          - -f
          - "{{ .workdir }}/control-plane.yaml"
          - -f
          - "{{ .workdir }}/gateway-service-one.yaml"
          - -f
          - "{{ .workdir }}/gateway-service-two.yaml"
          - --mode
          - apply
          - --output-file
          - "{{ .workdir }}/plan-create.json"
      - name: 001-plan-assert
        parseAs: json
        exec:
          - cat
          - "{{ .workdir }}/plan-create.json"
        assertions:
          - select: "metadata"
            expect:
              fields:
                mode: apply
          - select: "changes[?resource_type=='_deck']"
            expect:
              fields:
                "length(@)": 1
      - name: 002-apply-plan-file
        replanOnRetry:
          - "{{ .workdir }}/apis.yaml"
          - "{{ .workdir }}/control-plane.yaml"
          - "{{ .workdir }}/gateway-service-one.yaml"
          - "{{ .workdir }}/gateway-service-two.yaml"
        outputFormat: json
        run:
          - apply
          - --plan
          - "{{ .workdir }}/plan-create.json"
          - --auto-approve
        assertions:
          - select: "plan.metadata"
            expect:
              fields:
                mode: apply
          - select: "summary"
            expect:
              fields:
                failed: 0
                status: success
      - name: 003-get-gateway-services
        run:
          - get
          - gw
          - cp
          - services
          - --control-plane-name
          - "e2e-cp"
          - -o
          - json
        recordVars:
          - name: service_one_id
            responsePath: "[?name=='e2e-gw-svc-one'] | [0].id"
          - name: service_two_id
            responsePath: "[?name=='e2e-gw-svc-two'] | [0].id"
        assertions:
          - select: "[?name=='e2e-gw-svc-one']"
            expect:
              fields:
                "length(@)": 1
          - select: "[?name=='e2e-gw-svc-two']"
            expect:
              fields:
                "length(@)": 1
          - select: "[?name=='e2e-gw-svc-one'] | [0]"
            expect:
              fields:
                name: "e2e-gw-svc-one"
          - select: "[?name=='e2e-gw-svc-two'] | [0]"
            expect:
              fields:
                name: "e2e-gw-svc-two"

      - name: 004-get-control-plane
        run: [get, gateway, control-planes, -o, json]
        recordVar:
          name: control_plane_id
          responsePath: "[?name=='e2e-cp'] | [0].id"
        assertions:
          - select: "[?name=='e2e-cp']"
            expect:
              fields:
                "length(@)": 1
      - name: 005-get-implementation-one
        run: [get, api, implementations, --api-name, e2e-api-one, -o, json]
        assertions:
          - select: "@"
            expect:
              fields:
                "length(@)": 1
          - select: "[0]"
            expect:
              fields:
                service.id: "{{ .vars.service_one_id }}"
                service.control_plane_id: "{{ .vars.control_plane_id }}"
      - name: 006-get-implementation-two
        run: [get, api, implementations, --api-name, e2e-api-two, -o, json]
        assertions:
          - select: "@"
            expect:
              fields:
                "length(@)": 1
          - select: "[0]"
            expect:
              fields:
                service.id: "{{ .vars.service_two_id }}"
                service.control_plane_id: "{{ .vars.control_plane_id }}"

  - name: 002-delete-cleanup
    commands:
      - name: 000-delete
        run:
          - delete
          - -f
          - "{{ .workdir }}/apis.yaml"
          - -f
          - "{{ .workdir }}/control-plane.yaml"
          - -f
          - "{{ .workdir }}/gateway-service-one.yaml"
          - -f
          - "{{ .workdir }}/gateway-service-two.yaml"
          - --auto-approve
        assertions:
          - select: plan.metadata
            expect:
              fields:
                mode: delete
          - select: summary
            expect:
              fields:
                failed: 0
                status: success
