baseInputsPath: testdata

steps:
  - name: 000-reset-org
    skipInputs: true
    commands:
      - resetOrg: true

  - name: 001-initial-sync
    commands:
      - name: 000-plan-sync
        outputFormat: disable
        run:
          - plan
          - -f
          - "{{ .workdir }}/konnect/"
          - --base-dir
          - "{{ .workdir }}"
          - --mode
          - sync
        assertions:
          - select: "metadata"
            expect:
              fields:
                mode: sync
          - select: "changes[?resource_type=='_deck']"
            expect:
              fields:
                "length(@)": 1
          - select: >-
              changes[?resource_type=='api_implementation' &&
                            resource_ref=='code-breakers-api-impl'] | [0]
            expect:
              fields:
                action: CREATE

      - name: 001-sync
        outputFormat: json
        run:
          - sync
          - -f
          - "{{ .workdir }}/konnect/"
          - --base-dir
          - "{{ .workdir }}"
          - --auto-approve
        assertions:
          - select: summary
            expect:
              fields:
                failed: 0
                status: success

      - name: 002-get-gateway-services
        run:
          - get
          - gw
          - cp
          - services
          - --control-plane-name
          - "code-breakers"
          - -o
          - json
        recordVar:
          name: service_id
          responsePath: "[?name=='code-breakers'] | [0].id"
        assertions:
          - select: "[?name=='code-breakers'] | [0]"
            expect:
              fields:
                name: "code-breakers"

      - name: 003-get-control-plane
        run: ["get", "gateway", "control-planes", "-o", "json"]
        recordVar:
          name: control_plane_id
          responsePath: "[?name=='code-breakers'] | [0].id"
        assertions:
          - select: "[?name=='code-breakers']"
            expect:
              fields:
                "length(@)": 1

      - name: 004-get-implementations
        run: ["get", "api", "implementations", "--api-name", "code-breakers", "-o", "json"]
        assertions:
          - select: "@"
            expect:
              fields:
                "length(@)": 1
          - select: "[0]"
            expect:
              fields:
                service.id: "{{ .vars.service_id }}"
                service.control_plane_id: "{{ .vars.control_plane_id }}"

  - name: 002-sync-repeat
    commands:
      - name: 000-sync
        outputFormat: json
        run:
          - sync
          - -f
          - "{{ .workdir }}/konnect/"
          - --base-dir
          - "{{ .workdir }}"
          - --auto-approve
        assertions:
          - select: "plan.metadata"
            expect:
              fields:
                mode: sync
          - select: "plan.changes[?resource_type=='api_implementation' && action=='DELETE']"
            expect:
              fields:
                "length(@)": 0

  - name: 003-delete-cleanup
    commands:
      - name: 000-delete
        outputFormat: json
        run:
          - delete
          - -f
          - "{{ .workdir }}/konnect/"
          - --base-dir
          - "{{ .workdir }}"
          - --auto-approve
        assertions:
          - select: plan.metadata
            expect:
              fields:
                mode: delete
          - select: summary
            expect:
              fields:
                failed: 0
                status: success
