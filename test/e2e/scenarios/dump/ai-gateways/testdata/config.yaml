_defaults:
  kongctl:
    namespace: dump-ai-gateways-e2e

ai_gateways:
  - ref: dump-ai-gateway
    name: dump-ai-gateway
    display_name: E2E Dump AI Gateway
    description: E2E Dump AI Gateway description
    proxy_urls:
      - host: dump-ai-gateway.example.com
        port: 443
        protocol: https
    policies:
      - ref: dump-ai-gateway-policy
        name: dump-ai-gateway-policy
        type: ai-prompt-guard
        display_name: E2E Dump AI Gateway Policy
        enabled: true
        global: false
        config:
          deny_patterns:
            - ".*(W|w)ar.*"
