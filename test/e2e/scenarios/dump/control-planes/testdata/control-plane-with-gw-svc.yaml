control_planes:
  - ref: e2e-dump-cp
    name: "e2e-dump-cp"
    description: "E2E Dump Test Control Plane"
    cluster_type: "CLUSTER_TYPE_CONTROL_PLANE"
    auth_type: pinned_client_certs
    cloud_gateway: false
    data_plane_certificates:
      - ref: e2e-dump-data-plane-cert
        cert: !file ./certs/data-plane.pem
    _deck:
      files:
        - "gateway-service.yaml"
      flags:
        - "--analytics=false"

    gateway_services:
      - ref: e2e-dump-gw-svc
        _external:
          selector:
            matchFields:
              name: "e2e-dump-gw-svc"
