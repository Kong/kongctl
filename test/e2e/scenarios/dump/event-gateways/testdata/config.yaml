---
_defaults:
  kongctl:
    namespace: dump-event-gateways-e2e
event_gateways:
  - ref: egw-dump-test
    name: egw-dump-test
    description: EGW for dump scenario test
    backend_clusters:
      - ref: dump-backend-cluster
        name: dump-backend-cluster
        description: Backend Cluster for dump test
        bootstrap_servers:
          - egw-backend-1.example.com:9092
        authentication:
          type: anonymous
        tls:
          enabled: true
          insecure_skip_verify: false
          tls_versions:
            - tls12
            - tls13
    virtual_clusters:
      - ref: dump-virtual-cluster
        name: dump-virtual-cluster
        description: Virtual Cluster for dump test
        destination:
          id: !ref 'dump-backend-cluster#id'
        authentication:
          - type: anonymous
        acl_mode: enforce_on_gateway
        dns_label: vc-diff
        produce_policies:
          - ref: dump-produce-policy
            name: dump-produce-policy
            type: modify_headers
            enabled: true
            config:
              actions:
                - op: set
                  key: x-dump-test
                  value: initial
        cluster_policies:
          - ref: dump-cluster-policy
            name: dump-cluster-policy
            type: acls
            enabled: true
            config:
              rules:
                - action: deny
                  operations:
                    - name: describe_configs
                  resource_names:
                    - match: '*'
                  resource_type: transactional_id
        consume_policies:
          - ref: dump-consume-policy
            name: dump-consume-policy
            type: modify_headers
            enabled: true
            config:
              actions:
                - op: set
                  key: x-dump-consume-test
                  value: initial
    listeners:
      - ref: dump-listener
        name: dump-listener
        description: Listener for dump test
        ports:
          - 9092
        addresses:
          - localhost
        policies:
          - ref: dump-listener-policy
            name: dump-listener-policy
            type: forward_to_virtual_cluster
            enabled: true
            config:
              type: sni
              sni_suffix: .example.com
    schema_registries:
      - ref: dump-schema-registry-ref
        name: dump-schema-registry-name
        description: Default Schema Registry description
        type: confluent
        config:
          schema_type: json
          endpoint: https://schema-registry.example.com
          timeout_seconds: 30
