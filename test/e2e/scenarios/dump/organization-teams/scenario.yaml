baseInputsPath: testdata

env:
  KONGCTL_LOG_LEVEL: info

test:
  requiredEnvVars:
    - KONGCTL_E2E_ORG_USER_EMAIL_1
  info: >-
    Organization teams dump E2E requires one existing Konnect user via
    KONGCTL_E2E_ORG_USER_EMAIL_1; the user is a lookup selector (not a managed
    resource) and is added as a member of the alpha team to exercise
    user collection in the dump code path. A temporary system account is added
    to the alpha team to verify system account dump and round-trip coverage.
    A separate fixture exercises 99, 100 and 101 assigned roles around the
    reader's 100-role page boundary. Dump page sizes 1, 10, 99, 100 and 101
    must preserve all roles. Apply and sync plans use the complete original
    manifests so matching truncation in dump and planning cannot hide a failure.

vars:
  teamAlphaName: e2e-dump-org-team-alpha
  teamBetaName: e2e-dump-org-team-beta
  systemAccountName: e2e-dump-org-system-account
  paginationTeamName: e2e-dump-org-team-pagination

steps:
  - name: 000-reset-org
    skipInputs: true
    commands:
      - resetOrg: true

  - name: 001-create-system-account
    skipInputs: true
    commands:
      - name: 000-create-system-account
        create:
          resource: system-account
          payload:
            inline:
              name: "{{ .vars.systemAccountName }}"
              description: System account for organization teams dump E2E coverage

  - name: 002-sync-bootstrap
    commands:
      - name: 000-sync-bootstrap
        outputFormat: json
        run:
          - sync
          - -f
          - "{{ .workdir }}/config.yaml"
          - --auto-approve
        assertions:
          - select: plan.metadata
            expect:
              fields:
                mode: sync
          - select: plan.summary
            expect:
              fields:
                total_changes: 6
                by_action.CREATE: 6
          - select: summary
            expect:
              fields:
                applied: 6
                failed: 0
                status: success

  - name: 003-dump-and-round-trip
    skipInputs: true
    commands:
      - name: 000-dump-org-teams
        run:
          - dump
          - declarative
          - "--resources=organization.teams"
          - --include-child-resources
        outputFormat: none
        parseAs: yaml
        stdoutFile: "{{ .workdir }}/dump.yaml"
        assertions:
          - name: org-teams-key-present
            select: organization.teams
            expect:
              fields:
                "length(@)": 2
          - name: alpha-team-present
            select: "organization.teams[?name=='{{ .vars.teamAlphaName }}'] | [0]"
            expect:
              fields:
                name: "{{ .vars.teamAlphaName }}"
          - name: beta-team-present
            select: "organization.teams[?name=='{{ .vars.teamBetaName }}'] | [0]"
            expect:
              fields:
                name: "{{ .vars.teamBetaName }}"
          - name: alpha-team-role-present
            select: >-
              organization.teams[?name=='{{ .vars.teamAlphaName }}'] |
              [0].roles[?role_name=='Viewer'] | [0]
            expect:
              fields:
                role_name: Viewer
                entity_id: "*"
                entity_type_name: APIs
                entity_region: us
          - name: org-users-present
            select: organization.users
            expect:
              fields:
                "length(@)": 1
          - name: user-team-membership-present
            select: "organization.users[0].teams"
            expect:
              fields:
                "length(@)": 1

          - name: org-system-accounts-present
            select: organization."system-accounts"
            expect:
              fields:
                "length(@)": 1
          - name: system-account-membership-present
            select: organization."system-accounts"[0]
            expect:
              fields:
                name: "{{ .vars.systemAccountName }}"
                "length(teams)": 1
          - name: system-account-alpha-team-reference
            select: >-
              organization."system-accounts"[0].teams[0].team ==
              (organization.teams[?name=='{{ .vars.teamAlphaName }}'].ref | [0])
            expect:
              fields:
                "@": true

      - name: 001-plan-from-dump
        outputFormat: disable
        run:
          - plan
          - -f
          - "{{ .workdir }}/dump.yaml"
          - --mode
          - apply
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 0

      - name: 002-reset-before-round-trip
        resetOrg: true

      # Reset deletes system accounts; recreate the name-based lookup target.
      - name: 003-recreate-system-account
        create:
          resource: system-account
          payload:
            inline:
              name: "{{ .vars.systemAccountName }}"
              description: System account for organization teams dump E2E coverage

      - name: 004-sync-dumped-config
        outputFormat: json
        run:
          - sync
          - -f
          - "{{ .workdir }}/dump.yaml"
          - --auto-approve
        assertions:
          - select: plan.metadata
            expect:
              fields:
                mode: sync
          - select: summary
            expect:
              fields:
                applied: 6
                failed: 0
                status: success

      - name: 005-get-teams
        run:
          - get
          - org
          - teams
          - -o
          - json
        assertions:
          - select: "[?name=='{{ .vars.teamAlphaName }}'] | [0]"
            expect:
              fields:
                name: "{{ .vars.teamAlphaName }}"
          - select: "[?name=='{{ .vars.teamBetaName }}'] | [0]"
            expect:
              fields:
                name: "{{ .vars.teamBetaName }}"

      - name: 006-get-alpha-team-roles
        run:
          - get
          - org
          - team
          - roles
          - --team-name
          - "{{ .vars.teamAlphaName }}"
          - -o
          - json
        assertions:
          - select: "[?role_name=='Viewer' && entity_type_name=='APIs'] | [0]"
            expect:
              fields:
                role_name: Viewer
                entity_id: "*"
                entity_type_name: APIs
                entity_region: us

      - name: 007-dump-verify-memberships
        run:
          - dump
          - declarative
          - "--resources=organization.teams"
          - --include-child-resources
        outputFormat: none
        parseAs: yaml
        assertions:
          - name: org-users-present-after-roundtrip
            select: organization.users
            expect:
              fields:
                "length(@)": 1
          - name: user-team-membership-preserved
            select: "organization.users[0].teams"
            expect:
              fields:
                "length(@)": 1

          - name: org-system-accounts-present-after-roundtrip
            select: organization."system-accounts"
            expect:
              fields:
                "length(@)": 1
          - name: system-account-membership-present-after-roundtrip
            select: organization."system-accounts"[0]
            expect:
              fields:
                name: "{{ .vars.systemAccountName }}"
                "length(teams)": 1
          - name: system-account-alpha-team-reference-after-roundtrip
            select: >-
              organization."system-accounts"[0].teams[0].team ==
              (organization.teams[?name=='{{ .vars.teamAlphaName }}'].ref | [0])
            expect:
              fields:
                "@": true

  - name: 004-bootstrap-pagination
    commands:
      - name: 000-sync-pagination-fixture
        outputFormat: json
        run:
          - sync
          - -f
          - "{{ .workdir }}/pagination"
          - --auto-approve
        assertions:
          - select: plan.summary
            expect:
              fields:
                total_changes: 153
                by_action.CREATE: 153
          - select: summary
            expect:
              fields:
                applied: 153
                failed: 0
                status: success

  - name: 005-verify-101-role-boundary
    skipInputs: true
    commands:
      - name: 000-dump-101-roles-page-size-1
        outputFormat: none
        parseAs: yaml
        run:
          - dump
          - declarative
          - --resources=organization.teams
          - "--filter-name={{ .vars.paginationTeamName }}"
          - --include-child-resources
          - --page-size=1
        assertions:
          - name: pagination-team-present
            select: organization.teams
            expect:
              fields:
                "length(@)": 1
                "[0].name": "{{ .vars.paginationTeamName }}"
          - name: all-assigned-roles-exported
            select: organization.teams[0].roles
            expect:
              fields:
                "length(@)": 101
                "length([?role_name=='Admin'])": 51
                "length([?role_name=='Viewer'])": 50
                "length([?entity_type_name=='APIs' && entity_region=='us'])": 101

      - name: 001-dump-101-roles-page-size-10
        outputFormat: none
        parseAs: yaml
        run:
          - dump
          - declarative
          - --resources=organization.teams
          - "--filter-name={{ .vars.paginationTeamName }}"
          - --include-child-resources
          - --page-size=10
        assertions:
          - name: pagination-team-present
            select: organization.teams
            expect:
              fields:
                "length(@)": 1
                "[0].name": "{{ .vars.paginationTeamName }}"
          - name: all-assigned-roles-exported
            select: organization.teams[0].roles
            expect:
              fields:
                "length(@)": 101
                "length([?role_name=='Admin'])": 51
                "length([?role_name=='Viewer'])": 50
                "length([?entity_type_name=='APIs' && entity_region=='us'])": 101

      - name: 002-dump-101-roles-page-size-99
        outputFormat: none
        parseAs: yaml
        run:
          - dump
          - declarative
          - --resources=organization.teams
          - "--filter-name={{ .vars.paginationTeamName }}"
          - --include-child-resources
          - --page-size=99
        assertions:
          - name: pagination-team-present
            select: organization.teams
            expect:
              fields:
                "length(@)": 1
                "[0].name": "{{ .vars.paginationTeamName }}"
          - name: all-assigned-roles-exported
            select: organization.teams[0].roles
            expect:
              fields:
                "length(@)": 101
                "length([?role_name=='Admin'])": 51
                "length([?role_name=='Viewer'])": 50
                "length([?entity_type_name=='APIs' && entity_region=='us'])": 101

      - name: 003-dump-101-roles-page-size-100
        outputFormat: none
        parseAs: yaml
        run:
          - dump
          - declarative
          - --resources=organization.teams
          - "--filter-name={{ .vars.paginationTeamName }}"
          - --include-child-resources
          - --page-size=100
        assertions:
          - name: pagination-team-present
            select: organization.teams
            expect:
              fields:
                "length(@)": 1
                "[0].name": "{{ .vars.paginationTeamName }}"
          - name: all-assigned-roles-exported
            select: organization.teams[0].roles
            expect:
              fields:
                "length(@)": 101
                "length([?role_name=='Admin'])": 51
                "length([?role_name=='Viewer'])": 50
                "length([?entity_type_name=='APIs' && entity_region=='us'])": 101

      - name: 004-dump-101-roles-page-size-101
        outputFormat: none
        parseAs: yaml
        run:
          - dump
          - declarative
          - --resources=organization.teams
          - "--filter-name={{ .vars.paginationTeamName }}"
          - --include-child-resources
          - --page-size=101
        assertions:
          - name: pagination-team-present
            select: organization.teams
            expect:
              fields:
                "length(@)": 1
                "[0].name": "{{ .vars.paginationTeamName }}"
          - name: all-assigned-roles-exported
            select: organization.teams[0].roles
            expect:
              fields:
                "length(@)": 101
                "length([?role_name=='Admin'])": 51
                "length([?role_name=='Viewer'])": 50
                "length([?entity_type_name=='APIs' && entity_region=='us'])": 101

      # Plan from the complete original inputs, independently of dump output.
      - name: 005-plan-apply-original-101-role-manifest
        outputFormat: disable
        run:
          - plan
          - -f
          - "{{ .workdir }}/pagination"
          - --mode=apply
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 0

      - name: 006-plan-sync-original-101-role-manifest
        outputFormat: disable
        run:
          - plan
          - -f
          - "{{ .workdir }}/pagination"
          - --mode=sync
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 0

  - name: 006-verify-100-role-boundary
    skipInputs: true
    commands:
      - name: 000-sync-to-100-roles
        outputFormat: json
        run:
          - sync
          - -f
          - "{{ .workdir }}/pagination/base.yaml"
          - -f
          - "{{ .workdir }}/pagination/roles-99.yaml"
          - -f
          - "{{ .workdir }}/pagination/role-100.yaml"
          - --auto-approve
        assertions:
          - select: plan.summary
            expect:
              fields:
                total_changes: 1
                by_action.DELETE: 1
          - select: summary
            expect:
              fields:
                applied: 1
                failed: 0
                status: success

      - name: 001-dump-100-roles-page-size-100
        outputFormat: none
        parseAs: yaml
        run:
          - dump
          - declarative
          - --resources=organization.teams
          - "--filter-name={{ .vars.paginationTeamName }}"
          - --include-child-resources
          - --page-size=100
        assertions:
          - name: pagination-team-present
            select: organization.teams
            expect:
              fields:
                "length(@)": 1
                "[0].name": "{{ .vars.paginationTeamName }}"
          - name: all-assigned-roles-exported
            select: organization.teams[0].roles
            expect:
              fields:
                "length(@)": 100
                "length([?role_name=='Admin'])": 50
                "length([?role_name=='Viewer'])": 50
                "length([?entity_type_name=='APIs' && entity_region=='us'])": 100

      # Plan from the complete original inputs, independently of dump output.
      - name: 002-plan-apply-original-100-role-manifest
        outputFormat: disable
        run:
          - plan
          - -f
          - "{{ .workdir }}/pagination/base.yaml"
          - -f
          - "{{ .workdir }}/pagination/roles-99.yaml"
          - -f
          - "{{ .workdir }}/pagination/role-100.yaml"
          - --mode=apply
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 0

      - name: 003-plan-sync-original-100-role-manifest
        outputFormat: disable
        run:
          - plan
          - -f
          - "{{ .workdir }}/pagination/base.yaml"
          - -f
          - "{{ .workdir }}/pagination/roles-99.yaml"
          - -f
          - "{{ .workdir }}/pagination/role-100.yaml"
          - --mode=sync
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 0

  - name: 007-verify-99-role-boundary
    skipInputs: true
    commands:
      - name: 000-sync-to-99-roles
        outputFormat: json
        run:
          - sync
          - -f
          - "{{ .workdir }}/pagination/base.yaml"
          - -f
          - "{{ .workdir }}/pagination/roles-99.yaml"
          - --auto-approve
        assertions:
          - select: plan.summary
            expect:
              fields:
                total_changes: 1
                by_action.DELETE: 1
          - select: summary
            expect:
              fields:
                applied: 1
                failed: 0
                status: success

      - name: 001-dump-99-roles-page-size-100
        outputFormat: none
        parseAs: yaml
        run:
          - dump
          - declarative
          - --resources=organization.teams
          - "--filter-name={{ .vars.paginationTeamName }}"
          - --include-child-resources
          - --page-size=100
        assertions:
          - name: pagination-team-present
            select: organization.teams
            expect:
              fields:
                "length(@)": 1
                "[0].name": "{{ .vars.paginationTeamName }}"
          - name: all-assigned-roles-exported
            select: organization.teams[0].roles
            expect:
              fields:
                "length(@)": 99
                "length([?role_name=='Admin'])": 50
                "length([?role_name=='Viewer'])": 49
                "length([?entity_type_name=='APIs' && entity_region=='us'])": 99

      # Plan from the complete original inputs, independently of dump output.
      - name: 002-plan-apply-original-99-role-manifest
        outputFormat: disable
        run:
          - plan
          - -f
          - "{{ .workdir }}/pagination/base.yaml"
          - -f
          - "{{ .workdir }}/pagination/roles-99.yaml"
          - --mode=apply
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 0

      - name: 003-plan-sync-original-99-role-manifest
        outputFormat: disable
        run:
          - plan
          - -f
          - "{{ .workdir }}/pagination/base.yaml"
          - -f
          - "{{ .workdir }}/pagination/roles-99.yaml"
          - --mode=sync
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 0

  - name: 008-reset-cleanup
    skipInputs: true
    commands:
      - resetOrg: true
