baseInputsPath: testdata

env:
  KONGCTL_LOG_LEVEL: info


vars:
  egwName: egw-cp-for-vc-cluster-policy-test
  egwRef: egw-cp-for-vc-cluster-policy-test
  backendClusterRef: default-backend-cluster
  backendClusterName: default-backend-cluster
  virtualClusterRef: default-virtual-cluster-for-cluster-policy-test
  virtualClusterName: default-virtual-cluster-name-for-cluster-policy-test
  clusterPolicyRef: default-cluster-policy
  clusterPolicyName: default-cluster-policy-name-for-test
  clusterPolicyDescription: Default Cluster Policy description

defaults:
  mask:
    dropKeys:
      - id
      - created_at
      - updated_at

steps:
  - name: 000-reset-org
    skipInputs: true
    commands:
      - resetOrg: true
  - name: 001-plan-apply-create
    commands:
      - name: 001-plan-create
        outputFormat: disable
        stdoutFile: "{{ .workdir }}/plan-create.json"
        run:
          - plan
          - -f
          - "{{ .workdir }}/config.yaml"
          - --mode
          - apply
        assertions:
          - select: metadata
            expect:
              fields:
                mode: apply
          - select: summary
            expect:
              fields:
                total_changes: 4
                by_action.CREATE: 4
          - select: >-
              changes[?resource_type=='event_gateway' && resource_ref=='{{ .vars.egwRef }}'] | [0]
            expect:
              fields:
                action: CREATE
                resource_ref: "{{ .vars.egwRef }}"
          - select: >-
              changes[?resource_type=='event_gateway_backend_cluster' && resource_ref=='{{ .vars.backendClusterRef }}'] | [0]
            expect:
              fields:
                action: CREATE
                resource_ref: "{{ .vars.backendClusterRef }}"
          - select: >-
              changes[?resource_type=='event_gateway_virtual_cluster' && resource_ref=='{{ .vars.virtualClusterRef }}'] | [0]
            expect:
              fields:
                action: CREATE
                resource_ref: "{{ .vars.virtualClusterRef }}"
          - select: >-
              changes[?resource_type=='event_gateway_virtual_cluster_cluster_policy' && resource_ref=='{{ .vars.clusterPolicyRef }}'] | [0]
            expect:
              fields:
                action: CREATE
                resource_ref: "{{ .vars.clusterPolicyRef }}"
      - name: 002-apply-create
        replanOnRetry: ["{{ .workdir }}/config.yaml"]
        outputFormat: json
        run:
          - apply
          - --plan
          - "{{ .workdir }}/plan-create.json"
          - --auto-approve
        assertions:
          - select: summary
            expect:
              fields:
                failed: 0
                status: success

      - name: 003-verify-create
        run:
          - get
          - event-gateway
          - virtual-cluster
          - cluster-policies
          - --gateway-name
          - "{{ .vars.egwName }}"
          - --virtual-cluster-name
          - "{{ .vars.virtualClusterName }}"
          - -o
          - json
        recordVar:
          name: clusterPolicyID
          responsePath: "[0].id"
        assertions:
          - select: "length(@)"
            expect:
              fields:
                "@": 1
          - select: "[0]"
            expect:
              fields:
                name: "{{ .vars.clusterPolicyName }}"
                description: "Default Cluster Policy description"
      - name: 004-get-cluster-policy-by-name
        run:
          - get
          - event-gateway
          - virtual-cluster
          - cluster-policies
          - --gateway-name
          - "{{ .vars.egwName }}"
          - --virtual-cluster-name
          - "{{ .vars.virtualClusterName }}"
          - "{{ .vars.clusterPolicyName }}"
          - -o
          - json
        assertions:
          - select: name
            expect:
              fields:
                "@": "{{ .vars.clusterPolicyName }}"
          - select: type
            expect:
              fields:
                "@": acls
      - name: 005-get-cluster-policy-by-id
        run:
          - get
          - event-gateway
          - virtual-cluster
          - cluster-policies
          - --gateway-name
          - "{{ .vars.egwName }}"
          - --virtual-cluster-name
          - "{{ .vars.virtualClusterName }}"
          - "{{ .vars.clusterPolicyID }}"
          - -o
          - json
        assertions:
          - select: name
            expect:
              fields:
                "@": "{{ .vars.clusterPolicyName }}"
          - select: type
            expect:
              fields:
                "@": acls
  - name: 002-plan-apply-update
    inputOverlayDirs:
      - overlays/001-update-fields
    commands:
      - name: 001-plan-update
        outputFormat: disable
        stdoutFile: "{{ .workdir }}/plan-update.json"
        run:
          - plan
          - -f
          - "{{ .workdir }}/config.yaml"
          - --mode
          - apply
        assertions:
          - select: metadata
            expect:
              fields:
                mode: apply
          - select: summary
            expect:
              fields:
                total_changes: 1
                by_action.UPDATE: 1
          - select: >-
              changes[?resource_type=='event_gateway_virtual_cluster_cluster_policy' && resource_ref=='{{ .vars.clusterPolicyRef }}'] | [0]
            expect:
              fields:
                action: UPDATE
                resource_ref: "{{ .vars.clusterPolicyRef }}"
      - name: 002-apply-update
        replanOnRetry: ["{{ .workdir }}/config.yaml"]
        outputFormat: json
        run:
          - apply
          - --plan
          - "{{ .workdir }}/plan-update.json"
          - --auto-approve
        assertions:
          - select: summary
            expect:
              fields:
                failed: 0
                status: success
      - name: 003-verify-update
        run:
          - get
          - event-gateway
          - virtual-cluster
          - cluster-policies
          - --gateway-name
          - "{{ .vars.egwName }}"
          - --virtual-cluster-name
          - "{{ .vars.virtualClusterName }}"
          - -o
          - json
        assertions:
          - select: "length(@)"
            expect:
              fields:
                "@": 1
          - select: "[0]"
            expect:
              fields:
                name: "{{ .vars.clusterPolicyName }}"
                type: acls
                description: Default Cluster Policy description updated
                enabled: false
                labels:
                  env: staging
                  version: v2
                config:
                  rules:
                    - action: "allow"
                      operations:
                        - name: "describe_configs"
                      resource_names:
                        - match: "*updated"
                      resource_type: "transactional_id"

  - name: 003-idempotency-check
    inputOverlayDirs:
      - overlays/001-update-fields
    commands:
      - name: 001-plan-no-op
        outputFormat: disable
        run:
          - plan
          - -f
          - "{{ .workdir }}/config.yaml"
          - --mode
          - apply
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 0
  - name: 004-sync-delete
    inputOverlayDirs:
      - overlays/002-sync-delete
