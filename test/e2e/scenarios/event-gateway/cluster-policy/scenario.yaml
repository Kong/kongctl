          - virtual-cluster
          - cluster-policies
          - --gateway-name
          - '{{ .vars.egwName }}'
          - --virtual-cluster-name
          - '{{ .vars.virtualClusterName }}'
          - -o
          - json
        assertions:
          - select: length(@)
            expect:
              fields:
                '@': 1
          - select: '[0]'
            expect:
              fields:
                name: request-rules
                type: request_rule_validator
                description: Validate produce requests
                enabled: true
                labels:
                  env: test
                length(config.requests): 1
                config.requests[0].type: produce
                config.requests[0].rules[0].action: reject
                config.requests[0].rules[0].rule: context.produce.acks == -1
      - name: idempotency
        run:
          - plan
          - -f
          - '{{ .workdir }}/config.yaml'
          - --mode
          - apply
        outputFormat: disable
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 0
