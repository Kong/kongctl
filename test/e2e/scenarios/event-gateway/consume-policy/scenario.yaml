baseInputsPath: testdata

env:
  KONGCTL_LOG_LEVEL: info


vars:
  egwName: egw-cp-for-vc-consume-policy-test
  egwRef: egw-cp-for-vc-consume-policy-test
  backendClusterRef: default-backend-cluster
  backendClusterName: default-backend-cluster
  virtualClusterRef: default-virtual-cluster-for-consume-policy-test
  virtualClusterName: default-virtual-cluster-name-for-consume-policy-test
  consumePolicyRef: default-consume-policy
  consumePolicyName: default-consume-policy-name-for-test
  consumePolicyDescription: Default Consume Policy description
  decryptPolicyRef: decrypt-fields-consume-policy
  decryptPolicyName: decrypt-fields-consume-policy-name-for-test

defaults:
  mask:
    dropKeys:
      - id
      - created_at
      - updated_at

steps:
  - name: 000-reset-org
    skipInputs: true
    commands:
      - resetOrg: true
  - name: 001-plan-apply-create
    commands:
      - name: 001-plan-create
        outputFormat: disable
        stdoutFile: "{{ .workdir }}/plan-create.json"
        run:
          - plan
          - -f
          - "{{ .workdir }}/config.yaml"
          - --mode
          - apply
        assertions:
          - select: metadata
            expect:
              fields:
                mode: apply
          - select: summary
            expect:
              fields:
                total_changes: 4
                by_action.CREATE: 4
          - select: >-
              changes[?resource_type=='event_gateway' && resource_ref=='{{ .vars.egwRef }}'] | [0]
            expect:
              fields:
                action: CREATE
                resource_ref: "{{ .vars.egwRef }}"
          - select: >-
              changes[?resource_type=='event_gateway_backend_cluster' && resource_ref=='{{ .vars.backendClusterRef }}'] | [0]
            expect:
              fields:
                action: CREATE
                resource_ref: "{{ .vars.backendClusterRef }}"
          - select: >-
              changes[?resource_type=='event_gateway_virtual_cluster' && resource_ref=='{{ .vars.virtualClusterRef }}'] | [0]
            expect:
              fields:
                action: CREATE
                resource_ref: "{{ .vars.virtualClusterRef }}"
          - select: >-
              changes[?resource_type=='event_gateway_virtual_cluster_consume_policy' && resource_ref=='{{ .vars.consumePolicyRef }}'] | [0]
            expect:
              fields:
                action: CREATE
                resource_ref: "{{ .vars.consumePolicyRef }}"
      - name: 002-apply-create
        outputFormat: json
        run:
          - apply
          - --plan
          - "{{ .workdir }}/plan-create.json"
          - --auto-approve
        assertions:
          - select: summary
            expect:
              fields:
                applied: 4
                failed: 0

      - name: 003-verify-create
        run:
          - get
          - event-gateway
          - virtual-cluster
          - consume-policies
          - --gateway-name
          - "{{ .vars.egwName }}"
          - --virtual-cluster-name
          - "{{ .vars.virtualClusterName }}"
          - -o
          - json
        recordVar:
          name: consumePolicyID
          responsePath: "[0].id"
        assertions:
          - select: "length(@)"
            expect:
              fields:
                "@": 1
          - select: "[0]"
            expect:
              fields:
                name: "{{ .vars.consumePolicyName }}"
                description: "Default Consume Policy description"
      - name: 004-get-consume-policy-by-name
        run:
          - get
          - event-gateway
          - virtual-cluster
          - consume-policies
          - --gateway-name
          - "{{ .vars.egwName }}"
          - --virtual-cluster-name
          - "{{ .vars.virtualClusterName }}"
          - "{{ .vars.consumePolicyName }}"
          - -o
          - json
        assertions:
          - select: name
            expect:
              fields:
                "@": "{{ .vars.consumePolicyName }}"
          - select: type
            expect:
              fields:
                "@": modify_headers
      - name: 005-get-consume-policy-by-id
        run:
          - get
          - event-gateway
          - virtual-cluster
          - consume-policies
          - --gateway-name
          - "{{ .vars.egwName }}"
          - --virtual-cluster-name
          - "{{ .vars.virtualClusterName }}"
          - "{{ .vars.consumePolicyID }}"
          - -o
          - json
        assertions:
          - select: name
            expect:
              fields:
                "@": "{{ .vars.consumePolicyName }}"
          - select: type
            expect:
              fields:
                "@": modify_headers
  - name: 002-plan-apply-update
    inputOverlayDirs:
      - overlays/001-update-fields
    commands:
      - name: 001-plan-update
        outputFormat: disable
        stdoutFile: "{{ .workdir }}/plan-update.json"
        run:
          - plan
          - -f
          - "{{ .workdir }}/config.yaml"
          - --mode
          - apply
        assertions:
          - select: metadata
            expect:
              fields:
                mode: apply
          - select: summary
            expect:
              fields:
                total_changes: 1
                by_action.UPDATE: 1
          - select: >-
              changes[?resource_type=='event_gateway_virtual_cluster_consume_policy' && resource_ref=='{{ .vars.consumePolicyRef }}'] | [0]
            expect:
              fields:
                action: UPDATE
                resource_ref: "{{ .vars.consumePolicyRef }}"
      - name: 002-apply-update
        outputFormat: json
        run:
          - apply
          - --plan
          - "{{ .workdir }}/plan-update.json"
          - --auto-approve
        assertions:
          - select: summary
            expect:
              fields:
                applied: 1
                failed: 0
      - name: 003-verify-update
        run:
          - get
          - event-gateway
          - virtual-cluster
          - consume-policies
          - --gateway-name
          - "{{ .vars.egwName }}"
          - --virtual-cluster-name
          - "{{ .vars.virtualClusterName }}"
          - -o
          - json
        assertions:
          - select: "length(@)"
            expect:
              fields:
                "@": 1
          - select: "[0]"
            expect:
              fields:
                name: "{{ .vars.consumePolicyName }}"
                type: modify_headers
                description: Default Consume Policy description updated
                enabled: false
                labels:
                  env: production
                  version: v2
                config:
                  actions:
                    - op: set
                      key: x-env-updated
                      value: production
      - name: 004-idempotency-check
        outputFormat: disable
        run:
          - plan
          - -f
          - "{{ .workdir }}/config.yaml"
          - --mode
          - apply
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 0

  - name: 003-dump-round-trip
    skipInputs: true
    commands:
      - name: 001-dump
        run:
          - dump
          - declarative
          - "--resources=event_gateways"
          - --include-child-resources
          - "--filter-name={{ .vars.egwName }}"
        outputFormat: none
        parseAs: yaml
        stdoutFile: "{{ .workdir }}/dump.yaml"
        assertions:
          - select: >-
              event_gateways[?name=='{{ .vars.egwName }}'] | [0].virtual_clusters[?name=='{{ .vars.virtualClusterName }}'] | [0].consume_policies[?name=='{{ .vars.consumePolicyName }}'] | [0]
            expect:
              fields:
                name: "{{ .vars.consumePolicyName }}"
                type: modify_headers
                enabled: false
                "config.actions[0].op": set
                "config.actions[0].key": x-env-updated
                "config.actions[0].value": production
      - name: 002-plan-from-dump
        outputFormat: disable
        run:
          - plan
          - -f
          - "{{ .workdir }}/dump.yaml"
          - --mode
          - sync
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 0

  - name: 004-sync-delete
    inputOverlayDirs:
