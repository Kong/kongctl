event_gateway_virtual_cluster_cluster_policies:
  - ref: "{{ .vars.lookup_cluster_policy_ref }}"
    name: "{{ .vars.lookup_cluster_policy_name }}"
    description: "{{ .vars.lookup_cluster_policy_description }}"
    event_gateway: !lookup {name: "{{ .vars.egw_name }}"}
    virtual_cluster: !lookup {name: "{{ .vars.virtual_cluster_name }}"}
    type: acls
    enabled: true
    config:
      rules:
        - action: deny
          operations:
            - name: describe_configs
          resource_names:
            - match: "*"
          resource_type: transactional_id
