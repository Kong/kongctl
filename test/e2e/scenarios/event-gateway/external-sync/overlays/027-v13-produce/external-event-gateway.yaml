---
event_gateways:
  - ref: external-sync-event-gateway
    _external:
      selector:
        matchFields:
          name: external-sync-event-gateway
    virtual_clusters:
      - ref: external-sync-virtual-cluster
        _external:
          selector:
            matchFields:
              name: external-sync-virtual-cluster
        produce_policies:
          - ref: external-sync-produce-policy
            name: external-sync-produce-policy
            description: External sync produce policy
            type: modify_headers
            enabled: true
            labels:
              env: staging
              team: payments
            config:
              actions:
                - op: set
                  key: x-producer-id
                  value: ${client_id}
                - op: remove
                  key: x-original-header
          - ref: external-produce-schema
            name: external-produce-schema
            type: schema_validation
            config:
              type: json
              validate_value: true
              failure_mode: reject
          - ref: external-mask_fields
            name: external-mask_fields
            type: mask_fields
            enabled: true
            parent_policy_id: !ref 'external-produce-schema#id'
            config:
              failure_mode: reject
              mask_fields:
                - paths: record.value.content["customer.ssn"]
                  strategy:
                    type: replace
                    phrase: '[REDACTED]'
