---
event_gateways:
  - ref: external-sync-event-gateway
    _external:
      selector:
        matchFields:
          name: external-sync-event-gateway
    virtual_clusters:
      - ref: external-sync-virtual-cluster
        _external:
          selector:
            matchFields:
              name: external-sync-virtual-cluster
        consume_policies:
          - ref: external-sync-consume-policy
            name: external-sync-consume-policy
            description: External sync consume policy
            type: modify_headers
            enabled: true
            labels:
              env: staging
              team: payments
            config:
              actions:
                - op: set
                  key: x-env
                  value: staging
          - ref: external-consume-schema
            name: external-consume-schema
            type: schema_validation
            config:
              type: json
              validate_value: true
              failure_mode: error
          - ref: external-transcode
            name: external-transcode
            type: transcode
            enabled: true
            parent_policy_id: !ref 'external-consume-schema#id'
            config:
              failure_mode: error
              output_format: json
