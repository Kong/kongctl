baseInputsPath: testdata

env:
  KONGCTL_LOG_LEVEL: info
  KONGCTL_E2E_SCHEMA_REGISTRY_PASSWORD: testpassword


vars:
  egwName: egw-cp-for-schema-registry-test-name
  schemaRegistryRef: default-schema-registry-ref
  schemaRegistryName: default-schema-registry-name
  vaultReference: "${vault['env']['PATH']}"
  rotatedVaultReference: "${vault['env']['HOME']}"

defaults:
  mask:
    dropKeys:
      - id
      - created_at
      - updated_at

steps:
  - name: 000-reset-org
    skipInputs: true
    commands:
      - resetOrg: true
  - name: 001-plan-apply-create
    commands:
      - name: 001-plan-create
        outputFormat: disable
        stdoutFile: "{{ .workdir }}/plan-create.json"
        run:
          - plan
          - -f
          - "{{ .workdir }}/config.yaml"
          - --mode
          - apply
        assertions:
          - select: metadata
            expect:
              fields:
                mode: apply
          - select: summary
            expect:
              fields:
                total_changes: 2
                by_action.CREATE: 2
          - select: >-
              changes[?resource_type=='event_gateway' && resource_ref=='egw-cp-for-schema-registry-test-ref'] | [0]
            expect:
              fields:
                action: CREATE
                resource_ref: "egw-cp-for-schema-registry-test-ref"
          - select: >-
              changes[?resource_type=='event_gateway_schema_registry' && resource_ref=='{{ .vars.schemaRegistryRef }}'] | [0]
            expect:
              fields:
                action: CREATE
                resource_ref: "{{ .vars.schemaRegistryRef }}"
                fields.config.authentication.password: "{{ .vars.vaultReference }}"
                "contains(keys(@), 'secret_writes')": false
      - name: 002-apply-create
        outputFormat: json
        run:
          - apply
          - --plan
          - "{{ .workdir }}/plan-create.json"
          - --auto-approve
        assertions:
          - select: summary
            expect:
              fields:
                applied: 2
                failed: 0

      - name: 003-verify-create
        run:
          - get
          - event-gateway
          - schema-registries
          - --gateway-name
          - "{{ .vars.egwName }}"
          - -o
          - json
        recordVar:
          name: schemaRegistryID
          responsePath: "[?name=='{{ .vars.schemaRegistryName }}'] | [0].id"
        assertions:
          - select: "length(@)"
            expect:
              fields:
                "@": 1
          - select: "[0]"
            expect:
              fields:
                name: "{{ .vars.schemaRegistryName }}"
                description: "Default Schema Registry description"
      - name: 004-get-schema-registry-by-name
        run:
          - get
          - event-gateway
          - schema-registries
          - --gateway-name
          - "{{ .vars.egwName }}"
          - "{{ .vars.schemaRegistryName }}"
          - -o
          - json
        assertions:
          - select: name
            expect:
              fields:
                "@": "{{ .vars.schemaRegistryName }}"
          - select: description
            expect:
              fields:
                "@": "Default Schema Registry description"
          - select: config.authentication.password
            expect:
              fields:
                "@": "{{ .vars.vaultReference }}"
      - name: 005-get-schema-registry-by-id
        run:
          - get
          - event-gateway
          - schema-registries
          - --gateway-name
          - "{{ .vars.egwName }}"
          - "{{ .vars.schemaRegistryID }}"
          - -o
          - json
        assertions:
          - select: name
            expect:
              fields:
                "@": "{{ .vars.schemaRegistryName }}"
          - select: description
            expect:
              fields:
                "@": "Default Schema Registry description"
          - select: config.authentication.password
            expect:
              fields:
                "@": "{{ .vars.vaultReference }}"
  - name: 002-plan-apply-update
    inputOverlayDirs:
      - overlays/001-update-fields
    commands:
      - name: 001-plan-update
        outputFormat: disable
        stdoutFile: "{{ .workdir }}/plan-update.json"
        run:
          - plan
          - -f
          - "{{ .workdir }}/config.yaml"
          - --mode
          - apply
        assertions:
          - select: metadata
            expect:
              fields:
                mode: apply
          - select: summary
            expect:
              fields:
                total_changes: 1
                by_action.UPDATE: 1
          - select: >-
              changes[?resource_type=='event_gateway_schema_registry' && resource_ref=='{{ .vars.schemaRegistryRef }}'] | [0]
            expect:
              fields:
                action: UPDATE
                resource_ref: "{{ .vars.schemaRegistryRef }}"
                fields.config.authentication.password: "{{ .vars.vaultReference }}"
                "contains(keys(@), 'secret_writes')": false
      - name: 002-apply-update
        outputFormat: json
        run:
          - apply
          - --plan
          - "{{ .workdir }}/plan-update.json"
          - --auto-approve
        assertions:
          - select: summary
            expect:
              fields:
                applied: 1
                failed: 0
      - name: 003-verify-update
        run:
          - get
          - event-gateway
          - schema-registries
          - --gateway-name
          - "{{ .vars.egwName }}"
          - -o
          - json
        assertions:
          - select: "length(@)"
            expect:
              fields:
                "@": 1
          - select: "[0]"
            expect:
              fields:
                name: "{{ .vars.schemaRegistryName }}"
                description: "Updated Schema Registry description"
                type: confluent
                config.endpoint: https://schema-registry-updated.example.com
                config.schema_type: avro
                config.timeout_seconds: 60
                config.authentication.type: basic
                config.authentication.username: updateduser
                config.authentication.password: "{{ .vars.vaultReference }}"
  - name: 003-plan-apply-vault-reference-update
    inputOverlayDirs:
      - overlays/002-vault-reference-update
    commands:
      - name: 001-plan-vault-reference-update
        outputFormat: disable
        stdoutFile: "{{ .workdir }}/plan-vault-reference-update.json"
        run:
          - plan
          - -f
          - "{{ .workdir }}/config.yaml"
          - --mode
          - apply
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 1
                by_action.UPDATE: 1
          - select: >-
              changes[?resource_type=='event_gateway_schema_registry' && resource_ref=='{{ .vars.schemaRegistryRef }}'] | [0]
            expect:
              fields:
                action: UPDATE
                fields.config.authentication.password: "{{ .vars.rotatedVaultReference }}"
                "contains(keys(@), 'secret_writes')": false
      - name: 002-apply-vault-reference-update
        outputFormat: json
        run:
          - apply
          - --plan
          - "{{ .workdir }}/plan-vault-reference-update.json"
          - --auto-approve
        assertions:
          - select: summary
            expect:
              fields:
                applied: 1
                failed: 0
      - name: 003-verify-vault-reference-update
        run:
          - get
          - event-gateway
          - schema-registries
          - --gateway-name
          - "{{ .vars.egwName }}"
          - "{{ .vars.schemaRegistryName }}"
          - -o
          - json
        assertions:
          - select: config.authentication.password
            expect:
              fields:
                "@": "{{ .vars.rotatedVaultReference }}"
      - name: 004-diff-no-changes
        outputFormat: text
        parseAs: raw
        run:
          - diff
          - -f
          - "{{ .workdir }}/config.yaml"
        assertions:
          - select: stdout
            expect:
              fields:
                "contains(@, 'No changes detected. Konnect is up to date.')": true
  - name: 004-sync-delete
    inputOverlayDirs:
      - overlays/002-sync-delete
    commands:
      - name: 001-plan-sync-delete
        outputFormat: disable
        stdoutFile: "{{ .workdir }}/plan-sync-delete.json"
        run:
          - plan
          - -f
          - "{{ .workdir }}/config.yaml"
          - --mode
          - sync
        assertions:
          - select: metadata
            expect:
              fields:
                mode: sync
          - select: summary
            expect:
              fields:
                total_changes: 1
                by_action.DELETE: 1
          - select: >-
              changes[?resource_type=='event_gateway_schema_registry' && resource_ref=='{{ .vars.schemaRegistryName }}'] | [0]
            expect:
              fields:
                action: DELETE
                resource_ref: "{{ .vars.schemaRegistryName }}"
      - name: 002-sync-delete
        outputFormat: json
        run:
          - sync
          - --plan
          - "{{ .workdir }}/plan-sync-delete.json"
          - --auto-approve
        assertions:
          - select: summary
            expect:
              fields:
                applied: 1
                failed: 0
      - name: 003-verify-delete
        run:
          - get
          - event-gateway
          - schema-registries
          - --gateway-name
          - "{{ .vars.egwName }}"
          - -o
          - json
        assertions:
          - select: "length(@)"
            expect:
              fields:
                "@": 0
  - name: 005-root-level-declaration
    inputOverlayDirs:
      - overlays/003-root-level-declaration
    commands:
      - name: 001-plan-root-level
        outputFormat: disable
        stdoutFile: "{{ .workdir }}/plan-root-level.json"
        run:
          - plan
          - -f
          - "{{ .workdir }}/config.yaml"
          - --mode
          - apply
        assertions:
          - select: metadata
            expect:
              fields:
                mode: apply
          - select: summary
            expect:
              fields:
                total_changes: 1
                by_action.CREATE: 1
          - select: >-
              changes[?resource_type=='event_gateway_schema_registry' && resource_ref=='{{ .vars.schemaRegistryRef }}'] | [0]
            expect:
              fields:
                action: CREATE
                resource_ref: "{{ .vars.schemaRegistryRef }}"
      - name: 002-apply-create
        outputFormat: json
        run:
          - apply
          - --plan
          - "{{ .workdir }}/plan-root-level.json"
          - --auto-approve
        assertions:
          - select: summary
            expect:
              fields:
                applied: 1
                failed: 0
      - name: 003-verify-create
        run:
          - get
          - event-gateway
          - schema-registries
          - --gateway-name
          - "{{ .vars.egwName }}"
          - -o
          - json
        assertions:
          - select: "length(@)"
            expect:
              fields:
                "@": 1
          - select: "[0]"
            expect:
              fields:
                name: default-schema-registry-name
                description: "Default root level Schema Registry description"
  - name: 006-sync-delete-root-level
    inputOverlayDirs:
      - overlays/004-sync-delete-root-level-declaration
    commands:
      - name: 001-plan-sync-delete-root-level
        outputFormat: disable
        stdoutFile: "{{ .workdir }}/plan-sync-delete-root-level.json"
        run:
          - plan
          - -f
          - "{{ .workdir }}/config.yaml"
          - --mode
          - sync
        assertions:
          - select: metadata
            expect:
              fields:
                mode: sync
          - select: summary
            expect:
              fields:
                total_changes: 1
                by_action.DELETE: 1
          - select: >-
              changes[?resource_type=='event_gateway_schema_registry' && resource_ref=='{{ .vars.schemaRegistryName }}'] | [0]
            expect:
              fields:
                action: DELETE
                resource_ref: "{{ .vars.schemaRegistryName }}"
      - name: 002-sync-delete-root-level
        outputFormat: json
        run:
          - sync
          - --plan
          - "{{ .workdir }}/plan-sync-delete-root-level.json"
          - --auto-approve
        assertions:
          - select: summary
            expect:
              fields:
                applied: 1
                failed: 0
      - name: 003-verify-delete-root-level
        run:
          - get
          - event-gateway
          - schema-registries
          - --gateway-name
          - "{{ .vars.egwName }}"
          - -o
          - json
        assertions:
          - select: "length(@)"
            expect:
              fields:
                "@": 0
