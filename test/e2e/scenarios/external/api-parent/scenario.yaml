baseInputsPath: testdata

vars:
  api_name: External Parent API
  portal_name: External Parent Portal
  auth_strategy_name: external-parent-auth
  team_name: external-api-consumers

steps:
  - name: 000-reset-org
    skipInputs: true
    commands:
      - resetOrg: true

  - name: 001-bootstrap-external-resources
    skipInputs: true
    commands:
      - name: 000-create-api
        create:
          resource: api
          payload:
            inline:
              name: "{{ .vars.api_name }}"
              description: API owned outside kongctl declarative management
          recordVar:
            name: api_id
            responsePath: id
      - name: 001-create-portal
        create:
          resource: portal
          payload:
            inline:
              name: "{{ .vars.portal_name }}"
              display_name: External Parent Portal
          recordVar:
            name: portal_id
            responsePath: id
      - name: 002-create-auth-strategy
        create:
          resource: auth_strategy
          payload:
            inline:
              name: "{{ .vars.auth_strategy_name }}"
              display_name: External Parent Auth
              strategy_type: key_auth
              configs:
                key-auth:
                  key_names:
                    - X-API-Key
          recordVar:
            name: auth_strategy_id
            responsePath: id

  - name: 002-sync-version-under-external-api
    commands:
      - name: 000-plan-create
        outputFormat: disable
        run:
          - plan
          - -f
          - "{{ .workdir }}/external-api.yaml"
          - --mode
          - sync
        assertions:
          - select: "changes[?resource_type=='api']"
            expect:
              fields:
                "length(@)": 0
          - select: "changes[?resource_type=='api_version'] | [0]"
            expect:
              fields:
                action: CREATE
                parent.id: "{{ .vars.api_id }}"
          - select: "changes[?resource_type=='api_publication'] | [0]"
            expect:
              fields:
                action: CREATE
                parent.id: "{{ .vars.api_id }}"
                "fields.auth_strategy_ids[0]": "{{ .vars.auth_strategy_id }}"
          - select: "changes[?resource_type=='organization_team_role'] | [0]"
            expect:
              fields:
                action: CREATE
                fields.entity_id: "{{ .vars.api_id }}"
                fields.entity_type_name: APIs

      - name: 001-sync
        run: ["sync", "-f", "{{ .workdir }}/external-api.yaml", "--auto-approve"]
        assertions:
          - select: summary
            expect:
              fields:
                failed: 0
                status: success

      - name: 002-get-api-versions
        run: ["get", "api", "versions", "--api-id", "{{ .vars.api_id }}", "-o", "json"]
        assertions:
          - select: "@"
            expect:
              fields:
                "length(@)": 1
                "[0].version": v1

      - name: 003-get-api-publications
        run: ["get", "api", "publications", "--api-id", "{{ .vars.api_id }}", "-o", "json"]
        assertions:
          - select: "@"
            expect:
              fields:
                "length(@)": 1
                "[0].portal_id": "{{ .vars.portal_id }}"
                "[0].visibility": public
                "length([0].auth_strategy_ids)": 1
                "[0].auth_strategy_ids[0]": "{{ .vars.auth_strategy_id }}"

      - name: 004-get-team-roles
        run: ["get", "org", "team", "roles", "--team-name", "{{ .vars.team_name }}", "-o", "json"]
        assertions:
          - select: "@"
            expect:
              fields:
                "length(@)": 1
                "[0].role_name": Viewer
                "[0].entity_id": "{{ .vars.api_id }}"
                "[0].entity_type_name": APIs
                "[0].entity_region": us

  - name: 003-sync-idempotent
    commands:
      - name: 000-plan-noop
        outputFormat: disable
        run: ["plan", "-f", "{{ .workdir }}/external-api.yaml", "--mode", "sync"]
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 0

  - name: 004-sync-delete-children-under-external-api
    inputOverlayDirs:
      - overlays/002-empty-api-children
    commands:
      - name: 000-plan-delete
        outputFormat: disable
        run:
          - plan
          - -f
          - "{{ .workdir }}/external-api.yaml"
          - --mode
          - sync
        assertions:
          - select: "changes[?resource_type=='api']"
            expect:
              fields:
                "length(@)": 0
          - select: "changes[?resource_type=='api_version' && action=='DELETE']"
            expect:
              fields:
                "length(@)": 1
          - select: "changes[?resource_type=='api_publication' && action=='DELETE']"
            expect:
              fields:
                "length(@)": 1
          - select: summary
            expect:
              fields:
                total_changes: 2
                by_action.DELETE: 2

      - name: 001-sync
        run: ["sync", "-f", "{{ .workdir }}/external-api.yaml", "--auto-approve"]
        assertions:
          - select: summary
            expect:
              fields:
                failed: 0
                status: success

      - name: 002-get-api-versions
        run: ["get", "api", "versions", "--api-name", "{{ .vars.api_name }}", "-o", "json"]
        assertions:
          - select: "@"
            expect:
              fields:
                "length(@)": 0

      - name: 003-get-api-publications
        run: ["get", "api", "publications", "--api-name", "{{ .vars.api_name }}", "-o", "json"]
        assertions:
          - select: "@"
            expect:
              fields:
                "length(@)": 0

      - name: 004-get-external-api
        run: ["get", "apis", "-o", "json"]
        assertions:
          - select: "[?name=='{{ .vars.api_name }}'] | [0]"
            expect:
              fields:
                id: "{{ .vars.api_id }}"
                name: "{{ .vars.api_name }}"

  - name: 005-reset-org
    skipInputs: true
    commands:
      - resetOrg: true
