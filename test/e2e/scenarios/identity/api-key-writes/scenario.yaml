defaults:
  retry:
    attempts: 1
log-level: trace
test:
  cleanupResources:
    - resource: identity_directory
      useDefaultDirectory: true
      nameVar: directory_name
      nameEnv: KONGCTL_E2E_KEY_WRITE_DIRECTORY_NAME
  info: Verify generated/imported principal and group key capture, complete public reads, expiration and principal-name updates, rotation and explicit deletion. Preserve management maps and declarative parent state; reject unsupported group name changes. Runtime authentication is outside this administrative scenario.
steps:
  - name: 001-api-key-lifecycle
    skipInputs: true
    commands:
      - name: create-directory
        create:
          resource: identity_directory
          useDefaultDirectory: true
          payload:
            inline:
              name: '{{ .vars.directory_name }}'
              allow_all_control_planes: true
              vault_enabled: false
          recordVar:
            name: directory_id
            responsePath: id
      - name: verify-api-key-lifecycle
        timeout: 4m
        exec:
          - python3
          - '{{ .scenario_dir }}/lifecycle.py'
          - '{{ .bin }}'
          - '{{ .vars.directory_id }}'
          - '{{ .vars.directory_name }}'
          - '{{ .workdir }}'
        env:
          KONGCTL_PROFILE: e2e
        parseAs: json
        assertions:
          - select: '@'
            expect:
              fields:
                generated_and_imported: true
                private_capture_and_sources: true
                expiration_and_name_updates: true
                complete_public_pagination: true
                ownership_preserved: true
                wrong_parent_rejected: true
                explicit_rotation_and_retirement: true
                declarative_parent_guards: true
                unsupported_changes_rejected: true
                output_formats: 3
                private_workspace_removed: true
                fixtures_removed: true
