steps:
- commands:
  - create:
      payload:
        inline:
          audience: https://api.example.test
          name: '{{ .vars.server_name }}'
      recordVar:
        name: server_id
        responsePath: id
      resource: identity_auth_server
    name: create-server
    retry:
      attempts: 1
  - create:
      payload:
        inline:
          audience: https://other.example.test
          name: '{{ .vars.other_server_name }}'
      recordVar:
        name: other_server_id
        responsePath: id
      resource: identity_auth_server
    name: create-other-server
    retry:
      attempts: 1
  - create:
      endpointParams:
        authServerId: '{{ .vars.server_id }}'
      payload:
        inline:
          name: kongctl-e2e-{{ .vars.server_id }}-scope-0
      recordVar:
        name: scope_0
        responsePath: id
      resource: identity_auth_server_scope
    name: create-scope-0
    retry:
      attempts: 1
  - create:
      endpointParams:
        authServerId: '{{ .vars.server_id }}'
      payload:
        inline:
          name: kongctl-e2e-{{ .vars.server_id }}-scope-1
      recordVar:
        name: scope_1
        responsePath: id
      resource: identity_auth_server_scope
    name: create-scope-1
    retry:
      attempts: 1
  - create:
      endpointParams:
        authServerId: '{{ .vars.server_id }}'
      payload:
        inline:
          access_token_duration: 600
          allow_all_scopes: false
          allow_scopes:
          - '{{ .vars.scope_0 }}'
          - '{{ .vars.scope_1 }}'
          grant_types:
          - client_credentials
          id_token_duration: 900
          labels:
            e2e-fixture: '{{ .vars.server_id }}'
            team: platform
          login_uri: https://client.example.test/login
          name: kongctl-e2e-{{ .vars.server_id }}-client-0
          redirect_uris:
          - https://client.example.test/callback
          response_types: []
          token_endpoint_auth_method: client_secret_basic
      recordVar:
        name: client_0
        responsePath: id
      resource: identity_auth_server_client
    name: create-client-0
    retry:
      attempts: 1
  - create:
      endpointParams:
        authServerId: '{{ .vars.server_id }}'
      payload:
        inline:
          access_token_duration: 600
          allow_all_scopes: false
          allow_scopes:
          - '{{ .vars.scope_0 }}'
          - '{{ .vars.scope_1 }}'
          grant_types:
          - client_credentials
          id_token_duration: 900
          labels:
            e2e-fixture: '{{ .vars.server_id }}'
            team: platform
          login_uri: https://client.example.test/login
          name: kongctl-e2e-{{ .vars.server_id }}-client-1
          redirect_uris:
          - https://client.example.test/callback
          response_types: []
          token_endpoint_auth_method: client_secret_basic
      recordVar:
        name: client_1
        responsePath: id
      resource: identity_auth_server_client
    name: create-client-1
    retry:
      attempts: 1
  - create:
      endpointParams:
        authServerId: '{{ .vars.server_id }}'
        clientId: '{{ .vars.client_0 }}'
      payload:
        inline:
          enabled: false
      recordVar:
        name: disabled_secret
        responsePath: id
      resource: identity_auth_server_client_secret
    name: create-disabled-secret
    retry:
      attempts: 1
  - assertions:
    - expect:
        fields:
          length(@): 2
          length([?client_secret != `null`]): 0
          length([].allow_scopes[]): 4
      select: '@'
    name: list-clients-paginated
    run:
    - get
    - identity
    - auth-server-clients
    - --auth-server-id
    - '{{ .vars.server_id }}'
    - --page-size
    - "1"
  - assertions:
    - expect:
        fields:
          access_token_duration: 600
          allow_all_scopes: false
          contains(keys(@), 'client_secret'): false
          grant_types:
          - client_credentials
          id_token_duration: 900
          labels.team: platform
          length(allow_scopes): 2
          login_uri: https://client.example.test/login
          name: kongctl-e2e-{{ .vars.server_id }}-client-0
          redirect_uris:
          - https://client.example.test/callback
          response_types: []
          token_endpoint_auth_method: client_secret_basic
      select: '@'
    name: get-client-by-name
    run:
    - get
    - identity
    - auth-server-client
    - --client-name
    - kongctl-e2e-{{ .vars.server_id }}-client-0
    - --auth-server-name
    - '{{ .vars.server_name }}'
    - --page-size
    - "1"
  - assertions:
    - expect:
        fields:
          id: '{{ .vars.client_0 }}'
      select: '@'
    name: get-client-opaque-id
    run:
    - get
    - identity
    - auth-server-client
    - '{{ .vars.client_0 }}'
    - --auth-server-id
    - '{{ .vars.server_id }}'
  - expectFailure:
      contains: "404"
      exitCode: 1
    name: client-parent-isolation
    outputFormat: disable
    run:
    - get
    - identity
    - auth-server-client
    - '{{ .vars.client_0 }}'
    - --auth-server-id
    - '{{ .vars.other_server_id }}'
  - assertions:
    - expect:
        fields:
          length(@): 2
          length([?enabled == `false`]): 1
          length([?enabled == `true`]): 1
          length([?secret != `null`]): 0
      select: '@'
    name: list-secret-metadata-paginated
    run:
    - get
    - identity
    - auth-server-client-secrets
    - --auth-server-id
    - '{{ .vars.server_id }}'
    - --client-id
    - '{{ .vars.client_0 }}'
    - --page-size
    - "1"
  - assertions:
    - expect:
        fields:
          contains(keys(@), 'created_at'): true
          contains(keys(@), 'secret'): false
          contains(keys(@), 'updated_at'): true
          enabled: false
      select: '@'
    name: get-disabled-secret
    run:
    - get
    - identity
    - auth-server-client-secret
    - '{{ .vars.disabled_secret }}'
    - --auth-server-id
    - '{{ .vars.server_id }}'
    - --client-id
    - '{{ .vars.client_0 }}'
  - assertions:
    - expect:
        fields:
          length(@): 2
          length([?secret != `null`]): 0
      select: '@'
    name: list-secrets-by-client-name
    parseAs: yaml
    run:
    - list
    - identity
    - auth-server-client-secrets
    - --auth-server-id
    - '{{ .vars.server_id }}'
    - --client-name
    - kongctl-e2e-{{ .vars.server_id }}-client-0
    - --page-size
    - "1"
    - -o
    - yaml
  - expectFailure:
      contains: "404"
      exitCode: 1
    name: secret-client-isolation
    outputFormat: disable
    run:
    - get
    - identity
    - auth-server-client-secret
    - '{{ .vars.disabled_secret }}'
    - --auth-server-id
    - '{{ .vars.server_id }}'
    - --client-id
    - '{{ .vars.client_1 }}'
  - assertions:
    - expect:
        fields:
          length(@): 2
      select: '@'
    name: list-clients-yaml
    parseAs: yaml
    run:
    - list
    - identity
    - auth-server-clients
    - --auth-server-id
    - '{{ .vars.server_id }}'
    - -o
    - yaml
  - assertions:
    - expect:
        fields:
          contains(stdout, 'NAME'): true
          contains(stdout, 'client_secret'): false
      select: '@'
    name: list-clients-text
    parseAs: raw
    run:
    - list
    - identity
    - auth-server-clients
    - --auth-server-id
    - '{{ .vars.server_id }}'
    - -o
    - text
  - assertions:
    - expect:
        fields:
          contains(stdout, 'client_secret_basic'): true
      select: '@'
    name: get-client-text
    parseAs: raw
    run:
    - get
    - identity
    - auth-server-client
    - '{{ .vars.client_0 }}'
    - --auth-server-id
    - '{{ .vars.server_id }}'
    - -o
    - text
  - assertions:
    - expect:
        fields:
          contains(stdout, 'ENABLED'): true
      select: '@'
    name: list-secrets-text
    parseAs: raw
    run:
    - list
    - identity
    - auth-server-client-secrets
    - --auth-server-id
    - '{{ .vars.server_id }}'
    - --client-id
    - '{{ .vars.client_0 }}'
    - -o
    - text
  - assertions:
    - expect:
        fields:
          contains(stdout, '"secret":'): false
          contains(stdout, 'false'): true
      select: '@'
    name: get-secret-text
    parseAs: raw
    run:
    - get
    - identity
    - auth-server-client-secret
    - '{{ .vars.disabled_secret }}'
    - --auth-server-id
    - '{{ .vars.server_id }}'
    - --client-id
    - '{{ .vars.client_0 }}'
    - -o
    - text
  - expectFailure:
      contains: auth-server-id
      exitCode: 1
    name: reject-no-parent
    outputFormat: disable
    run:
    - get
    - identity
    - auth-server-clients
  - expectFailure:
      contains: client-id
      exitCode: 1
    name: reject-no-client
    outputFormat: disable
    run:
    - get
    - identity
    - auth-server-client-secrets
    - --auth-server-id
    - '{{ .vars.server_id }}'
  - expectFailure:
      contains: not both
      exitCode: 1
    name: reject-client-selector-conflict
    outputFormat: disable
    run:
    - get
    - identity
    - auth-server-client
    - '{{ .vars.client_0 }}'
    - --auth-server-id
    - '{{ .vars.server_id }}'
    - --client-name
    - machine
  name: 001-inspection
  skipInputs: true
test:
  cleanupResources:
  - nameEnv: KONGCTL_E2E_OAUTH_SERVER_NAME
    nameVar: server_name
    resource: identity_auth_server
  - nameEnv: KONGCTL_E2E_OAUTH_OTHER_SERVER_NAME
    nameVar: other_server_name
    resource: identity_auth_server
