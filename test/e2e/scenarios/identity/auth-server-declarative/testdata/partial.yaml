_defaults:
  kongctl: {namespace: identity-auth-decl-e2e}
identity:
  auth_servers:
    - ref: issuer
      name: !env KONGCTL_E2E_AUTH_DECL_SERVER_NAME
      audience: https://api.example.test
      scopes:
        - ref: read-scope
          name: !env KONGCTL_E2E_AUTH_DECL_READ_NAME
          description: Partial scope
      claims:
        - ref: department
          name: !env KONGCTL_E2E_AUTH_DECL_DEPARTMENT_NAME
          value: '${ uuidv4 }'
