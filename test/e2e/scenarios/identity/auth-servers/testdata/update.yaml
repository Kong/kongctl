_defaults:
  kongctl: {namespace: identity-auth-e2e}
identity:
  auth_servers:
    - ref: issuer
      name: !env KONGCTL_E2E_IDENTITY_AUTH_SERVER_NAME
      audience: https://updated-api.example.test
      description: Updated auth server
      signing_algorithm: PS256
      trusted_origins: [https://updated-client.example.test]
      dcr: {default_access_token_duration: 900}
      labels: {}
