defaults:
  retry:
    attempts: 1
log-level: error
test:
  privateTempDirVar: secret_dir
  cleanupResources:
    - resource: identity_directory
      useDefaultDirectory: true
      nameVar: directory_name
      nameEnv: KONGCTL_E2E_CREDENTIAL_READ_DIRECTORY_NAME
  info: >-
    Inspect principal/group API keys, basic-auth passwords, OAuth client secrets
    and pending shared Vault credentials. Direct API fixtures are setup only;
    product commands are get/list. Verify pagination, detail selectors, public
    output formats and exclusion of credential material and enrollment URLs.
    Preserve the default directory.
steps:
  - name: credential-metadata-reads
    skipInputs: true
    commands:
      - name: prepare-default-directory
        create:
          resource: identity_directory
          useDefaultDirectory: true
          payload:
            inline:
              name: '{{ .vars.directory_name }}'
              vault_enabled: true
          recordVar:
            name: directory_id
            responsePath: id
      - name: inspect-public-credential-metadata
        timeout: 5m
        exec:
          - python3
          - '{{ .scenario_dir }}/lifecycle.py'
          - '{{ .bin }}'
          - '{{ .vars.secret_dir }}'
          - '{{ .workdir }}'
          - '{{ .vars.directory_id }}'
        env:
          KONGCTL_PROFILE: e2e
        parseAs: json
        assertions:
          - select: '@'
            expect:
              fields:
                principal_and_group_keys: true
                basic_auth_passwords: true
                oauth_secret_metadata: true
                shared_vault_metadata: true
                pagination_and_details: true
                public_output_formats: true
                secrets_and_capabilities_excluded: true
                fixtures_removed: true
                directory_preserved: true
