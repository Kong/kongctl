defaults:
  retry:
    attempts: 1
log-level: trace
test:
  cleanupResources:
    - resource: identity_directory
      useDefaultDirectory: true
      nameVar: directory_name
      nameEnv: KONGCTL_E2E_DECLARATIVE_KEY_DIRECTORY_NAME
  info: >-
    Verify generated principal/group key declarations under managed parents and
    an external directory. Cover private capture, saved plans, inherited
    authority, principal-key renaming, nullable expiration, dump, scoped sync,
    replacement ordering and guarded deletion while preserving foreign/imported
    keys. Group-key renaming and null-name clearing run only in .tech until
    production supports these updates; .com reports both checks as deferred.
steps:
  - name: 001-generated-key-lifecycle
    skipInputs: true
    commands:
      - name: create-directory
        create:
          resource: identity_directory
          useDefaultDirectory: true
          payload:
            inline:
              name: '{{ .vars.directory_name }}'
              allow_all_control_planes: true
              vault_enabled: false
          recordVar:
            name: directory_id
            responsePath: id
      - name: verify-generated-key-lifecycle
        timeout: 5m
        exec:
          - python3
          - '{{ .scenario_dir }}/lifecycle.py'
          - '{{ .bin }}'
          - '{{ .vars.directory_id }}'
          - '{{ .vars.directory_name }}'
          - '{{ .workdir }}'
        env:
          KONGCTL_PROFILE: e2e
        parseAs: json
        assertions:
          - select: '@'
            expect:
              fields:
                generated_declarations: true
                saved_plan_capture_preflight: true
                inherited_parent_authority: true
                principal_rename_and_nullable_expiration_updates: true
                dump_reload: true
                foreign_imported_and_legacy_preserved: true
                explicit_collection_sync: true
                replacement_before_retirement: true
                child_before_parent_deletion: true
                duplicate_and_legacy_ref_guards: true
                private_workspace_removed: true
                fixtures_removed: true
