baseInputsPath: testdata
defaults:
  mask:
    dropKeys:
      - id
      - created_at
      - updated_at
      - resource_id
      - change_id
      - generated_at
env:
  KONGCTL_LOG_LEVEL: info
steps:
  - commands:
      - assertions:
          - expect:
              fields:
                type: object
            select: '@'
        name: explain
        run:
          - explain
          - identity.directory
          - -o
          - json
      - assertions:
          - expect:
              fields:
                contains(stdout, 'directories:'): true
                contains(stdout, 'identity:'): true
            select: '@'
        name: scaffold
        outputFormat: disable
        parseAs: raw
        run:
          - scaffold
          - identity.directory
    name: 001-schema
  - commands:
      - assertions:
          - expect:
              fields:
                total_changes: 2
            select: summary
        name: plan-create
        outputFormat: disable
        run:
          - plan
          - -f
          - '{{ .workdir }}/initial.yaml'
          - --mode
          - apply
        stdoutFile: '{{ .workdir }}/create.json'
      - assertions:
          - expect:
              fields:
                applied: 2
                failed: 0
            select: summary
        name: apply-saved-plan
        run:
          - apply
          - --plan
          - '{{ .workdir }}/create.json'
          - --auto-approve
      - assertions:
          - expect:
              fields:
                allow_all_control_planes: true
                description: Initial directory
                labels.team: identity
                length(allowed_control_planes): 1
                managed_by."kongctl-namespace": '{{ .vars.namespace }}'
                managed_by."kongctl-protected": "false"
                managed_by.tool: kongctl
                name: '{{ .vars.directory_name }}'
                negative_ttl_secs: 450
                ttl_secs: 900
                vault_enabled: false
            select: '@'
        name: verify-directory
        recordVar:
          name: directory_id
          responsePath: id
        run:
          - get
          - identity
          - directory
          - '{{ .vars.directory_name }}'
      - assertions:
          - expect:
              fields:
                name: '{{ .vars.directory_name }}'
            select: '[?name==''{{ .vars.directory_name }}''] | [0]'
        name: list
        run:
          - list
          - identity
          - directories
      - assertions:
          - expect:
              fields:
                total_changes: 0
            select: summary
        name: no-op
        outputFormat: disable
        run:
          - plan
          - -f
          - '{{ .workdir }}/initial.yaml'
          - --mode
          - apply
    name: 002-create
  - name: 002a-principal-reads
    commands:
      - name: create-user-principal
        create:
          resource: identity_principal
          endpointParams:
            directoryId: '{{ .vars.directory_id }}'
          payload:
            inline:
              display_name: Shared display name
              description: Inspection fixture
              labels:
                e2e-fixture: '{{ .vars.directory_id }}'
              metadata:
                department: engineering
                attempts: 3
                trusted: false
                roles: [reader, writer]
                numbers: [1, 2]
              managed_by:
                tool: kongctl
                version: e2e
                kongctl-namespace: '{{ .vars.namespace }}'
                kongctl-protected: "false"
                kongctl-ref: user-fixture
              type: user
          recordVar:
            name: principal_user_id
            responsePath: id
      - name: create-agent-principal
        create:
          resource: identity_principal
          endpointParams:
            directoryId: '{{ .vars.directory_id }}'
          payload:
            inline:
              display_name: Shared display name
              description: Inspection fixture
              labels:
                e2e-fixture: '{{ .vars.directory_id }}'
              metadata:
                department: engineering
                attempts: 3
                trusted: false
                roles: [reader, writer]
                numbers: [1, 2]
              managed_by:
                tool: kongctl
                version: e2e
                kongctl-namespace: '{{ .vars.namespace }}'
                kongctl-protected: "false"
                kongctl-ref: agent-fixture
              type: agent
          recordVar:
            name: principal_agent_id
            responsePath: id
      - name: create-unclassified-principal
        create:
          resource: identity_principal
          endpointParams:
            directoryId: '{{ .vars.directory_id }}'
          payload:
            inline:
              display_name: Shared display name
              description: Inspection fixture
              labels:
                e2e-fixture: '{{ .vars.directory_id }}'
              metadata:
                department: engineering
                attempts: 3
                trusted: false
                roles: [reader, writer]
                numbers: [1, 2]
              managed_by:
                tool: kongctl
                version: e2e
                kongctl-namespace: '{{ .vars.namespace }}'
                kongctl-protected: "false"
                kongctl-ref: unclassified-fixture
          recordVar:
            name: principal_unclassified_id
            responsePath: id
      - name: list-principals-by-directory-id
        run: [get, identity, principals, --directory-id, "{{ .vars.directory_id }}"]
        assertions:
          - select: "length([?display_name=='Shared display name'])"
            expect:
              fields:
                '@': 3
      - name: list-principals-by-directory-name
        run: [list, identity, principals, --directory-name, "{{ .vars.directory_name }}"]
        assertions:
          - select: "[?type=='agent'] | [0]"
            expect:
              fields:
                display_name: Shared display name
                type: agent
                metadata.trusted: false
                metadata.attempts: 3
      - name: get-principal-by-id
        run: [get, identity, principal, "{{ .vars.principal_user_id }}", --directory-name, "{{ .vars.directory_name }}"]
        assertions:
          - select: '@'
            expect:
              fields:
                display_name: Shared display name
                type: user
                metadata.roles: [reader, writer]
                metadata.numbers: [1, 2]
                managed_by."kongctl-ref": user-fixture
      - name: display-name-is-not-an-identifier
        run: [get, identity, principal, "Shared display name", --directory-id, "{{ .vars.directory_id }}"]
        expectFailure:
          exitCode: 1
          contains: display names are not unique
      - name: delete-user-principal
        run: [api, delete, "/v2/directories/{{ .vars.directory_id }}/principals/{{ .vars.principal_user_id }}"]
      - name: delete-agent-principal
        run: [api, delete, "/v2/directories/{{ .vars.directory_id }}/principals/{{ .vars.principal_agent_id }}"]
      - name: delete-unclassified-principal
        run: [api, delete, "/v2/directories/{{ .vars.directory_id }}/principals/{{ .vars.principal_unclassified_id }}"]
  -
    "name": "002b-principal-declarative"
    env:
      "KONGCTL_E2E_IDENTITY_DIRECTORY_ID": "{{ .vars.directory_id }}"
    commands:
      -
        "name": "principal-explain"
        run:
          - "explain"
          - "identity.principals"
          - "-o"
          - "json"
        assertions:
          -
            "select": "@"
            expect:
              "fields": {"type": "object"}
      -
        "name": "principal-plan-create"
        run:
          - "plan"
          - "-f"
          - "{{ .workdir }}/principals-initial.yaml"
          - "--mode"
          - "apply"
        assertions:
          -
            "select": "summary"
            expect:
              fields:
                "total_changes": 3
        "outputFormat": "disable"
        "stdoutFile": "{{ .workdir }}/principals-plan.json"
      -
        "name": "principal-apply-saved"
        run:
          - "apply"
          - "--plan"
          - "{{ .workdir }}/principals-plan.json"
          - "--auto-approve"
        assertions:
          -
            "select": "summary"
            expect:
              fields:
                "applied": 3
                "failed": 0
      -
        "name": "principal-no-op"
        run:
          - "plan"
          - "-f"
          - "{{ .workdir }}/principals-initial.yaml"
          - "--mode"
          - "apply"
        assertions:
          -
            "select": "summary"
            expect:
              fields:
                "total_changes": 0
        "outputFormat": "disable"
      -
        "name": "principal-list-created"
        run:
          - "get"
          - "identity"
          - "principals"
          - "--directory-id"
          - "{{ .vars.directory_id }}"
        assertions:
          -
            "select": "@"
            expect:
              fields:
                "length(@)": 3
                "length([?display_name=='Shared declarative display name'])": 2
                "length([?managed_by.\"kongctl-ref\"=='human'])": 1
      -
        "name": "principal-update"
        run:
          - "apply"
          - "-f"
          - "{{ .workdir }}/principals-update.yaml"
          - "--auto-approve"
        assertions:
          -
            "select": "summary"
            expect:
              fields:
                "applied": 1
                "failed": 0
      -
        "name": "principal-partial"
        run:
          - "apply"
          - "-f"
          - "{{ .workdir }}/principals-partial.yaml"
          - "--auto-approve"
        assertions:
          -
            "select": "summary"
            expect:
              fields:
                "applied": 1
                "failed": 0
      -
        "name": "principal-verify-preserved"
        run:
          - "get"
          - "identity"
          - "principals"
          - "--directory-id"
          - "{{ .vars.directory_id }}"
        assertions:
          -
            "select": "[?managed_by.\"kongctl-ref\"=='human'] | [0]"
            expect:
              fields:
                "description": ""
                "type": "user"
                "length(metadata)": 0
                "length(labels)": 1
                "managed_by.\"kongctl-ref\"": "human"
                "managed_by.\"kongctl-namespace\"": "identity-principal-e2e"
                "length(managed_by)": 5
      -
        "name": "principal-reject-type-change"
        run:
          - "plan"
          - "-f"
          - "{{ .workdir }}/principals-type-change.yaml"
          - "--mode"
          - "apply"
        expectFailure:
          "exitCode": 1
          "contains": "Q9"
        "outputFormat": "disable"
      -
        "name": "principal-reject-type-null"
        run:
          - "plan"
          - "-f"
          - "{{ .workdir }}/principals-type-null.yaml"
          - "--mode"
          - "apply"
        expectFailure:
          "exitCode": 1
          "contains": "Q9"
        "outputFormat": "disable"
      -
        "name": "principal-reject-active"
        run:
          - "plan"
          - "-f"
          - "{{ .workdir }}/principals-active.yaml"
          - "--mode"
          - "apply"
        expectFailure:
          "exitCode": 1
          "contains": "Q10"
        "outputFormat": "disable"
      -
        "name": "principal-dump"
        run:
          - "dump"
          - "declarative"
          - "--resources"
          - "identity.directories"
          - "--include-child-resources"
          - "--default-namespace"
          - "{{ .vars.namespace }}"
        assertions:
          -
            "select": "identity.directories[0]"
            expect:
              fields:
                "length(principals)": 3
                "length(principals[?active!=null])": 0
        "outputFormat": "none"
        "parseAs": "yaml"
        "stdoutFile": "{{ .workdir }}/principals-dump.yaml"
      -
        "name": "principal-dump-no-op"
        run:
          - "plan"
          - "-f"
          - "{{ .workdir }}/principals-dump.yaml"
          - "--mode"
          - "apply"
        assertions:
          -
            "select": "summary"
            expect:
              fields:
                "total_changes": 0
        "outputFormat": "disable"
      -
        "name": "principal-protect"
        run:
          - "apply"
          - "-f"
          - "{{ .workdir }}/principals-protect.yaml"
          - "--auto-approve"
        assertions:
          -
            "select": "summary"
            expect:
              fields:
                "applied": 1
                "failed": 0
      -
        "name": "principal-protected-sync"
        run:
          - "sync"
          - "-f"
          - "{{ .workdir }}/principals-empty.yaml"
          - "--auto-approve"
        expectFailure:
          "exitCode": 1
          "contains": "protected"
      -
        "name": "principal-unprotect"
        run:
          - "apply"
          - "-f"
          - "{{ .workdir }}/principals-unprotect.yaml"
          - "--auto-approve"
        assertions:
          -
            "select": "summary"
            expect:
              fields:
                "applied": 1
                "failed": 0
      -
        "name": "principal-create-unowned"
        create:
          "resource": "identity_principal"
          endpointParams:
            "directoryId": "{{ .vars.directory_id }}"
          payload:
            inline:
              "display_name": "Before adoption"
              "type": "user"
              labels:
                "e2e-fixture": "{{ .vars.directory_id }}"
              metadata:
                "retained": true
          recordVar:
            "name": "principal_adopt_id"
            "responsePath": "id"
      -
        "name": "principal-reject-adopt-collision"
        run:
          - "adopt"
          - "identity"
          - "principal"
          - "{{ .vars.principal_adopt_id }}"
          - "--directory-id"
          - "{{ .vars.directory_id }}"
          - "--ref"
          - "human"
          - "--namespace"
          - "identity-principal-e2e"
        expectFailure:
          "exitCode": 1
          "contains": "another principal"
      -
        "name": "principal-adopt"
        run:
          - "adopt"
          - "identity"
          - "principal"
          - "{{ .vars.principal_adopt_id }}"
          - "--directory-name"
          - "{{ .vars.directory_name }}"
          - "--ref"
          - "adopted"
          - "--namespace"
          - "identity-principal-e2e"
        assertions:
          -
            "select": "@"
            expect:
              fields:
                "namespace": "identity-principal-e2e"
      -
        "name": "principal-apply-adopted"
        run:
          - "apply"
          - "-f"
          - "{{ .workdir }}/principals-adopt.yaml"
          - "--auto-approve"
        assertions:
          -
            "select": "summary"
            expect:
              fields:
                "applied": 1
                "failed": 0
      -
        "name": "principal-delete-adopted"
        run:
          - "delete"
          - "-f"
          - "{{ .workdir }}/principals-adopt.yaml"
          - "--auto-approve"
        assertions:
          -
            "select": "summary"
            expect:
              fields:
                "applied": 1
                "failed": 0
      -
        "name": "principal-sync-omitted"
        run:
          - "plan"
          - "-f"
          - "{{ .workdir }}/principals-omitted.yaml"
          - "--mode"
          - "sync"
        assertions:
          -
            "select": "summary"
            expect:
              fields:
                "total_changes": 0
        "outputFormat": "disable"
      -
        "name": "principal-sync-empty"
        run:
          - "sync"
          - "-f"
          - "{{ .workdir }}/principals-empty.yaml"
          - "--auto-approve"
        assertions:
          -
            "select": "summary"
            expect:
              fields:
                "applied": 3
                "failed": 0
      -
        "name": "principal-verify-empty"
        run:
          - "get"
          - "identity"
          - "principals"
          - "--directory-name"
          - "{{ .vars.directory_name }}"
        assertions:
          -
            "select": "@"
            expect:
              fields:
                "length(@)": 0
  - commands:
      - assertions:
          - expect:
              fields:
                failed: 0
                status: success
            select: summary
        name: update-all-fields
        run:
          - apply
          - -f
          - '{{ .workdir }}/update.yaml'
          - --auto-approve
      - assertions:
          - expect:
              fields:
                description: Updated directory
                length(allowed_control_planes): 0
                length(labels): 0
                negative_ttl_secs: 600
                ttl_secs: 1200
                vault_enabled: false
            select: '@'
        name: verify-updated
        run:
          - get
          - identity
          - directory
          - '{{ .vars.directory_name }}'
      - assertions:
          - expect:
              fields:
                failed: 0
                status: success
            select: summary
        name: partial-update
        run:
          - apply
          - -f
          - '{{ .workdir }}/partial.yaml'
          - --auto-approve
      - assertions:
          - expect:
              fields:
                allow_all_control_planes: true
                description: Partial update
                length(allowed_control_planes): 0
                length(labels): 0
                negative_ttl_secs: 600
                ttl_secs: 1200
                vault_enabled: false
            select: '@'
        name: verify-preserved
        run:
          - get
          - identity
          - directory
          - '{{ .vars.directory_name }}'
      - assertions:
          - expect:
              fields:
                total_changes: 0
            select: summary
        name: no-op-partial
        outputFormat: disable
        run:
          - plan
          - -f
          - '{{ .workdir }}/partial.yaml'
          - --mode
          - apply
    name: 003-update-and-preserve
  - commands:
      - assertions:
          - expect:
              fields:
                description: Partial update
                managed_by: null
                name: '{{ .vars.directory_name }}'
                ttl_secs: 1200
                vault_enabled: false
            select: identity.directories[0]
        name: dump
        outputFormat: none
        parseAs: yaml
        run:
          - dump
          - declarative
          - --resources
          - identity.directories
          - --default-namespace
          - '{{ .vars.namespace }}'
        stdoutFile: '{{ .workdir }}/dump.yaml'
      - assertions:
          - expect:
              fields:
                total_changes: 0
            select: summary
        name: dump-no-op
        outputFormat: disable
        run:
          - plan
          - -f
          - '{{ .workdir }}/dump.yaml'
          - --mode
          - apply
      - assertions:
          - expect:
              fields:
                applied: 0
                failed: 0
            select: summary
        name: dump-apply
        run:
          - apply
          - -f
          - '{{ .workdir }}/dump.yaml'
          - --auto-approve
    name: 004-dump-round-trip
  - commands:
      - assertions:
          - expect:
              fields:
                total_changes: 0
            select: summary
        name: external-no-op
        outputFormat: disable
        run:
          - plan
          - -f
          - '{{ .workdir }}/external.yaml'
          - --mode
          - sync
      - assertions:
          - expect:
              fields:
                total_changes: 0
            select: summary
        name: omitted-leaves-directory
        outputFormat: disable
        run:
          - plan
          - -f
          - '{{ .workdir }}/omitted.yaml'
          - --mode
          - sync
      - assertions:
          - expect:
              fields:
                name: '{{ .vars.directory_name }}'
            select: '@'
        name: verify-retained
        run:
          - get
          - identity
          - directory
          - '{{ .vars.directory_name }}'
    name: 005-external-and-scope
  - commands:
      - assertions:
          - expect:
              fields:
                failed: 0
                status: success
            select: summary
        name: protect
        run:
          - apply
          - -f
          - '{{ .workdir }}/protected.yaml'
          - --auto-approve
      - expectFailure:
          contains: protected
          exitCode: 1
        name: protected-update-blocked
        run:
          - apply
          - -f
          - '{{ .workdir }}/blocked.yaml'
          - --auto-approve
      - expectFailure:
          contains: protected
          exitCode: 1
        name: protected-sync-blocked
        run:
          - sync
          - -f
          - '{{ .workdir }}/empty.yaml'
          - --auto-approve
      - assertions:
          - expect:
              fields:
                total_changes: 1
            select: summary
        name: plan-unprotect
        outputFormat: disable
        run:
          - plan
          - -f
          - '{{ .workdir }}/unprotect.yaml'
          - --mode
          - apply
        stdoutFile: '{{ .workdir }}/unprotect.json'
      - assertions:
          - expect:
              fields:
                failed: 0
            select: summary
        name: apply-unprotect
        run:
          - apply
          - --plan
          - '{{ .workdir }}/unprotect.json'
          - --auto-approve
      - assertions:
          - expect:
              fields:
                description: Partial update
                managed_by."kongctl-protected": "false"
                vault_enabled: false
            select: '@'
        name: verify-unprotected
        run:
          - get
          - identity
          - directory
          - '{{ .vars.directory_name }}'
    name: 006-protection
  - commands:
      - assertions:
          - expect:
              fields:
                applied: 1
                failed: 0
            select: summary
        name: sync-explicit-empty
        run:
          - sync
          - -f
          - '{{ .workdir }}/empty.yaml'
          - --auto-approve
      - assertions:
          - expect:
              fields:
                '@': 0
            select: length([?name=='{{ .vars.directory_name }}'])
        name: verify-gone
        run:
          - get
          - identity
          - directories
    name: 007-sync-delete
  - commands:
      - create:
          expectStatus: 201
          payload:
            inline:
              allow_all_control_planes: true
              description: Unmanaged directory
              labels:
                team: identity
              name: '{{ .vars.directory_name }}'
              negative_ttl_secs: 450
              ttl_secs: 900
              vault_enabled: false
          resource: identity_directory
        name: create-unmanaged
      - expectFailure:
          contains: explicitly adopt
          exitCode: 1
        name: refuse-implicit-adoption
        run:
          - plan
          - -f
          - '{{ .workdir }}/delete.yaml'
      - assertions:
          - expect:
              fields:
                namespace: '{{ .vars.namespace }}'
            select: '@'
        name: adopt
        run:
          - adopt
          - identity
          - directory
          - '{{ .vars.directory_name }}'
          - --namespace
          - '{{ .vars.namespace }}'
      - assertions:
          - expect:
              fields:
                description: Unmanaged directory
                labels.team: identity
                managed_by."kongctl-namespace": '{{ .vars.namespace }}'
                managed_by.tool: kongctl
                negative_ttl_secs: 450
                ttl_secs: 900
                vault_enabled: false
            select: '@'
        name: verify-adopted-settings
        run:
          - get
          - identity
          - directory
          - '{{ .vars.directory_name }}'
      - assertions:
          - expect:
              fields:
                total_changes: 0
            select: summary
        name: adopted-no-op
        outputFormat: disable
        run:
          - plan
          - -f
          - '{{ .workdir }}/delete.yaml'
          - --mode
          - apply
      - expectFailure:
          contains: --overwrite-namespace
          exitCode: 1
        name: require-explicit-takeover
        run:
          - adopt
          - identity
          - directory
          - '{{ .vars.directory_name }}'
          - --namespace
          - '{{ .vars.namespace }}'
      - assertions:
          - expect:
              fields:
                namespace: '{{ .vars.namespace }}'
            select: '@'
        name: explicit-adopt-overwrite
        run:
          - adopt
          - identity
          - directory
          - '{{ .vars.directory_name }}'
          - --namespace
          - '{{ .vars.namespace }}'
          - --overwrite-namespace
    name: 008-adopt-unmanaged
  - commands:
      - assertions:
          - expect:
              fields:
                applied: 1
                failed: 0
            select: summary
        name: delete-directory
        run:
          - delete
          - -f
          - '{{ .workdir }}/delete.yaml'
          - --auto-approve
      - assertions:
          - expect:
              fields:
                applied: 1
                failed: 0
            select: summary
        name: delete-gateway
        run:
          - delete
          - -f
          - '{{ .workdir }}/gateway.yaml'
          - --auto-approve
      - assertions:
          - expect:
              fields:
                '@': 0
            select: length([?name=='{{ .vars.directory_name }}'])
        name: verify-gone
        run:
          - get
          - identity
          - directories
    name: 009-explicit-delete
test:
  cleanupResources:
    - resource: identity_directory
      nameVar: directory_name
      nameEnv: KONGCTL_E2E_IDENTITY_DIRECTORY_NAME
    - resource: control_plane
      nameVar: gateway_name
      nameEnv: KONGCTL_E2E_IDENTITY_GATEWAY_NAME
