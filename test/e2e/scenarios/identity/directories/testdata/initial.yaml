_defaults:
  kongctl:
    namespace: "identity-directory-e2e"
control_planes:
  - ref: identity-gateway
    name: !env KONGCTL_E2E_IDENTITY_GATEWAY_NAME
identity:
  directories:
    - ref: people
      name: !env KONGCTL_E2E_IDENTITY_DIRECTORY_NAME
      description: Initial directory
      allow_all_control_planes: true
      allowed_control_planes:
        - !ref identity-gateway#id
      ttl_secs: 900
      negative_ttl_secs: 450
      vault_enabled: false
      labels:
        team: identity
