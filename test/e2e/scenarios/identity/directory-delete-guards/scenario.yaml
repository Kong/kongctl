defaults:
  retry:
    attempts: 1
log-level: trace
test:
  cleanupResources:
    - resource: identity_directory
      useDefaultDirectory: true
      nameVar: directory_name
      nameEnv: KONGCTL_E2E_DIRECTORY_GUARD_NAME
      requireEmptyVaultDependencies: true
    - resource: identity_auth_server
      nameVar: server_name
      nameEnv: KONGCTL_E2E_DIRECTORY_GUARD_SERVER_NAME
  info: Verify directory deletion refuses attached Vault keys/providers/Trusted IdPs and disabled-Vault observations. Exercise direct delete, scoped sync, delete planning and saved plans with late children/setting changes. Explicitly remove verified descendants before deleting the directory; no implicit enabling or API cascade is authorized.
steps:
  - name: 001-directory-deletion-guards
    skipInputs: true
    commands:
      - name: create-directory
        create:
          resource: identity_directory
          useDefaultDirectory: true
          payload:
            inline:
              name: '{{ .vars.directory_name }}'
              allow_all_control_planes: true
              vault_enabled: true
          recordVar:
            name: directory_id
            responsePath: id
      - name: create-issuer
        create:
          resource: identity_auth_server
          payload:
            inline:
              name: '{{ .vars.server_name }}'
              audience: https://identity-directory-guard.example.test
          recordVar:
            name: server_id
            responsePath: id
      - name: verify-deletion-guards
        timeout: 5m
        exec:
          - python3
          - '{{ .scenario_dir }}/guards.py'
          - '{{ .bin }}'
          - '{{ .workdir }}'
          - '{{ .vars.directory_id }}'
          - '{{ .vars.directory_name }}'
          - '{{ .vars.server_id }}'
        env:
          KONGCTL_PROFILE: e2e
        parseAs: json
        assertions:
          - select: '@'
            expect:
              fields:
                attached_families: 3
                planning_and_scoped_sync: true
                saved_plan_rechecks: true
                disabled_vault_blocks: true
                observations_do_not_enable: true

                fixtures_removed: true
