defaults:
  retry:
    attempts: 1
log-level: trace
test:
  cleanupResources:
    - resource: identity_directory
      useDefaultDirectory: true
      nameVar: directory_name
      nameEnv: KONGCTL_E2E_ORG_IMPORT_DIRECTORY_NAME
      requireEmptyVaultDependencies: true
  info: Verify explicit full-file organization-chart preview/execution, private complete reports, safe diagnostic output, adoption/re-import/manager/departure behavior, cost-center omission/clearing, returning inactive users, validation failures and private workspace cleanup. This is an operational CSV workflow, not a declarative import resource.
steps:
  - name: 001-org-chart-import-lifecycle
    skipInputs: true
    commands:
      - name: create-directory
        create:
          resource: identity_directory
          useDefaultDirectory: true
          payload:
            inline:
              name: '{{ .vars.directory_name }}'
              allow_all_control_planes: true
              vault_enabled: true
          recordVar:
            name: directory_id
            responsePath: id
      - name: verify-org-chart-import
        timeout: 4m
        exec:
          - python3
          - '{{ .scenario_dir }}/lifecycle.py'
          - '{{ .bin }}'
          - '{{ .vars.directory_id }}'
          - '{{ .vars.directory_name }}'
          - '{{ .workdir }}'
        env:
          KONGCTL_PROFILE: e2e
        parseAs: json
        assertions:
          - select: '@'
            expect:
              fields:
                dry_run_preserves_state: true
                complete_private_reports: true
                safe_counts_and_notices: true
                explicit_execution_and_adoption: true
                repeat_ids_and_manager_changes: true
                cost_omission_and_clearing: true
                departures_and_inactive_returns: true
                errors_and_local_guards: true
                private_workspace_removed: true
                fixtures_removed: true
