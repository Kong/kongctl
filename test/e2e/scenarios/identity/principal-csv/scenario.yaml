defaults:
  retry:
    attempts: 1
log-level: trace
test:
  cleanupResources:
    - resource: identity_directory
      useDefaultDirectory: true
      nameVar: directory_name
      nameEnv: KONGCTL_E2E_PRINCIPAL_CSV_DIRECTORY_NAME
  info: Verify principal CSV declarations, offline inspection, typed nested resources, private generated-key capture, UUID assertions, execution-time metadata merge, explicit replacement/clearing, saved-plan compatibility, dump/reload, scoped sync and preserved unmanaged principals.
steps:
  - name: 001-principal-csv-lifecycle
    skipInputs: true
    commands:
      - name: create-directory
        create:
          resource: identity_directory
          useDefaultDirectory: true
          payload:
            inline:
              name: '{{ .vars.directory_name }}'
              allow_all_control_planes: true
              vault_enabled: false
          recordVar:
            name: directory_id
            responsePath: id
      - name: verify-principal-csv
        timeout: 5m
        exec:
          - python3
          - '{{ .scenario_dir }}/lifecycle.py'
          - '{{ .bin }}'
          - '{{ .vars.directory_id }}'
          - '{{ .vars.directory_name }}'
          - '{{ .workdir }}'
        env:
          KONGCTL_PROFILE: e2e
        parseAs: json
        assertions:
          - select: '@'
            expect:
              fields:
                offline_inspection: true
                typed_principal_and_nested_import: true
                generated_key_private_capture: true
                uuid_assertion_guards: true
                fresh_metadata_merge: true
                metadata_replacement_and_clear: true
                plan_version_guards: true
                dump_reload: true
                scoped_sync_and_foreign_preservation: true
                csv_inputs_not_copied: true
                private_workspace_removed: true
                fixtures_removed: true
