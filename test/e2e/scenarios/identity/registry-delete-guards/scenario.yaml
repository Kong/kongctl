defaults:
  retry:
    attempts: 1
log-level: trace
test:
  cleanupResources:
    - resource: identity_directory
      nameVar: directory_name
      nameEnv: KONGCTL_E2E_REGISTRY_GUARD_DIRECTORY_NAME
      requireEmptyVaultDependencies: true
  info: Global Registry Agent references block principal and directory retirement during delete, scoped sync and saved execution. Complete inventories and dangling principal associations are observed without granting Registry mutation authority. Removed private workspaces contain all CLI traces.
steps:
  - name: 001-registry-reference-retirement-guards
    skipInputs: true
    commands:
      - name: verify-guards
        timeout: 5m
        exec:
          - python3
          - '{{ .scenario_dir }}/lifecycle.py'
          - '{{ .bin }}'
          - '{{ .vars.directory_name }}'
          - '{{ .workdir }}'
        env:
          KONGCTL_PROFILE: e2e
        parseAs: json
        assertions:
          - select: '@'
            expect:
              fields:
                managed_identity_fixture: true
                principal_delete_and_sync_blocked: true
                saved_execution_observes_late_links: true
                directory_dangling_target_blocked: true
                reads_and_updates_preserved: true
                configured_host_only: true
                registry_get_only: true
                unlink_allows_retirement: true
                private_workspace_removed: true
                fixtures_removed: true
