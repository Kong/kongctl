defaults:
  retry:
    attempts: 1
log-level: trace
test:
  cleanupResources:
    - resource: identity_directory
      useDefaultDirectory: true
      nameVar: directory_name
      nameEnv: KONGCTL_E2E_TRUSTED_IDP_DIRECTORY_NAME
      requireEmptyTrustedIdPs: true
    - resource: identity_auth_server
      nameVar: server_name
      nameEnv: KONGCTL_E2E_TRUSTED_IDP_SERVER_NAME
  info: Requires directory Token Vault availability. Inspect issuer-scoped Trusted IdPs and associated principals using a disposable auth server for reachable OIDC discovery and JWKS. Verify all public configuration, duplicate display names, real cursor traversal, explicit product selection, JSON/YAML/text and external-directory declarative principal associations. Native IdPs are explicitly removed before guarded directory teardown; trust configuration writes remain a separate declarative slice.
steps:
  - name: 001-trusted-idp-inspection
    skipInputs: true
    commands:
      - name: create-directory
        create:
          resource: identity_directory
          useDefaultDirectory: true
          payload:
            inline:
              name: '{{ .vars.directory_name }}'
              allow_all_control_planes: true
              vault_enabled: true
          recordVar:
            name: directory_id
            responsePath: id
      - name: create-issuer
        create:
          resource: identity_auth_server
          payload:
            inline:
              name: '{{ .vars.server_name }}'
              audience: https://identity-trust-e2e.example.test
          recordVar:
            name: server_id
            responsePath: id
      - name: verify-trusted-idp-reads-and-associations
        timeout: 5m
        exec:
          - python3
          - '{{ .scenario_dir }}/inspection.py'
          - '{{ .bin }}'
          - '{{ .workdir }}'
          - '{{ .vars.directory_id }}'
          - '{{ .vars.directory_name }}'
          - '{{ .vars.server_id }}'
          - '{{ .vars.server_name }}'
        env:
          KONGCTL_PROFILE: e2e
        parseAs: json
        assertions:
          - select: '@'
            expect:
              fields:
                trusted_idps: 3
                associated_principals: 2
                output_formats: 3
                exact_issuer_selection: true
                real_idp_pagination: true
                real_principal_pagination: true
                external_directory_declarative_principals: true
                vault_disabled_reported: true
                inspection_preserves_configuration: true
                fixtures_removed: true
