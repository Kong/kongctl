defaults:
  retry:
    attempts: 1
log-level: trace
test:
  cleanupResources:
    - resource: identity_directory
      nameVar: directory_name
      nameEnv: KONGCTL_E2E_VAULT_KEYS_DIRECTORY_NAME
      requireEmptyVaultDependencies: true
  info: Requires Token Vault availability and capacity for a temporary directory. Verify RFC 7638 matching, public inspection with real pagination, explicit parent adoption, declarative create/rename/material rotation, omitted and empty scoped sync, dump/reload, saved authority checks, five-key quota and ordered guarded directory deletion. Fixtures contain public keys only; no runtime encryption or private-key retention claim is made.
steps:
  - name: 001-vault-key-lifecycle
    skipInputs: true
    commands:
      - name: create-directory
        create:
          resource: identity_directory
          payload:
            inline:
              name: '{{ .vars.directory_name }}'
              allow_all_control_planes: true
              vault_enabled: true
          recordVar:
            name: directory_id
            responsePath: id
      - name: verify-vault-key-lifecycle
        exec:
          - python3
          - '{{ .scenario_dir }}/lifecycle.py'
          - '{{ .bin }}'
          - '{{ .workdir }}'
          - '{{ .vars.directory_id }}'
          - '{{ .vars.directory_name }}'
        env:
          KONGCTL_PROFILE: e2e
        parseAs: json
        assertions:
          - select: '@'
            expect:
              fields:
                public_key_algorithms: 2
                output_formats: 3
                real_pagination: true
                explicit_parent_adoption: true
                fingerprint_identity_and_rename: true
                scoped_sync_and_rotation: true
                saved_authority_checks: true
                five_key_limit: true
                dump_reload: true
                guarded_ordered_deletion: true
                fixtures_removed: true
