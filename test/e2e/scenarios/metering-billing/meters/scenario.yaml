test:
  enabledByEnvVar: KONGCTL_E2E_METERING_BILLING
baseInputsPath: testdata
steps:
  - name: 001-lifecycle
    commands:
      - name: cleanup-previous-run
        run: [sync, -f, '{{ .workdir }}/empty.yaml', --auto-approve]
        outputFormat: json
      - name: create
        run: [apply, -f, '{{ .workdir }}/config.yaml', --auto-approve]
        outputFormat: json
        assertions:
          - select: summary
            expect:
              fields: {failed: 0, status: success}
      - name: repeat-plan
        run: [plan, -f, '{{ .workdir }}/config.yaml']
        outputFormat: disable
        assertions:
          - select: summary
            expect:
              fields: {total_changes: 0}
      - name: get-by-key
        run: [get, metering-billing, meter, kongctl_e2e_request_count]
        outputFormat: json
        assertions:
          - select: '@'
            expect:
              fields:
                key: kongctl_e2e_request_count
                labels."KONGCTL-namespace": mb-meter-e2e
      - name: dump
        run: [dump, --resources, meters, --filter-name, E2E Request Count]
        outputFormat: yaml
        assertions:
          - select: 'meters[0]'
            expect:
              fields: {key: kongctl_e2e_request_count, event_type: kongctl.e2e.request}
      - name: cleanup
        run: [sync, -f, '{{ .workdir }}/empty.yaml', --auto-approve]
        outputFormat: json
        assertions:
          - select: summary
            expect:
              fields: {failed: 0, status: success}
