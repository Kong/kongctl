                "[0].resource_type": organization_team_role
                "[0].resource_name": "{{ .vars.invalidRoleRef }}"
                "[0].resource_ref": "{{ .vars.invalidRoleRef }}"
                "contains([0].error, 'role_name \"Admin\"')": true
                "contains([0].error, 'entity_type_name \"AI Gateways\"')": true
                "contains([0].error, 'kongctl api get /v3/roles --base-url https://global.api.konghq.com')": true
                "contains([0].error, 'The requested role was not found')": true
                "contains([0].error, 'instance')": true
                "contains([0].error, '[unknown]')": false

