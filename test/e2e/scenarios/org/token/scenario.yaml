# PAT and SPAT Token Lifecycle E2E Scenario
#
# This scenario tests the kongctl CLI's token management commands:
#   - create pat, get pat, delete pat (Personal Access Token)
#   - create spat, get spat, delete spat (System Account Personal Access Token)
#
# Test flow:
#  1. Reset org (cleans up system accounts and other org resources)
#  2. PAT lifecycle:
#     a. Create a PAT (-o json), assert token/id/name/expires_at fields, record pat_id
#     b. Verify -o token and -o env formats, then delete the format-test PATs
#     c. List PATs and assert the new PAT is present
#     d. Get PAT by name, assert fields
#     e. Get PAT by ID, assert fields
#     f. Delete PAT by name
#     g. Verify PAT no longer appears in the list
#  3. SPAT lifecycle:
#     a. Create a system account via harness API, record sa_id
#     b. Create a SPAT by system account ID, assert fields, record spat_id
#     c. Create a SPAT by system account name, assert resolved fields
#     d. Verify -o token and -o env formats, then delete the format-test SPATs
#     e. List SPATs by ID and name, assert both tokens are present
#     f. Get each SPAT by token name using its system account selector
#     g. Delete each SPAT by token name using its system account selector
#     h. Verify both SPATs are absent using both system account selectors

env:
  KONGCTL_LOG_LEVEL: info

test:
  assignedEnvironment: kongctl-acceptance

vars:
  pat_name: e2e-pat
  spat_name: e2e-spat
  name_resolved_spat_name: e2e-spat-by-sa-name
  system_account_name: e2e-token-test-sa

steps:
  - name: 000-reset-org
    skipInputs: true
    commands:
      - resetOrg: true

  # ── PAT lifecycle ─────────────────────────────────────────────────────────────

  - name: 001-create-pat
    skipInputs: true
    commands:
      - name: 000-create-pat-json
        outputFormat: json
        run:
          - create
          - pat
          - --name
          - "{{ .vars.pat_name }}"
          - --expires-in
          - 24h
        recordVars:
          - name: pat_id
            responsePath: id
        assertions:
          - select: >-
              {
                name: name,
                id_present: length(id) > `0`,
                token_present: length(token) > `0`,
                expires_at_present: length(expires_at) > `0`
              }
            expect:
              fields:
                name: "{{ .vars.pat_name }}"
                id_present: true
                token_present: true
                expires_at_present: true

  - name: 002-create-pat-token-format
    skipInputs: true
    commands:
      - name: 000-create-pat-token-output
        run:
          - create
          - pat
          - --name
          - "{{ .vars.pat_name }}-token-fmt"
          - --expires-in
          - 24h
          - -o
          - token
        parseAs: raw
        assertions:
          - select: >-
              {
                stdout_present: length(stdout) > `1`,
                raw_token: !contains(stdout, ' ') && ends_with(stdout, `"\n"`)
              }
            expect:
              fields:
                stdout_present: true
                raw_token: true

      - name: 001-delete-pat-token-fmt
        run:
          - delete
          - pat
          - "{{ .vars.pat_name }}-token-fmt"
          - --auto-approve

  - name: 003-create-pat-env-format
    skipInputs: true
    commands:
      - name: 000-create-pat-env-output
        run:
          - create
          - pat
          - --name
          - "{{ .vars.pat_name }}-env-fmt"
          - --expires-in
          - 24h
          - -o
          - env
        parseAs: raw
        assertions:
          - select: >-
              {
                export_present: starts_with(stdout, `"export KONGCTL_E2E_KONNECT_PAT='"`),
                token_present: length(stdout) > length(`"export KONGCTL_E2E_KONNECT_PAT=''\n"`),
                quoted: ends_with(stdout, `"'\n"`)
              }
            expect:
              fields:
                export_present: true
                token_present: true
                quoted: true

      - name: 001-delete-pat-env-fmt
        run:
          - delete
          - pat
          - "{{ .vars.pat_name }}-env-fmt"
          - --auto-approve

  - name: 004-get-pat-list
    skipInputs: true
    commands:
      - name: 000-list-pats
        outputFormat: json
        run:
          - get
          - pat
        assertions:
          - select: "[?name=='{{ .vars.pat_name }}'] | [0]"
            expect:
              fields:
                name: "{{ .vars.pat_name }}"
                id: "{{ .vars.pat_id }}"

  - name: 005-get-pat-by-name
    skipInputs: true
    commands:
      - name: 000-get-pat-by-name
        outputFormat: json
        run:
          - get
          - pat
          - "{{ .vars.pat_name }}"
        assertions:
          - expect:
              fields:
                name: "{{ .vars.pat_name }}"
                id: "{{ .vars.pat_id }}"

  - name: 006-get-pat-by-id
    skipInputs: true
    commands:
      - name: 000-get-pat-by-id
        outputFormat: json
        run:
          - get
          - pat
          - "{{ .vars.pat_id }}"
        assertions:
          - expect:
              fields:
                id: "{{ .vars.pat_id }}"
                name: "{{ .vars.pat_name }}"

  - name: 007-delete-pat
    skipInputs: true
    commands:
      - name: 000-delete-pat-by-name
        run:
          - delete
          - pat
          - "{{ .vars.pat_name }}"
          - --auto-approve

  - name: 008-verify-pat-deleted
    skipInputs: true
    commands:
      - name: 000-list-pats-after-delete
        outputFormat: json
        run:
          - get
          - pat
        assertions:
          - select: "[?name=='{{ .vars.pat_name }}']"
            expect:
              fields:
                "length(@)": 0
          - select: "[?name=='{{ .vars.pat_name }}-token-fmt']"
            expect:
              fields:
                "length(@)": 0
          - select: "[?name=='{{ .vars.pat_name }}-env-fmt']"
            expect:
              fields:
                "length(@)": 0

  # ── SPAT lifecycle ────────────────────────────────────────────────────────────

  - name: 009-create-system-account
    skipInputs: true
    commands:
      - name: 000-create-system-account
        create:
          resource: system-account
          payload:
            inline:
              name: "{{ .vars.system_account_name }}"
              description: "E2E system account for token lifecycle test"
          recordVar:
            name: sa_id
            responsePath: id

  - name: 010-create-spat
    skipInputs: true
    commands:
      - name: 000-create-spat-json
        outputFormat: json
        run:
          - create
          - spat
          - --system-account-id
          - "{{ .vars.sa_id }}"
          - --name
          - "{{ .vars.spat_name }}"
          - --expires-in
          - 24h
        recordVars:
          - name: spat_id
            responsePath: id
        assertions:
          - select: >-
              {
                name: name,
                system_account_id: system_account_id,
                token_present: length(token) > `0`,
                expires_at_present: length(expires_at) > `0`
              }
            expect:
              fields:
                name: "{{ .vars.spat_name }}"
                system_account_id: "{{ .vars.sa_id }}"
                token_present: true
                expires_at_present: true

  - name: 011-create-spat-by-system-account-name
    skipInputs: true
    commands:
      - name: 000-create-spat-json
        outputFormat: json
        run:
          - create
          - spat
          - --system-account-name
          - "{{ .vars.system_account_name }}"
          - --name
          - "{{ .vars.name_resolved_spat_name }}"
          - --expires-in
          - 24h
        recordVars:
          - name: name_resolved_spat_id
            responsePath: id
        assertions:
          - select: >-
              {
                name: name,
                system_account_id: system_account_id,
                system_account_name: system_account_name,
                token_present: length(token) > `0`,
                expires_at_present: length(expires_at) > `0`
              }
            expect:
              fields:
                name: "{{ .vars.name_resolved_spat_name }}"
                system_account_id: "{{ .vars.sa_id }}"
                system_account_name: "{{ .vars.system_account_name }}"
                token_present: true
                expires_at_present: true

  - name: 012-create-spat-token-format
    skipInputs: true
    commands:
      - name: 000-create-spat-token-output
        run:
          - create
          - spat
          - --system-account-id
          - "{{ .vars.sa_id }}"
          - --name
          - "{{ .vars.spat_name }}-token-fmt"
          - --expires-in
          - 24h
          - -o
          - token
        parseAs: raw
        assertions:
          - select: >-
              {
                stdout_present: length(stdout) > `1`,
                raw_token: !contains(stdout, ' ') && ends_with(stdout, `"\n"`)
              }
            expect:
              fields:
                stdout_present: true
                raw_token: true

      - name: 001-delete-spat-token-fmt
        run:
          - delete
          - spat
          - "{{ .vars.spat_name }}-token-fmt"
          - --system-account-id
          - "{{ .vars.sa_id }}"
          - --auto-approve

  - name: 013-create-spat-env-format
    skipInputs: true
    commands:
      - name: 000-create-spat-env-output
        run:
          - create
          - spat
          - --system-account-id
          - "{{ .vars.sa_id }}"
          - --name
          - "{{ .vars.spat_name }}-env-fmt"
          - --expires-in
          - 24h
          - -o
          - env
        parseAs: raw
        assertions:
          - select: >-
              {
                export_present: starts_with(stdout, `"export KONGCTL_E2E_KONNECT_PAT='"`),
                token_present: length(stdout) > length(`"export KONGCTL_E2E_KONNECT_PAT=''\n"`),
                quoted: ends_with(stdout, `"'\n"`)
              }
            expect:
              fields:
                export_present: true
                token_present: true
                quoted: true

      - name: 001-delete-spat-env-fmt
        run:
          - delete
          - spat
          - "{{ .vars.spat_name }}-env-fmt"
          - --system-account-id
          - "{{ .vars.sa_id }}"
          - --auto-approve

  - name: 014-get-spat-list
    skipInputs: true
    commands:
      - name: 000-list-spats
        outputFormat: json
        run:
          - get
          - spat
          - --system-account-id
          - "{{ .vars.sa_id }}"
        assertions:
          - select: "[?name=='{{ .vars.spat_name }}'] | [0]"
            expect:
              fields:
                name: "{{ .vars.spat_name }}"
                id: "{{ .vars.spat_id }}"

  - name: 015-get-spat-list-by-system-account-name
    skipInputs: true
    commands:
      - name: 000-list-spats
        outputFormat: json
        run:
          - get
          - spat
          - --system-account-name
          - "{{ .vars.system_account_name }}"
        assertions:
          - select: "[?name=='{{ .vars.spat_name }}'] | [0]"
            expect:
              fields:
                name: "{{ .vars.spat_name }}"
                id: "{{ .vars.spat_id }}"
                system_account_id: "{{ .vars.sa_id }}"
                system_account_name: "{{ .vars.system_account_name }}"
          - select: "[?name=='{{ .vars.name_resolved_spat_name }}'] | [0]"
            expect:
              fields:
                name: "{{ .vars.name_resolved_spat_name }}"
                id: "{{ .vars.name_resolved_spat_id }}"
                system_account_id: "{{ .vars.sa_id }}"
                system_account_name: "{{ .vars.system_account_name }}"

  - name: 016-get-spat-by-name
    skipInputs: true
    commands:
      - name: 000-get-spat-by-name
        outputFormat: json
        run:
          - get
          - spat
          - --system-account-id
          - "{{ .vars.sa_id }}"
          - "{{ .vars.spat_name }}"
        assertions:
          - expect:
              fields:
                name: "{{ .vars.spat_name }}"
                id: "{{ .vars.spat_id }}"
                system_account_id: "{{ .vars.sa_id }}"

  - name: 017-get-spat-by-system-account-name
    skipInputs: true
    commands:
      - name: 000-get-spat-by-name
        outputFormat: json
        run:
          - get
          - spat
          - --system-account-name
          - "{{ .vars.system_account_name }}"
          - "{{ .vars.name_resolved_spat_name }}"
        assertions:
          - expect:
              fields:
                name: "{{ .vars.name_resolved_spat_name }}"
                id: "{{ .vars.name_resolved_spat_id }}"
                system_account_id: "{{ .vars.sa_id }}"
                system_account_name: "{{ .vars.system_account_name }}"

  - name: 018-delete-spat
    skipInputs: true
    commands:
      - name: 000-delete-spat-by-name
        run:
          - delete
          - spat
          - "{{ .vars.spat_name }}"
          - --system-account-id
          - "{{ .vars.sa_id }}"
          - --auto-approve

  - name: 019-delete-spat-by-system-account-name
    skipInputs: true
    commands:
      - name: 000-delete-spat-by-name
        outputFormat: json
        run:
          - delete
          - spat
          - "{{ .vars.name_resolved_spat_name }}"
          - --system-account-name
          - "{{ .vars.system_account_name }}"
          - --auto-approve
        assertions:
          - expect:
              fields:
                name: "{{ .vars.name_resolved_spat_name }}"
                id: "{{ .vars.name_resolved_spat_id }}"
                status: deleted

  - name: 020-verify-spat-deleted
    skipInputs: true
    commands:
      - name: 000-list-spats-after-delete
        outputFormat: json
        run:
          - get
          - spat
          - --system-account-id
          - "{{ .vars.sa_id }}"
        assertions:
          - select: "[?name=='{{ .vars.spat_name }}']"
            expect:
              fields:
                "length(@)": 0
          - select: "[?name=='{{ .vars.name_resolved_spat_name }}']"
            expect:
              fields:
                "length(@)": 0

  - name: 021-verify-spats-deleted-by-system-account-name
    skipInputs: true
    commands:
      - name: 000-list-spats-after-delete
        outputFormat: json
        run:
          - get
          - spat
          - --system-account-name
          - "{{ .vars.system_account_name }}"
        assertions:
          - select: "[?name=='{{ .vars.spat_name }}']"
            expect:
              fields:
                "length(@)": 0
          - select: "[?name=='{{ .vars.name_resolved_spat_name }}']"
            expect:
              fields:
                "length(@)": 0
