_defaults:
  kongctl:
    namespace: app-auth-strategy-e2e

application_auth_strategies:
  - ref: key-auth-strategy-e2e
    name: key-auth-strategy-e2e
    display_name: Protected Update Should Fail
    strategy_type: key_auth
    configs:
      key_auth:
        key_names:
          - X-API-Key
          - Api-Key
    kongctl:
      protected: true
