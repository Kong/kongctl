baseInputsPath: testdata

env:
  KONGCTL_LOG_LEVEL: debug

vars:
  namespace: portal-customization
  portalRef: portal-customization
  customizationRef: portal-customization-settings

defaults:
  mask:
    dropKeys:
      - id
      - change_id
      - resource_id
      - generated_at
      - created_at
      - updated_at

steps:
  - name: 000-reset-org
    skipInputs: true
    commands:
      - resetOrg: true

  - name: 001-plan-apply-customization
    commands:
      - name: 000-plan-customization
        outputFormat: disable
        stdoutFile: "{{ .workdir }}/plan-customization.json"
        run:
          - plan
          - -f
          - "{{ .workdir }}/config.yaml"
          - --mode
          - apply
        assertions:
          - select: metadata
            expect:
              fields:
                mode: apply
          - select: summary
            expect:
              fields:
                total_changes: 2
                by_action.CREATE: 1
                by_action.UPDATE: 1
          - select: >-
              changes[?resource_type=='portal_customization' &&
              resource_ref=='{{ .vars.customizationRef }}'] | [0].fields
            expect:
              fields:
                "theme.mode": light
                "theme.colors.primary": "#8250FF"
                layout: topnav
                "spec_renderer.try_it_ui": true
                "spec_renderer.try_it_insomnia": true
                "spec_renderer.infinite_scroll": true
                "spec_renderer.show_schemas": true
                "spec_renderer.hide_internal": false
                "spec_renderer.hide_deprecated": false
                "spec_renderer.allow_custom_server_urls": true
                robots: "User-agent: *"
                "length(menu.main)": 3
                "length(menu.footer_sections)": 1
      - name: 001-apply-customization
        outputFormat: json
        run:
          - apply
          - --plan
          - "{{ .workdir }}/plan-customization.json"
          - --auto-approve
        assertions:
          - select: summary
            expect:
              fields:
                applied: 2
                failed: 0

  - name: 002-verify-no-op
    commands:
      - name: 000-plan-no-op
        outputFormat: disable
        stdoutFile: "{{ .workdir }}/plan-no-op.json"
        run:
          - plan
          - -f
          - "{{ .workdir }}/config.yaml"
          - --mode
          - apply
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 0

  - name: 003-update-customization
    inputOverlayDirs:
      - overlays/003-update
    commands:
      - name: 000-plan-customization-update
        outputFormat: disable
        stdoutFile: "{{ .workdir }}/plan-customization-update.json"
        run:
          - plan
          - -f
          - "{{ .workdir }}/config.yaml"
          - --mode
          - apply
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 1
                by_action.UPDATE: 1
          - select: >-
              changes[?resource_type=='portal_customization' &&
              resource_ref=='{{ .vars.customizationRef }}'] | [0].fields
            expect:
              fields:
                "theme.mode": dark
                "theme.colors.primary": "#FF5733"
                layout: sidebar
                "spec_renderer.try_it_ui": false
                "spec_renderer.try_it_insomnia": false
                "spec_renderer.infinite_scroll": false
                "spec_renderer.show_schemas": false
                "spec_renderer.hide_internal": true
                "spec_renderer.hide_deprecated": true
                "spec_renderer.allow_custom_server_urls": false
                robots: "User-agent: *\nDisallow: /internal"
                "length(menu.main)": 2
                "length(menu.footer_sections)": 1
      - name: 001-apply-customization-update
        outputFormat: json
        run:
          - apply
          - --plan
          - "{{ .workdir }}/plan-customization-update.json"
          - --auto-approve
        assertions:
          - select: summary
            expect:
              fields:
                applied: 1
                failed: 0

  - name: 004-verify-after-update
    inputOverlayDirs:
      - overlays/003-update
    commands:
      - name: 000-plan-after-update-no-op
        outputFormat: disable
        stdoutFile: "{{ .workdir }}/plan-after-update-no-op.json"
        run:
          - plan
          - -f
          - "{{ .workdir }}/config.yaml"
          - --mode
          - apply
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 0

  - name: 005-seed-all-menu-lists
    inputOverlayDirs:
      - overlays/003-update
    commands:
      - name: 000-record-portal-id
        outputFormat: json
        run:
          - get
          - portal
          - "{{ .vars.portalRef }}"
        recordVar:
          name: portalID
          responsePath: id
      - name: 001-seed-menu-lists
        outputFormat: json
        run:
          - api
          - patch
          - "/v3/portals/{{ .vars.portalID }}/customization"
          - --body-file
          - "{{ .workdir }}/seed-menu.json"
      - name: 002-verify-seeded-menu-lists
        outputFormat: json
        run:
          - api
          - get
          - "/v3/portals/{{ .vars.portalID }}/customization"
        assertions:
          - select: menu
            expect:
              fields:
                "length(main)": 1
                "length(footer_sections)": 1
                "length(footer_bottom)": 1

  - name: 006-clear-menu-lists
    inputOverlayDirs:
      - overlays/006-clear-menu
    commands:
      - name: 000-plan-clear-menu-lists
        outputFormat: disable
        stdoutFile: "{{ .workdir }}/plan-clear-menu-lists.json"
        run:
          - plan
          - -f
          - "{{ .workdir }}/config.yaml"
          - --mode
          - apply
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 1
                by_action.UPDATE: 1
      - name: 001-apply-clear-menu-lists
        outputFormat: json
        run:
          - apply
          - --plan
          - "{{ .workdir }}/plan-clear-menu-lists.json"
          - --auto-approve
        assertions:
          - select: summary
            expect:
              fields:
                applied: 1
                failed: 0
      - name: 002-verify-menu-lists-cleared-in-konnect
        outputFormat: json
        run:
          - api
          - get
          - "/v3/portals/{{ .vars.portalID }}/customization"
        assertions:
          - select: menu
            expect:
              fields:
                "length(main)": 0
                "length(footer_sections)": 0
                "length(footer_bottom)": 0
      - name: 003-plan-after-clear-no-op
        outputFormat: disable
        run:
          - plan
          - -f
          - "{{ .workdir }}/config.yaml"
          - --mode
          - apply
        assertions:
          - select: summary
            expect:
              fields:
                total_changes: 0

  - name: 007-delete-cleanup
    inputOverlayDirs:
      - overlays/006-clear-menu
    commands:
      - name: 000-delete
        outputFormat: json
        run:
          - delete
          - -f
          - "{{ .workdir }}/config.yaml"
          - --auto-approve
        assertions:
          - select: plan.metadata
            expect:
              fields:
                mode: delete
          - select: summary
            expect:
              fields:
                failed: 0
                status: success
