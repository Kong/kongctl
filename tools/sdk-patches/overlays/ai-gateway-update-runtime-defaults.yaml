overlay: 1.0.0
info:
  title: Preserve omitted runtime settings in AI Gateway updates
  version: 0.0.1
actions:
  - target: $.components.schemas.UpdateAIGatewayRequest.properties.runtime_auto_upgrade['$ref']
    remove: true
  - target: $.components.schemas.UpdateAIGatewayRequest.properties.runtime_auto_upgrade
    update:
      description: |
        Whether the control plane should automatically raise min_runtime_version
        to match the data plane fleet's minimum runtime version as it increases.
        Omit this field to preserve the current setting during an update.
      type: boolean
      example: true
